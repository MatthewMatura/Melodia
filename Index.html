<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Noteworthy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
<style>
:root{--bg:#0b0c1a;--card:#1a1c35;--surf:rgba(255,255,255,.04);--border:rgba(255,255,255,.09);--gold:#e8a820;--gold2:#f5c842;--text:#f0f0f8;--muted:rgba(240,240,248,.45);--orange:#ff7a30;--yellow:#e8c020;--green:#3ecf8e;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);padding:20px 13px 80px;min-height:100vh;}
.header{text-align:center;margin-bottom:20px;}
.hico{font-size:1.8rem;display:block;animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
h1{font-family:'DM Serif Display',serif;font-size:1.9rem;background:linear-gradient(120deg,#e8a820,#f5e060,#e8a820);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tagline{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px;}
.card-label{font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:9px;}
.fam-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.fam-btn{border:1.5px solid var(--border);background:var(--surf);border-radius:10px;padding:8px 4px 7px;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .18s;}
.fam-btn .fico{font-size:1.3rem;height:26px;display:flex;align-items:center;justify-content:center;}
.fam-btn .flbl{font-size:.58rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;}
.fam-btn.sel{border-color:var(--gold);background:rgba(232,168,32,.1);}
.fam-btn.sel .flbl{color:var(--gold);}
#instPanel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid rgba(232,168,32,.35);border-radius:14px;padding:11px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;}
#instPanel.open{display:block;}
.inst-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.inst-btn{border:1.5px solid var(--border);background:var(--surf);border-radius:11px;padding:9px 11px;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:9px;transition:all .18s;}
.inst-btn .iico{font-size:1.2rem;flex-shrink:0;}
.inst-btn .ilbl{font-size:.76rem;font-weight:600;color:var(--muted);}
.inst-btn .iclef{font-size:.57rem;color:rgba(240,240,248,.25);text-transform:uppercase;}
.inst-btn.sel{border-color:var(--gold);background:rgba(232,168,32,.1);}
.inst-btn.sel .ilbl{color:var(--gold);}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;font-size:.75rem;}
select{width:100%;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:500;padding:9px 28px 9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surf);color:var(--text);appearance:none;-webkit-appearance:none;cursor:pointer;}
.key-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-top:10px;}
.key-row::-webkit-scrollbar{display:none;}
.key-btn{flex-shrink:0;border:1.5px solid var(--border);background:var(--surf);border-radius:8px;padding:6px 11px;font-family:'Outfit',sans-serif;font-size:.81rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.key-btn.sel{border-color:var(--gold);background:rgba(232,168,32,.12);color:var(--gold);}
.key-info{font-size:.71rem;color:var(--muted);text-align:center;margin-top:7px;min-height:15px;}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:8px;}
.tbtn{border:none;background:none;font-family:'Outfit',sans-serif;font-size:.79rem;font-weight:600;padding:8px 4px;border-radius:8px;color:var(--muted);cursor:pointer;transition:all .18s;}
.tbtn.on{background:var(--gold);color:#0a0b18;}
.status{font-size:.73rem;font-weight:500;text-align:center;padding:3px 0;min-height:20px;color:var(--muted);}
.s-or{color:var(--orange)!important;}.s-gr{color:var(--green)!important;}
.clear-btn{display:none;width:100%;margin-top:7px;padding:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:.75rem;border-radius:7px;cursor:pointer;}
.clear-btn.show{display:block;}

/* Sheet card - position:relative for hotspots */
.sheet-card{background:#fff;border-radius:14px;padding:16px 8px 12px;
box-shadow:0 0 0 2px rgba(232,168,32,.2),0 12px 50px rgba(0,0,0,.6);
position:relative;}
.sheet-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(–gold),var(–gold2),var(–gold));}
#notation{width:100%;}
#notation svg{display:block;width:100%!important;height:auto!important;}
#notation svg path{fill:#111;stroke:#111;}
#notation svg ellipse{fill:#111;stroke:#111;}
#notation svg polygon{fill:#111;stroke:#111;}
#notation svg line{stroke:#111;}
#notation svg text{fill:#111;}

/* Note hotspots - HTML divs positioned over SVG notes */
.nhs{position:absolute;z-index:20;cursor:pointer;
background:rgba(232,168,32,.25);border:1px solid rgba(232,168,32,.5);
border-radius:4px;transition:background .15s;}
.nhs:active{background:rgba(232,168,32,.6);}

/* Highlight classes applied to SVG note <g> elements */
.hl-or path,.hl-or ellipse,.hl-or polygon{fill:var(–orange)!important;stroke:var(–orange)!important;}
.hl-yw path,.hl-yw ellipse,.hl-yw polygon{fill:var(–yellow)!important;stroke:var(–yellow)!important;}

/* Debug bar */
#dbg{font-size:.65rem;color:var(–muted);text-align:center;margin-top:5px;min-height:14px;}

/* Popup */
#pov{display:none;position:fixed;inset:0;z-index:200;}
#pov.on{display:block;}
#popup{display:none;position:fixed;z-index:201;background:#1a1c35;border:1px solid rgba(232,168,32,.4);border-radius:18px;padding:17px 17px 14px;min-width:224px;max-width:272px;box-shadow:0 16px 50px rgba(0,0,0,.8);}
#popup.on{display:block;animation:pop .16s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.px{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.07);border:none;width:24px;height:24px;border-radius:50%;color:var(–muted);font-size:.68rem;cursor:pointer;font-family:‘Outfit’,sans-serif;}
.pnote{font-family:‘DM Serif Display’,serif;font-size:2.4rem;text-align:center;background:linear-gradient(135deg,#e8a820,#f5e060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pinst{font-size:.64rem;font-weight:600;text-align:center;color:var(–muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.plbl{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(232,168,32,.65);margin-bottom:7px;}
#pDiag{display:flex;justify-content:center;margin-bottom:5px;}
.ptip{font-size:.69rem;color:var(–muted);text-align:center;line-height:1.4;margin-top:6px;}
.open-tag{text-align:center;margin-bottom:8px;}
.open-tag span{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(–green);border-radius:20px;padding:3px 13px;font-size:.73rem;font-weight:700;}
</style>

</head>
<body>

<div class="header"><span class="hico">🎵</span><h1>Noteworthy</h1><p style="font-size:.7rem;color:var(--green);font-weight:600;margin-top:4px;">✓ Pipeline test</p></div>

<div class="card" style="position:relative;">
  <div class="card-label">Your Instrument</div>
  <div class="fam-tabs" id="famTabs"></div>
  <div id="instPanel"><div class="inst-grid" id="instGrid"></div></div>
</div>

<div class="card">
  <div class="card-label">Song</div>
  <div class="sel-wrap"><select id="sMelody" onchange="doRender()">
    <option value="ode">Ode to Joy — Beethoven</option>
    <option value="twinkle">Twinkle Twinkle Little Star</option>
    <option value="jingle">Jingle Bells — J. Pierpont</option>
    <option value="mary">Mary Had a Little Lamb</option>
  </select></div>
  <div class="key-row" id="keyRow"></div>
  <div class="key-info" id="keyInfo"></div>
</div>

<div class="card">
  <div class="card-label">Tap Mode</div>
  <div class="toggle">
    <button class="tbtn on" id="btnF" onclick="setMode('finger')">👆 Fingering</button>
    <button class="tbtn"    id="btnR" onclick="setMode('range')">🎯 Practice Range</button>
  </div>
  <div class="status" id="statusEl">Tap any note to see how to play it.</div>
  <button class="clear-btn" id="clearBtn" onclick="clearRange()">✕ Clear selection</button>
</div>

<button onclick="showPopup(64,window.innerWidth/2,200)" style="display:block;width:100%;margin-bottom:10px;padding:12px;background:var(--gold);color:#0b0c1a;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;">🧪 Test Fingering Popup (tap me first)</button>

<div class="sheet-card" id="sheetCard">
  <div class="sheet-bar"></div>
  <div id="notation"></div>
</div>
<div id="dbg"></div>

<div id="pov" onclick="closePopup()"></div>
<div id="popup">
  <button class="px" onclick="closePopup()">✕</button>
  <div class="pnote" id="pNote"></div>
  <div class="pinst" id="pInst"></div>
  <div class="plbl" id="pLbl">Fingering</div>
  <div id="pDiag"></div>
  <div class="ptip" id="pTip"></div>
</div>

<script>
/* ══ MELODIES ══ */
const MEL={
  ode:'X:1\nT:Ode to Joy\nC:Beethoven\nM:4/4\nL:1/4\nQ:1/4=96\nK:C\nE E F G | G F E D | C C D E | E3/2 D/ D2 |\nE E F G | G F E D | C C D E | D3/2 C/ C2 |\nD D E C | D E/2F/2 E C | D E/2F/2 E D | C D G,2 |\nE E F G | G F E D | C C D E | D3/2 C/ C2 |]',
  twinkle:'X:1\nT:Twinkle Twinkle\nM:4/4\nL:1/4\nQ:1/4=96\nK:C\nC C G G | A A G2 | F F E E | D D C2 |\nG G F F | E E D2 | G G F F | E E D2 |\nC C G G | A A G2 | F F E E | D D C2 |]',
  jingle:'X:1\nT:Jingle Bells\nC:J. Pierpont\nM:4/4\nL:1/4\nQ:1/4=112\nK:C\nE E E2 | E E E2 | E G C D | E4 |\nF F F F | F E E E | E D D E | D2 G2 |\nE E E2 | E E E2 | E G C D | E4 |\nF F F F | F E E E | G G F D | C4 |]',
  mary:'X:1\nT:Mary Had a Little Lamb\nM:4/4\nL:1/4\nQ:1/4=96\nK:C\nE D C D | E E E2 | D D D2 | E G G2 |\nE D C D | E E E E | D D E D | C4 |]',
};

/* ══ INSTRUMENTS ══ */
const FAM=[
  {id:'piano',label:'Piano',ico:'🎹',insts:[{id:'piano',label:'Piano',xpose:0,oct:0,clef:'treble',diag:'piano'}]},
  {id:'strings',label:'Strings',ico:'🎻',insts:[
    {id:'violin',label:'Violin',xpose:0,oct:0,clef:'treble',diag:'strings'},
    {id:'viola',label:'Viola',xpose:0,oct:0,clef:'alto',diag:'strings'},
    {id:'cello',label:'Cello',xpose:0,oct:-12,clef:'bass',diag:'strings'},
    {id:'dbass',label:'Double Bass',xpose:0,oct:-12,clef:'bass',diag:'strings'},
  ]},
  {id:'winds',label:'Winds',ico:'<svg width="26" height="26" viewBox="0 0 26 26"><rect x="1" y="10" width="24" height="6" rx="3" fill="#c8d8e8" stroke="#a0b8cc" stroke-width="1"/><circle cx="6" cy="13" r="2" fill="#7a9ab0"/><circle cx="11" cy="13" r="2" fill="#7a9ab0"/><circle cx="16" cy="13" r="2" fill="#7a9ab0"/><circle cx="21" cy="13" r="1.5" fill="#7a9ab0"/><rect x="1" y="10" width="4" height="6" rx="2" fill="#a0b8cc"/></svg>',
   insts:[
    {id:'flute',label:'Flute',xpose:0,oct:0,clef:'treble',diag:'generic'},
    {id:'oboe',label:'Oboe',xpose:0,oct:0,clef:'treble',diag:'generic'},
    {id:'clarBb',label:'Clarinet (Bb)',xpose:2,oct:0,clef:'treble',diag:'clarinet'},
    {id:'clarEb',label:'Clarinet (Eb)',xpose:-3,oct:0,clef:'treble',diag:'clarinet'},
    {id:'altosax',label:'Alto Sax (Eb)',xpose:9,oct:0,clef:'treble',diag:'sax'},
    {id:'tenorsax',label:'Tenor Sax (Bb)',xpose:2,oct:0,clef:'treble',diag:'sax'},
    {id:'barisax',label:'Bari Sax (Eb)',xpose:9,oct:0,clef:'treble',diag:'sax'},
    {id:'bassoon',label:'Bassoon',xpose:0,oct:-12,clef:'bass',diag:'generic'},
  ]},
  {id:'brass',label:'Brass',ico:'🎺',insts:[
    {id:'trumpet',label:'Trumpet (Bb)',xpose:2,oct:0,clef:'treble',diag:'valve'},
    {id:'horn',label:'French Horn',xpose:7,oct:0,clef:'treble',diag:'valve'},
    {id:'trombone',label:'Trombone',xpose:0,oct:-12,clef:'bass',diag:'trombone'},
    {id:'euphonium',label:'Euphonium',xpose:0,oct:-12,clef:'bass',diag:'valve'},
    {id:'tuba',label:'Tuba',xpose:0,oct:-12,clef:'bass',diag:'valve'},
  ]},
];

const KEYS=[
  {label:'C',offset:0,acc:0,type:''},
  {label:'C♯',offset:1,acc:7,type:'sharp'},{label:'D♭',offset:1,acc:5,type:'flat'},
  {label:'D',offset:2,acc:2,type:'sharp'},{label:'E♭',offset:3,acc:3,type:'flat'},
  {label:'E',offset:4,acc:4,type:'sharp'},{label:'F',offset:5,acc:1,type:'flat'},
  {label:'F♯',offset:6,acc:6,type:'sharp'},{label:'G♭',offset:6,acc:6,type:'flat'},
  {label:'G',offset:7,acc:1,type:'sharp'},{label:'A♭',offset:8,acc:4,type:'flat'},
  {label:'A',offset:9,acc:3,type:'sharp'},{label:'B♭',offset:10,acc:2,type:'flat'},
  {label:'B',offset:11,acc:5,type:'sharp'},{label:'C♭',offset:11,acc:7,type:'flat'},
];

/* ══ FINGERING DATA ══ */
const TV={C:[0,0,0],'C#':[1,1,1],Db:[1,1,1],D:[1,0,1],'D#':[0,1,1],Eb:[0,1,1],E:[1,1,0],F:[1,0,0],'F#':[0,1,0],Gb:[0,1,0],G:[0,0,0],'G#':[0,1,1],Ab:[0,1,1],A:[1,1,0],'A#':[1,0,0],Bb:[1,0,0],B:[0,1,0]};
const HV={C:[0,0,0],'C#':[0,1,1],Db:[0,1,1],D:[1,0,0],'D#':[0,1,0],Eb:[0,1,0],E:[1,1,0],F:[0,0,0],'F#':[1,1,1],Gb:[1,1,1],G:[1,0,0],'G#':[1,1,0],Ab:[1,1,0],A:[1,0,0],'A#':[0,1,0],Bb:[0,1,0],B:[1,1,0]};
const TBONE={Bb2:6,B2:5,C3:4,'C#3':3,Db3:3,D3:2,'D#3':1,Eb3:1,E3:1,F3:1,'F#3':2,Gb3:2,G3:3,'G#3':4,Ab3:4,A3:4,'A#3':5,Bb3:5,B3:6,C4:6,'C#4':7,Db4:7,D4:1,'D#4':1,Eb4:1,E4:1,F4:1,'F#4':2,Gb4:2,G4:2,'G#4':3,Ab4:3,A4:3,'A#4':4,Bb4:4,B4:4,C5:5,'C#5':5,Db5:5,D5:5,'D#5':6,Eb5:6,E5:6,F5:6};

// Clarinet and Sax: store fingerings by note name only (no octave) + flag for register key
const CLAR_F={E:[0,1,1,1,0,1,1,1,0],F:[0,1,1,1,0,1,1,0,0],'F#':[0,1,1,1,0,1,0,1,0],Gb:[0,1,1,1,0,1,0,1,0],G:[0,1,1,1,0,0,0,0,0],'G#':[0,1,1,1,1,0,0,0,0],Ab:[0,1,1,1,1,0,0,0,0],A:[0,1,1,0,0,0,0,0,0],'A#':[0,1,0,0,0,0,0,0,0],Bb:[0,1,0,0,0,0,0,0,0],B:[0,0,1,0,0,0,0,0,0],C:[0,0,0,0,0,0,0,0,0],'C#':[1,1,1,1,0,1,0,1,0],Db:[1,1,1,1,0,1,0,1,0],D:[1,1,1,1,0,1,1,1,0]};
const SAX_F={D:[0,1,1,1,0,1,1,1,0],'D#':[0,1,1,1,0,1,1,1,1],Eb:[0,1,1,1,0,1,1,1,1],E:[0,1,1,1,0,1,1,0,0],F:[0,1,1,1,0,1,1,1,0],'F#':[0,1,1,1,0,1,0,0,0],Gb:[0,1,1,1,0,1,0,0,0],G:[0,1,1,0,0,0,0,0,0],'G#':[0,1,1,0,1,0,0,0,0],Ab:[0,1,1,0,1,0,0,0,0],A:[0,1,0,0,0,0,0,0,0],'A#':[0,0,1,1,0,1,1,1,0],Bb:[0,0,1,1,0,1,1,1,0],B:[0,0,0,0,0,0,0,0,0],C:[0,0,0,0,1,0,0,0,0],'C#':[1,1,1,1,0,1,0,0,0],Db:[1,1,1,1,0,1,0,0,0]};

/* ══ STATE ══ */
let sF=FAM[0],sI=FAM[0].insts[0],sK=KEYS[0],mode='finger',step=0,startEl=null,endEl=null,allNoteEls=[];
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function m2n(m){const i=((m%12)+12)%12;return{s:SH[i],f:FL[i],o:Math.floor(m/12)-1};}

/* ══ ABC TRANSPOSER ══ */
function xposeAbc(abc,sem){
  const CH={C:0,D:2,E:4,F:5,G:7,A:9,B:11},NI={0:'C',2:'D',4:'E',5:'F',7:'G',9:'A',11:'B'},NE=Object.entries(CH);
  const KN=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  const LM={'C♯':'C#','F♯':'F#','D♭':'Db','G♭':'Gb','C♭':'Cb','B♭':'Bb','E♭':'Eb','A♭':'Ab'};
  const n=((sem%12)+12)%12,tK=LM[sK.label]||KN[n];
  const SHK={G:['F'],D:['F','C'],A:['F','C','G'],E:['F','C','G','D'],B:['F','C','G','D','A'],'F#':['F','C','G','D','A','E'],'C#':['F','C','G','D','A','E','B']};
  const FLK={F:['B'],Bb:['B','E'],Eb:['B','E','A'],Ab:['B','E','A','D'],Db:['B','E','A','D','G'],Gb:['B','E','A','D','G','C'],Cb:['B','E','A','D','G','C','F']};
  const sh=SHK[tK]||[],fl=FLK[tK]||[];
  const cl=sI.clef&&sI.clef!=='treble'?' clef='+sI.clef:'';
  function c2a(ci){
    if(NI[ci]!==undefined){const L=NI[ci];return[(sh.includes(L)||fl.includes(L))?'=':'',L];}
    if(fl.length){const h=NE.find(([l,c])=>c-1===ci&&fl.includes(l));if(h)return['',h[0]];const nb=NE.find(([l,c])=>c-1===ci);return['_',nb?nb[0]:'A'];}
    const h=NE.find(([l,c])=>c+1===ci&&sh.includes(l));if(h)return['',h[0]];const nb=NE.find(([l,c])=>c+1===ci);return['^',nb?nb[0]:'G'];
  }
  return abc.split('\n').map(line=>{
    if(line.startsWith('K:'))return'K:'+tK+cl;
    if(/^[A-Za-z]:/.test(line)||line.startsWith('%'))return line;
    if(!sem)return line;
    return line.replace(/([_^=]*)([A-Ga-g])([,']*)(\d*\/?[0-9]*)/g,(_,acc,lt,oct,dur)=>{
      let ch=CH[lt.toUpperCase()]||0;
      for(const c of acc){if(c==='^')ch++;else if(c==='_')ch--;}
      let oo=lt===lt.toUpperCase()?0:1;
      for(const c of oct){if(c===',')oo--;else if(c==="'")oo++;}
      const total=ch+oo*12+sem,ci=((total%12)+12)%12,no=Math.floor(total/12);
      const[na,nl]=c2a(ci);let f='',fo='';
      if(no===0)f=nl.toUpperCase();
      else if(no===1)f=nl.toLowerCase();
      else if(no>=2){f=nl.toLowerCase();fo="'".repeat(no-1);}
      else if(no===-1){f=nl.toUpperCase();fo=',';}
      else{f=nl.toUpperCase();fo=','.repeat(-no);}
      return na+f+fo+dur;
    });
  }).join('\n');
}

/* ══ PARSE PITCHES FROM ABC STRING ══
   More reliable than walking abcjs tune object internals.
   ABC octave convention: uppercase C-B = octave below middle C (MIDI 48-59)
                          lowercase c-b = octave of middle C   (MIDI 60-71)
                          each ' = +12, each , = -12
*/
function parsePitches(abc){
  const SM={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const out=[];
  let inBody=false;
  for(const line of abc.split('\n')){
    if(line.startsWith('K:')){inBody=true;continue;}
    if(!inBody||/^[A-Za-z]:/.test(line)||line.startsWith('%'))continue;
    const re=/([_^=]*)([A-Ga-gz])([,']*)/g;let m;
    while((m=re.exec(line))!==null){
      const[,acc,note,octs]=m;
      if(note==='z'||note==='Z')continue;
      const U=note.toUpperCase();
      if(!(U in SM))continue;
      // Base: uppercase=C3 range(48), lowercase=C4 range(60)
      let midi=SM[U]+(note===U?48:60);
      for(const c of octs)midi+=c==="'"?12:c===','?-12:0;
      for(const c of acc)midi+=c==='^'?1:c==='_'?-1:0;
      out.push(midi);
    }
  }
  return out;
}

/* ══ RENDER ══ */
function doRender(){
  const total=sI.xpose+sK.offset+sI.oct;
  const abc=xposeAbc(MEL[document.getElementById('sMelody').value],total);
  const cont=document.getElementById('notation');
  const w=Math.floor((cont.getBoundingClientRect().width||window.innerWidth-30)-16);
  cont.innerHTML='';
  document.querySelectorAll('.nhs').forEach(h=>h.remove());

  ABCJS.renderAbc('notation',abc,{
    staffwidth:w,scale:1.4,paddingtop:4,paddingbottom:8,paddingleft:4,paddingright:4,
    wrap:{minSpacing:1.8,maxSpacing:2.8,preferredMeasuresPerLine:4},
  });

  const pitches=parsePitches(abc);
  const svg=cont.querySelector('svg');
  allNoteEls=svg?Array.from(svg.querySelectorAll('.abcjs-note')):[];

  // Build hotspots after 2 animation frames so layout is stable
  requestAnimationFrame(()=>requestAnimationFrame(()=>buildHotspots(svg,pitches)));

  startEl=null;endEl=null;step=0;
  document.getElementById('clearBtn').classList.remove('show');
  if(mode==='range')setStatus('s-or','① Tap your first note');
}

/* ══ HOTSPOT BUILDER ══ */
function buildHotspots(svg, pitches) {
  const dbg = document.getElementById('dbg');
  if (!svg) { dbg.textContent = 'No SVG'; return; }

  const card = document.getElementById('sheetCard');
  const cardRect = card.getBoundingClientRect();
  const svgRect  = svg.getBoundingClientRect();
  const svgAttrW = parseFloat(svg.getAttribute('width'))  || svgRect.width;
  const svgAttrH = parseFloat(svg.getAttribute('height')) || svgRect.height;
  const scaleX = svgRect.width  / svgAttrW;
  const scaleY = svgRect.height / svgAttrH;
  const offX = svgRect.left - cardRect.left;
  const offY = svgRect.top  - cardRect.top;

  // Log first note element's transform for debugging
  const firstNote = allNoteEls[0];
  const sampleTr = firstNote ? firstNote.getAttribute('transform') : 'no notes';
  
  let built = 0;
  allNoteEls.forEach((el, i) => {
    const midi = pitches[i];
    if (midi === undefined) return;

    // Try to get position from transform attribute
    const tr = el.getAttribute('transform') || '';
    
    // Try multiple regex patterns for different transform formats
    let svgX = null, svgY = null;
    
    // "translate(x,y)" or "translate(x, y)"
    let m = tr.match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
    if (m) { svgX = parseFloat(m[1]); svgY = parseFloat(m[2]); }
    
    // "translate(x y)" with space separator
    if (svgX === null) {
      m = tr.match(/translate\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/);
      if (m) { svgX = parseFloat(m[1]); svgY = parseFloat(m[2]); }
    }

    // Single value "translate(x)"
    if (svgX === null) {
      m = tr.match(/translate\(\s*([-\d.]+)\s*\)/);
      if (m) { svgX = parseFloat(m[1]); svgY = 0; }
    }

    // If no transform, try getBBox directly
    if (svgX === null) {
      try {
        const bb = el.getBBox();
        if (bb && bb.width > 0) {
          svgX = bb.x + bb.width / 2;
          svgY = bb.y + bb.height / 2;
        }
      } catch(e) {}
    }

    if (svgX === null) return;

    const px = offX + svgX * scaleX;
    const py = offY + svgY * scaleY;
    const hw = 24, hh = 30;

    const hs = document.createElement('div');
    hs.className = 'nhs';
    hs.style.left   = (px - hw) + 'px';
    hs.style.top    = (py - hh) + 'px';
    hs.style.width  = (hw * 2)  + 'px';
    hs.style.height = (hh * 2)  + 'px';

    const fire = (sx, sy) => {
      if (mode === 'finger') {
        el.classList.add('hl-or');
        setTimeout(() => el.classList.remove('hl-or'), 400);
        showPopup(midi, sx, sy);
      } else {
        handleRange(el, i);
      }
    };

    hs.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      const t = e.changedTouches[0] || e.touches[0];
      fire(t.clientX, t.clientY);
    }, { passive: false });

    hs.addEventListener('click', e => {
      e.stopPropagation();
      fire(e.clientX, e.clientY);
    });

    card.appendChild(hs);
    built++;
  });

  dbg.textContent = built + ' hotspots · ' + pitches.length + ' pitches · transform eg: "' + sampleTr + '"';
}

/* ══ RANGE ══ */
function handleRange(el,i){
  if(step===0||step===2){
    startEl=el;endEl=null;step=1;paintRange();
    setStatus('s-or','② Now tap the last note');
    document.getElementById('clearBtn').classList.remove('show');
  } else {
    endEl=el;
    const i1=allNoteEls.indexOf(startEl),i2=allNoteEls.indexOf(endEl);
    const lo=Math.min(i1,i2),hi=Math.max(i1,i2);
    step=2;paintRange(lo,hi);
    setStatus('s-gr','✓ Range set!');
    document.getElementById('clearBtn').classList.add('show');
  }
}
function paintRange(lo,hi){
  allNoteEls.forEach((el,i)=>{
    el.classList.remove('hl-or','hl-yw');
    if(lo===undefined)return;
    if(i===lo||i===hi)el.classList.add('hl-or');
    else if(i>lo&&i<hi)el.classList.add('hl-yw');
  });
}
function clearRange(){startEl=null;endEl=null;step=0;paintRange();setStatus('s-or','① Tap your first note');document.getElementById('clearBtn').classList.remove('show');}

/* ══ MODE ══ */
function setMode(m){mode=m;document.getElementById('btnF').classList.toggle('on',m==='finger');document.getElementById('btnR').classList.toggle('on',m==='range');if(m==='finger')setStatus('','Tap any note to see how to play it.');else{const s=['s-or','s-or','s-gr'][step];const t=['① Tap your first note','② Now tap the last note','✓ Range set!'][step];setStatus(s,t);}}
function setStatus(cls,txt){const el=document.getElementById('statusEl');el.className='status'+(cls?' '+cls:'');el.textContent=txt;}

/* ══ INSTRUMENT UI ══ */
const ICO={piano:'🎹',violin:'🎻',viola:'🎻',cello:'🎻',dbass:'🎻',flute:'🪈',oboe:'🎵',clarBb:'🎵',clarEb:'🎵',altosax:'🎷',tenorsax:'🎷',barisax:'🎷',bassoon:'🎵',trumpet:'🎺',horn:'🪗',trombone:'📯',euphonium:'📯',tuba:'📯'};
const CL={treble:'Treble clef',bass:'Bass clef',alto:'Alto clef',tenor:'Tenor clef'};
function buildFamTabs(){document.getElementById('famTabs').innerHTML=FAM.map((f,i)=>`<button class="fam-btn${f.id===sF.id?' sel':''}" onclick="pickFam(${i})"><span class="fico">${f.ico}</span><span class="flbl">${f.id===sF.id?sI.label:f.label}</span></button>`).join('');}
function buildInstGrid(){const p=document.getElementById('instPanel');if(sF.insts.length<=1){p.classList.remove('open');return;}document.getElementById('instGrid').innerHTML=sF.insts.map((inst,i)=>`<button class="inst-btn${inst.id===sI.id?' sel':''}" onclick="pickInst(${i})"><span class="iico">${ICO[inst.id]||'🎵'}</span><span><div class="ilbl">${inst.label}</div><div class="iclef">${CL[inst.clef]||''}</div></span></button>`).join('');p.classList.add('open');}
function pickFam(i){sF=FAM[i];sI=sF.insts[0];buildFamTabs();buildInstGrid();doRender();}
function pickInst(i){sI=sF.insts[i]||sF.insts[0];document.getElementById('instPanel').classList.remove('open');buildFamTabs();doRender();}

/* ══ KEY UI ══ */
function buildKeyRow(){document.getElementById('keyRow').innerHTML=KEYS.map((k,i)=>`<button class="key-btn${k.label===sK.label?' sel':''}" onclick="pickKey(${i})">${k.label}</button>`).join('');updateKeyInfo();}
function pickKey(i){sK=KEYS[i]||KEYS[0];document.querySelectorAll('.key-btn').forEach((b,j)=>b.classList.toggle('sel',j===i));updateKeyInfo();doRender();}
function updateKeyInfo(){const k=sK,el=document.getElementById('keyInfo');if(k.acc===0){el.textContent=k.label+' Major — no sharps or flats';return;}const w=k.type==='sharp'?'sharp':'flat',s=k.type==='sharp'?'(#)':'(b)';el.textContent=k.label+' Major — '+k.acc+' '+w+(k.acc>1?'s':'')+' '+s;}

/* ══ DIAGRAMS ══ */
const G='#e8a820',DK='#0b0c1a',GR='#2a2d4a',LT='#4a4e6a';
function pianoSVG(sharp,oct){
  const WK=['C','D','E','F','G','A','B'],BK=[null,'C#','D#',null,'F#','G#','A#'],BP=[null,.65,1.65,null,3.65,4.65,5.65];
  const FM={Cb:'B',Db:'C#',Eb:'D#',Fb:'E',Gb:'F#',Ab:'G#',Bb:'A#'};
  const eff=FM[sharp]||sharp,isB=sharp.length>1,u=28,sw=7*u-2+4;
  let ws='',bs='';
  for(let i=0;i<7;i++){const t=!isB&&WK[i]===eff;ws+=`<rect x="${i*u+2}" y="2" width="26" height="72" rx="2" fill="${t?G:'#fff'}" stroke="${t?'#c07810':'#ccc'}" stroke-width="1.5"/>`;}
  for(let i=0;i<7;i++){if(!BP[i])continue;const t=isB&&eff===BK[i];bs+=`<rect x="${BP[i]*u-8+2}" y="2" width="16" height="44" rx="2" fill="${t?G:'#111'}"/>`;}
  return`<svg width="${sw}" height="82" viewBox="0 0 ${sw} 82"><rect width="${sw}" height="82" rx="6" fill="${GR}"/>${ws}${bs}<text x="${sw/2}" y="78" text-anchor="middle" font-family="Outfit,sans-serif" font-size="10" fill="${G}" font-weight="700">${sharp}${oct}</text></svg>`;
}
function valveSVG(v){const cx=[30,80,130];let c='';v.forEach((on,i)=>{c+=`${on?`<circle cx="${cx[i]}" cy="36" r="24" fill="rgba(232,168,32,.2)"/>`:''}<circle cx="${cx[i]}" cy="36" r="22" fill="${on?G:GR}" stroke="${on?'#c07810':LT}" stroke-width="2"/><text x="${cx[i]}" y="41" text-anchor="middle" font-family="Outfit,sans-serif" font-size="14" font-weight="700" fill="${on?DK:LT}">${i+1}</text><text x="${cx[i]}" y="68" text-anchor="middle" font-family="Outfit,sans-serif" font-size="9" fill="${LT}">${on?'▼ press':'○ open'}</text>`;});return`<svg width="160" height="76" viewBox="0 0 160 76"><rect width="160" height="76" rx="8" fill="${DK}"/><line x1="8" y1="36" x2="152" y2="36" stroke="${LT}" stroke-width="1" opacity=".3"/>${c}</svg>`;}
function woodwindSVG(holes){const cx=55,h=240,P=[{y:20,r:8},{y:55,r:11},{y:80,r:11},{y:105,r:11},{y:128,r:7},{y:155,r:11},{y:175,r:11},{y:195,r:11},{y:215,r:7}],L=['Reg','L1','L2','L3','◇','R1','R2','R3','◇'];let b=`<line x1="${cx}" y1="12" x2="${cx}" y2="${h-10}" stroke="${LT}" stroke-width="4" stroke-linecap="round"/>`;P.forEach(({y,r},i)=>{if(i>=holes.length)return;const on=holes[i];b+=`<circle cx="${cx}" cy="${y}" r="${r}" fill="${on?G:'#fff'}" stroke="${on?'#c07810':GR}" stroke-width="1.5"/>`;if(on)b+=`<circle cx="${cx}" cy="${y}" r="${r-4}" fill="${DK}" opacity=".3"/>`;b+=`<text x="${cx+r+5}" y="${y+4}" font-family="Outfit,sans-serif" font-size="9" fill="${LT}">${L[i]}</text>`;});return`<svg width="110" height="${h+10}" viewBox="0 0 110 ${h+10}"><rect width="110" height="${h+10}" rx="8" fill="${DK}"/>${b}</svg>`;}
function tromboneSVG(pos){const pct=(pos-1)/6,sx=20+pct*130;let t='';for(let i=1;i<=7;i++){const x=20+(i-1)/6*130;t+=`<line x1="${x}" y1="28" x2="${x}" y2="38" stroke="${LT}" stroke-width="1"/><text x="${x}" y="50" text-anchor="middle" font-family="Outfit,sans-serif" font-size="8" fill="${LT}">${i}</text>`;}return`<svg width="200" height="68" viewBox="0 0 200 68"><rect width="200" height="68" rx="8" fill="${DK}"/><rect x="16" y="30" width="138" height="5" rx="2" fill="${GR}"/>${t}<rect x="${sx-4}" y="20" width="12" height="25" rx="4" fill="${G}" stroke="#c07810" stroke-width="1.5"/><text x="100" y="63" text-anchor="middle" font-family="Outfit,sans-serif" font-size="10" font-weight="700" fill="${G}">Position ${pos}</text></svg>`;}
function stringsSVG(name,os){const xs=[25,65,110,155];let c='';const root=name.charAt(0);os.forEach((s,i)=>{const m2=s.charAt(0)===root;c+=`<line x1="${xs[i]}" y1="10" x2="${xs[i]}" y2="62" stroke="${m2?G:LT}" stroke-width="${m2?3:1.5}"/>`;if(m2)c+=`<circle cx="${xs[i]}" cy="36" r="14" fill="${G}" stroke="#c07810" stroke-width="2"/>`;c+=`<text x="${xs[i]}" y="${m2?41:57}" text-anchor="middle" font-family="Outfit,sans-serif" font-size="${m2?11:9}" font-weight="700" fill="${m2?DK:LT}">${s}</text>`;});return`<svg width="185" height="72" viewBox="0 0 185 72"><rect width="185" height="72" rx="8" fill="${DK}"/><text x="92" y="11" text-anchor="middle" font-family="Outfit,sans-serif" font-size="8" fill="${LT}">Open strings</text>${c}<text x="92" y="70" text-anchor="middle" font-family="Outfit,sans-serif" font-size="8" fill="rgba(232,168,32,.5)">Gold = your string</text></svg>`;}

/* ══ POPUP ══ */
function showPopup(midi,cx,cy){
  const n=m2n(midi),name=n.s===n.f?n.s:n.s+'/'+n.f;
  document.getElementById('pNote').textContent=name;
  document.getElementById('pInst').textContent=sI.label;
  const d=document.getElementById('pDiag'),tp=document.getElementById('pTip'),lb=document.getElementById('pLbl');
  d.innerHTML='';tp.textContent='';lb.textContent='Fingering';

  switch(sI.diag){
    case 'piano':
      lb.textContent='Key to Press';
      d.innerHTML=pianoSVG(n.s,n.o);
      tp.textContent=n.o<=3?'Lower half of keyboard':n.o>=5?'Upper half':'Near middle';
      break;

    case 'valve':{
      const vm=sI.id==='horn'?HV:TV;
      const v=vm[n.s]||vm[n.f]||[0,0,0];
      const ao=v.every(x=>!x);
      lb.textContent='Valve Fingering';
      if(ao){d.innerHTML='<div class="open-tag"><span>Open — no valves!</span></div>';tp.textContent='Just blow!';}
      else{d.innerHTML=valveSVG(v);const pr=v.map((x,i)=>x?i+1:null).filter(Boolean);tp.textContent=`Press valve${pr.length>1?'s':''} ${pr.join('+')} firmly`;}
      break;}

    case 'trombone':{
      lb.textContent='Slide Position';
      // Try multiple octaves for lookup
      let pos=TBONE[n.s+n.o]||TBONE[n.f+n.o]||TBONE[n.s+(n.o+1)]||TBONE[n.f+(n.o+1)]||TBONE[n.s+(n.o-1)]||TBONE[n.f+(n.o-1)]||1;
      d.innerHTML=tromboneSVG(pos);
      tp.textContent=pos===1?'Slide fully in':pos===7?'Fully extended':`Position ${pos}`;
      break;}

    case 'clarinet':{
      lb.textContent='Clarinet Keys';
      // Lookup by note name only (octave-independent)
      const h=CLAR_F[n.s]||CLAR_F[n.f]||[0,1,1,1,0,1,1,1,0];
      d.innerHTML=woodwindSVG(h);
      tp.textContent=h[0]?'Use the register key (upper thumb)':'Lower register — no register key';
      break;}

    case 'sax':{
      lb.textContent='Sax Keys';
      const h=SAX_F[n.s]||SAX_F[n.f]||[0,1,1,1,0,1,1,1,0];
      d.innerHTML=woodwindSVG(h);
      tp.textContent=h[0]?'Use the octave key (upper thumb)':'Lower register — no octave key';
      break;}

    case 'strings':{
      lb.textContent='Open Strings';
      const os=(sI.id==='cello'||sI.id==='dbass')?['C','G','D','A']:['G','D','A','E'];
      d.innerHTML=stringsSVG(name,os);
      tp.textContent='Gold = your string · Check fingering chart for position';
      break;}

    default:
      lb.textContent='Note';
      d.innerHTML=`<div style="background:rgba(0,0,0,.3);border-radius:10px;padding:14px;text-align:center;"><div style="font-size:2.4rem;font-family:'DM Serif Display',serif;color:${G};">${name}</div><div style="font-size:.72rem;color:var(--muted);margin-top:5px;">Octave ${n.o} · See your method book</div></div>`;
  }

  const pop=document.getElementById('popup');
  pop.classList.add('on');document.getElementById('pov').classList.add('on');
  requestAnimationFrame(()=>{
    const pw=pop.offsetWidth||255,ph=pop.offsetHeight||240,mg=12;
    let left=cx+mg,top=cy-ph/2;
    if(left+pw>window.innerWidth-mg)left=cx-pw-mg;
    if(top<mg)top=mg;
    if(top+ph>window.innerHeight-mg)top=window.innerHeight-ph-mg;
    pop.style.left=Math.max(mg,left)+'px';pop.style.top=Math.max(mg,top)+'px';
  });
}
function closePopup(){document.getElementById('popup').classList.remove('on');document.getElementById('pov').classList.remove('on');}

/* ══ INIT ══ */
buildFamTabs();buildKeyRow();
window.addEventListener('load',doRender);
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(doRender,300);});
document.addEventListener('click',e=>{
  const p=document.getElementById('instPanel');
  if(p.classList.contains('open')&&!p.contains(e.target)&&!e.target.closest('.fam-tabs'))p.classList.remove('open');
});
</script>
