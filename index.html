      this.countingOutLoud=false;
      if(btn){btn.textContent='🔢';btn.classList.remove('on');}
      Toast.show({ic:'🔢',title:'Counting Off',sub:'',cat:'counting'});
    }
  },

  render(){
    const svg=document.getElementById('cmp-svg');if(!svg)return;
    CmpSheet.render(svg,{notes:this.notes,ts:this.ts,totalMeasures:this.totalMeasures,selectedMeasure:this.selectedMeasure,selectedMeasureEnd:this.selectedMeasureEnd});
    if(!this._tapInstalled){
      this._tapInstalled=true;
      svg.addEventListener('click',e=>{
        const mg=e.target.closest('[data-measure-idx]');
        if(mg){
          // Measure selection only works when loop is on
          if(!this.loopOn)return;
          const mi=parseInt(mg.getAttribute('data-measure-idx'));
          // Range-select:
          //  - No selection → tapped measure becomes start
          //  - Single measure selected, tap same → clear
          //  - Single or range selected, tap different → extend range to span [min, max] of all
          if(this.selectedMeasure===null){
            this.selectedMeasure=mi;this.selectedMeasureEnd=null;
          } else if(this.selectedMeasureEnd===null){
            if(this.selectedMeasure===mi){this.selectedMeasure=null;}
            else{this.selectedMeasureEnd=mi;}
          } else {
            // Already a range — extend to encompass the new tap
            const lo=Math.min(this.selectedMeasure,this.selectedMeasureEnd,mi);
            const hi=Math.max(this.selectedMeasure,this.selectedMeasureEnd,mi);
            this.selectedMeasure=lo;this.selectedMeasureEnd=hi;
          }
          this.deselectNote();
          this.render();
          return;
        }
        const g=e.target.closest('[data-note-idx]');
        if(g){this.selectedMeasure=null;this.selectedMeasureEnd=null;this.selectNote(parseInt(g.getAttribute('data-note-idx')));}
        else{this.selectedMeasure=null;this.selectedMeasureEnd=null;this.deselectNote();}
      });
    }
  },

  // FEATURE 3 — WebAudio violin D4 synthesis with proper pause/stop
  _wac:null,   // WebAudioContext
  _wStart:0,   // audioCtx time when playback started
  _wPauseAt:0, // audioCtx time when paused
  _wPaused:false,
  _wNodes:[],  // all oscillator nodes (to cancel on stop)
  _wTimer:null,

  _secPerEighth(){
    if(!this.ts)return 0.25;
    // beatUnit tells us the BPM denominator: 4=quarter, 2=half, 8=eighth
    // For compound (♩.) the beat = dotted quarter = 3 eighths
    const bu=this.ts.beatUnit;
    const eighthsPerBeat=bu===2?4:bu===8?1:2; // half=4, quarter=2, eighth=1
    // compound time sigs (6/8, 9/8, 12/8) group in dotted quarters = 3 eighths per beat
    const isCompound=(this.ts.v===8&&this.ts.b%3===0&&this.ts.b>3);
    const ePB=isCompound?3:eighthsPerBeat;
    return (60/this.tempo)/ePB;
  },

  _getWAC(){
    if(!this._wac||this._wac.state==='closed'){
      this._wac=new(window.AudioContext||window.webkitAudioContext)();
    }
    return this._wac;
  },

  setTone(v){this.tone=v;},

  _playTone(ctx,freq,startTime,durSec){
    const fn={
      piano:this._tonePiano, violin:this._toneViolin, flute:this._toneFlute, trumpet:this._toneTrumpet,
      clap:this._toneClap, kick808:this._toneKick808, laser:this._toneLaser,
      slide:this._toneSlide, squeak:this._toneSqueak, raspberry:this._toneRaspberry, honk:this._toneHonk, boing:this._toneBoing
    }[this.tone] || this._tonePiano;
    return fn.call(this,ctx,freq,startTime,durSec);
  },

  _tonePiano(ctx,freq,t,d){
    const dur=Math.min(d,1.2);
    const osc=ctx.createOscillator();osc.type='triangle';osc.frequency.value=freq;
    const osc2=ctx.createOscillator();osc2.type='sine';osc2.frequency.value=freq*2;
    const g=ctx.createGain();const g2=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.08,t+0.005);g2.gain.exponentialRampToValueAtTime(0.001,t+dur*0.5);
    osc.connect(g);osc2.connect(g2);g.connect(ctx.destination);g2.connect(ctx.destination);
    osc.start(t);osc2.start(t);osc.stop(t+dur);osc2.stop(t+dur*0.5);
    return osc;
  },

  _toneViolin(ctx,freq,t,d){
    const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=freq;
    const lfo=ctx.createOscillator();lfo.frequency.value=5;
    const lfoG=ctx.createGain();lfoG.gain.value=freq*0.015;
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=2000;filt.Q.value=1;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+Math.min(0.08,d*0.2));
    g.gain.setValueAtTime(0.22,t+Math.max(0,d-0.05));g.gain.linearRampToValueAtTime(0.001,t+d);
    lfo.connect(lfoG);lfoG.connect(osc.frequency);osc.connect(filt);filt.connect(g);g.connect(ctx.destination);
    osc.start(t);lfo.start(t);osc.stop(t+d);lfo.stop(t+d);
    return osc;
  },

  _toneFlute(ctx,freq,t,d){
    const osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=freq;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+Math.min(0.04,d*0.15));
    g.gain.setValueAtTime(0.3,t+Math.max(0,d-0.04));g.gain.linearRampToValueAtTime(0.001,t+d);
    const bufLen=Math.max(1,Math.floor(ctx.sampleRate*d));
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*0.3;
    const src=ctx.createBufferSource();src.buffer=buf;
    const nfilt=ctx.createBiquadFilter();nfilt.type='bandpass';nfilt.frequency.value=freq*2;nfilt.Q.value=2;
    const ng=ctx.createGain();ng.gain.value=0.04;
    osc.connect(g);g.connect(ctx.destination);src.connect(nfilt);nfilt.connect(ng);ng.connect(ctx.destination);
    osc.start(t);src.start(t);osc.stop(t+d);src.stop(t+d);
    return osc;
  },

  _toneTrumpet(ctx,freq,t,d){
    const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=freq;
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.Q.value=3;
    filt.frequency.setValueAtTime(400,t);filt.frequency.linearRampToValueAtTime(2500,t+Math.min(0.05,d*0.3));
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.25,t+Math.min(0.03,d*0.15));
    g.gain.setValueAtTime(0.25,t+Math.max(0,d-0.05));g.gain.linearRampToValueAtTime(0.001,t+d);
    osc.connect(filt);filt.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+d);
    return osc;
  },

  _toneClap(ctx,freq,t,d){return this._playViolin(ctx,freq,t,d);},

  _toneKick808(ctx,freq,t,d){
    const dur=Math.min(d,0.5);
    const osc=ctx.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(150,t);osc.frequency.exponentialRampToValueAtTime(40,t+Math.min(0.1,dur*0.4));
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.7,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+dur);
    return osc;
  },

  _toneLaser(ctx,freq,t,d){
    const dur=Math.min(d,0.35);
    const osc=ctx.createOscillator();osc.type='sawtooth';
    osc.frequency.setValueAtTime(1400,t);osc.frequency.exponentialRampToValueAtTime(120,t+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+dur);
    return osc;
  },

  _toneSlide(ctx,freq,t,d){
    // Classic cartoon slide whistle — sine sweeping up ~1.8x then back down
    const dur=Math.min(d,0.6);
    const osc=ctx.createOscillator();osc.type='sine';
    const peak=dur*0.55;
    osc.frequency.setValueAtTime(420,t);
    osc.frequency.exponentialRampToValueAtTime(1700,t+peak);
    osc.frequency.exponentialRampToValueAtTime(520,t+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.32,t+0.015);
    g.gain.setValueAtTime(0.32,t+Math.max(0.02,dur-0.04));g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+dur);
    return osc;
  },

  _toneSqueak(ctx,freq,t,d){
    // Rubber ducky squeak — high sine with rapid upward chirp and slight vibrato
    const dur=Math.min(d,0.25);
    const osc=ctx.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(1100,t);
    osc.frequency.exponentialRampToValueAtTime(1900,t+dur*0.5);
    osc.frequency.exponentialRampToValueAtTime(1500,t+dur);
    const lfo=ctx.createOscillator();lfo.frequency.value=22;
    const lfoG=ctx.createGain();lfoG.gain.value=90;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.28,t+0.01);
    g.gain.setValueAtTime(0.28,t+Math.max(0.02,dur-0.04));g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    lfo.connect(lfoG);lfoG.connect(osc.frequency);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);lfo.start(t);osc.stop(t+dur);lfo.stop(t+dur);
    return osc;
  },

  _toneRaspberry(ctx,freq,t,d){
    // Tongue-blow raspberry — low sawtooth with fast LFO flutter through lowpass
    const dur=Math.min(d,0.45);
    const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=75;
    const lfo=ctx.createOscillator();lfo.type='square';lfo.frequency.value=32;
    const lfoG=ctx.createGain();lfoG.gain.value=55;
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=650;filt.Q.value=5;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.45,t+0.025);
    g.gain.setValueAtTime(0.45,t+Math.max(0.03,dur-0.06));g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    lfo.connect(lfoG);lfoG.connect(osc.frequency);
    osc.connect(filt);filt.connect(g);g.connect(ctx.destination);
    osc.start(t);lfo.start(t);osc.stop(t+dur);lfo.stop(t+dur);
    return osc;
  },

  _toneHonk(ctx,freq,t,d){
    // Bicycle/clown horn — two detuned squares through lowpass for nasal buzz
    const dur=Math.min(d,0.25);
    const o1=ctx.createOscillator();o1.type='square';o1.frequency.value=260;
    const o2=ctx.createOscillator();o2.type='square';o2.frequency.value=263;
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1400;filt.Q.value=2;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.015);
    g.gain.setValueAtTime(0.3,t+Math.max(0.02,dur-0.04));g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o1.connect(filt);o2.connect(filt);filt.connect(g);g.connect(ctx.destination);
    o1.start(t);o2.start(t);o1.stop(t+dur);o2.stop(t+dur);
    return o1;
  },

  _toneBoing(ctx,freq,t,d){
    const dur=Math.min(d,0.4);
    const osc=ctx.createOscillator();osc.type='triangle';
    osc.frequency.setValueAtTime(600,t);osc.frequency.exponentialRampToValueAtTime(160,t+dur);
    const lfo=ctx.createOscillator();lfo.frequency.value=14;
    const lfoG=ctx.createGain();lfoG.gain.value=80;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.4,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    lfo.connect(lfoG);lfoG.connect(osc.frequency);osc.connect(g);g.connect(ctx.destination);
    osc.start(t);lfo.start(t);osc.stop(t+dur);lfo.stop(t+dur);
    return osc;
  },

  _toneMetClick(ctx,t,accent){
    // Metronome tick — square wave, short envelope; accent = downbeat
    const freq=accent?1200:800;
    const gain=accent?0.35:0.22;
    const dur=0.04;
    const osc=ctx.createOscillator();osc.type='square';osc.frequency.value=freq;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+0.002);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+dur);
    return osc;
  },

  _drumKick(ctx,t){
    // Sine 80Hz with fast pitch drop and exponential decay
    const osc=ctx.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(120,t);
    osc.frequency.exponentialRampToValueAtTime(45,t+0.10);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.55,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t);osc.stop(t+0.18);
    return osc;
  },
  _drumSnare(ctx,t){
    // White noise band-passed + sine 200Hz body
    const bufLen=Math.floor(ctx.sampleRate*0.12);
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++)data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();
    filt.type='bandpass';filt.frequency.value=1700;filt.Q.value=0.9;
    const gN=ctx.createGain();
    gN.gain.setValueAtTime(0,t);
    gN.gain.linearRampToValueAtTime(0.42,t+0.002);
    gN.gain.exponentialRampToValueAtTime(0.001,t+0.10);
    src.connect(filt);filt.connect(gN);gN.connect(ctx.destination);
    src.start(t);src.stop(t+0.12);
    // Body sine
    const osc=ctx.createOscillator();osc.type='triangle';osc.frequency.value=210;
    const gB=ctx.createGain();
    gB.gain.setValueAtTime(0,t);
    gB.gain.linearRampToValueAtTime(0.18,t+0.003);
    gB.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    osc.connect(gB);gB.connect(ctx.destination);
    osc.start(t);osc.stop(t+0.10);
    return src;
  },
  _drumHat(ctx,t,open){
    // White noise high-passed
    const dur=open?0.18:0.045;
    const bufLen=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++)data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();
    filt.type='highpass';filt.frequency.value=7000;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(open?0.18:0.13,t+0.001);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(filt);filt.connect(g);g.connect(ctx.destination);
    src.start(t);src.stop(t+dur+0.005);
    return src;
  },
  _drumPattern(beatsPerBar,isCompound){
    // Returns array of length=beatsPerBar (compound) or beatsPerBar (simple), each entry =
    // {sub: array of subdivision-step hit objects} where hit ∈ {k,s,h} (kick/snare/hat).
    // Simple meters: each beat is a single step. Compound: each beat = 3 sub-steps (eighths).
    const beats=[];
    if(isCompound){
      // Compound: kick on beat 1, snare on the "snare beat" (beat (b/2+1) rounded), hi-hat on every eighth.
      const snareBeat=Math.floor(beatsPerBar/2); // 0-indexed
      for(let b=0;b<beatsPerBar;b++){
        const sub=[];
        for(let s=0;s<3;s++){
          const hits={h:true};
          if(s===0){
            if(b===0||b===snareBeat){hits[b===snareBeat?'s':'k']=true;}
            else hits.k=true;
          }
          sub.push(hits);
        }
        beats.push({sub});
      }
      return beats;
    }
    // Simple meters: built-in patterns by beatsPerBar
    const P={
      2:[['k'],['s']],
      3:[['k'],['s'],['s']],
      4:[['k'],['s'],['k'],['s']],
      5:[['k'],['s'],['s'],['k'],['s']],
      6:[['k'],['s'],['k'],['s'],['s'],['s']],
      7:[['k'],['s'],['k'],['s'],['k'],['s'],['s']]
    };
    let pat=P[beatsPerBar];
    if(!pat){
      // Fallback for unusual meters: K on 1 and odd, S on even
      pat=[];
      for(let i=0;i<beatsPerBar;i++)pat.push([i%2===0?'k':'s']);
    }
    return pat.map(hits=>{
      const m={h:true};
      hits.forEach(h=>m[h]=true);
      return {sub:[m]};
    });
  },
  _drumScheduleBar(ctx,t0,secPerBeat,beatsPerBar,isCompound){
    // Schedule one bar of the pattern starting at t0
    const pat=this._drumPattern(beatsPerBar,isCompound);
    const subDur=isCompound?(secPerBeat/3):secPerBeat;
    const nodes=[];
    for(let b=0;b<pat.length;b++){
      const bt=t0+b*secPerBeat;
      pat[b].sub.forEach((hits,si)=>{
        const t=bt+si*subDur;
        if(hits.k)nodes.push(this._drumKick(ctx,t));
        if(hits.s)nodes.push(this._drumSnare(ctx,t));
        if(hits.h)nodes.push(this._drumHat(ctx,t,false));
      });
    }
    return nodes;
  },

  _playViolin(ctx,freq,startTime,durSec){
    // Clap sound — white-noise burst with sharp envelope (freq/durSec ignored; uniform clap per note)
    const bufLen=Math.floor(ctx.sampleRate*0.05);
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();
    filt.type='bandpass';filt.frequency.value=1500;filt.Q.value=1.2;
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0,startTime);
    gain.gain.linearRampToValueAtTime(0.6,startTime+0.003);
    gain.gain.exponentialRampToValueAtTime(0.001,startTime+0.045);
    src.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
    src.start(startTime);src.stop(startTime+0.05);
    return src;
  },

  play(){
    if(!this.ts)return;
    if(this._wac&&this._wac.state==='running'&&this.playing)return;

    // Playhead RAF tick — reads audio clock, falls back to wall clock if stale
    this._phTick=()=>{
      if(!this.playing){
        const w=document.querySelector('.cmp-staff-wrap');
        if(w)w.classList.remove('locked');
        this._wRAF=null;return;
      }
      const ph=document.getElementById('cmp-playhead');
      const sc=this._phSchedule;
      if(ph&&sc&&sc.length&&this._wac){
        const last=sc[sc.length-1];
        // Audio-clock elapsed (preferred)
        const audElapsed=this._wac.currentTime-this._wStart;
        // Wall-clock elapsed (fallback)
        const wallElapsed=this._wStartWall?((performance.now()-this._wStartWall)/1000):audElapsed;
        // Use wall clock if audio clock isn't running or is stale by >0.3s
        const useWall=this._wac.state!=='running'||Math.abs(audElapsed-wallElapsed)>0.3;
        const elapsed=useWall?wallElapsed:audElapsed;
        const t=Math.max(0,Math.min(elapsed,last.t));
        let i=0;while(i<sc.length-1&&sc[i+1].t<=t)i++;
        const a=sc[i],b=sc[i+1]||a;
        const frac=b.t>a.t?(t-a.t)/(b.t-a.t):0;
        const x=a.x+(b.x-a.x)*frac;
        ph.setAttribute('transform',`translate(${x},0)`);
        // Continuous follow: viewport tracks playhead so it sits ~30% from the left edge.
        // This gives the user 70% of the viewport width as look-ahead and is inherently
        // smooth (no threshold-snap). On a backward jump (repeat-back-to-start), detect
        // the jump and snap instantly so scroll keeps up.
        const wrap=document.querySelector('.cmp-staff-wrap');
        if(wrap){
          wrap.classList.add('locked');
          const vw=wrap.clientWidth;
          // Keep playhead near left edge (~60px of left margin past time sig) so the
          // user has maximum look-ahead and a loop's first measure sits at the left.
          const targetLeft=Math.max(0,x-60);
          const prevX=this._phLastX;
          this._phLastX=x;
          // Backward jump (repeat-back-to-start) — instant snap so scroll keeps up
          wrap.scrollLeft=targetLeft;
        }
        // Beaver pose: pick most recent scheduled pose for current elapsed
        const bs=this._bvrSchedule;
        if(bs&&bs.length){
          const bvr=document.querySelector('.cmp-input-mid .cmp-beaver');
          if(bvr){
            let bi=-1;
            for(let k=0;k<bs.length;k++){if(bs[k].t<=elapsed)bi=k;else break;}
            const target=bi>=0?bs[bi].pose:'';
            if(this._bvrLastPose!==target){
              bvr.classList.remove('p-punch','p-kick','p-block','p-chamber');
              if(target)bvr.classList.add(target);
              this._bvrLastPose=target;
            }
          }
        }
      }
      this._wRAF=requestAnimationFrame(this._phTick);
    };

    if(this._wPaused&&this._wac&&this._wac.state==='suspended'){
      // Resume from pause
      this._wac.resume();
      this.playing=true;
      document.getElementById('cmp-play-btn')?.classList.add('on');
      // Restart completion timer for remaining duration (range-aware)
      const elapsed=this._wPauseAt-this._wStart;
      const spe=this._secPerEighth();
      const total=this._playRange?this._playRange.rangeDur:this.notes.reduce((a,n)=>a+n.dur8*spe,0);
      const left=Math.max(0,total-elapsed)*1000;
      if(this.loopOn&&this._playRange){
        this._wTimer=setTimeout(()=>{if(this.playing)this._loopRestart();},left+100);
      } else {
        this._wTimer=setTimeout(()=>this._onPlayEnd(),left+200);
      }
      this._wPaused=false;
      this._phTick();
      return;
    }

    if(this.notes.length===0){Toast.show({ic:'🎵',title:'Nothing to play',sub:'Add some notes first.',type:'e'});return;}

    this.stop();

    // Determine play range from measure selection (full piece if nothing selected)
    const capR=this.ts.cap;
    let rStart=0, rEnd=this.totalMeasures-1;
    if(this.selectedMeasure!==null){
      const selE=this.selectedMeasureEnd==null?this.selectedMeasure:this.selectedMeasureEnd;
      rStart=Math.min(this.selectedMeasure,selE);
      rEnd=Math.max(this.selectedMeasure,selE);
    }
    // Locate note indices whose start-measure falls in [rStart, rEnd]
    let _cum=0, firstIdx=-1, lastIdx=-1, cumBefore=0;
    for(let i=0;i<this.notes.length;i++){
      const mi=Math.floor((_cum+0.001)/capR);
      if(mi>=rStart&&mi<=rEnd){
        if(firstIdx<0){firstIdx=i;cumBefore=_cum;}
        lastIdx=i;
      }
      _cum+=this.notes[i].dur8;
    }
    if(firstIdx<0){Toast.show({ic:'🎵',title:'Empty range',sub:'Selected measures have no notes.',type:'e'});return;}
    const playNotes=this.notes.slice(firstIdx,lastIdx+1);
    const rangeDur=playNotes.reduce((a,n)=>a+n.dur8,0)*this._secPerEighth();
    this._playRange={playNotes,rStart,rEnd,cumBefore,rangeDur};

    const ctx=this._getWAC();
    if(ctx.state==='suspended') ctx.resume();
    const spe=this._secPerEighth();
    const D4=293.66;
    this._wNodes=[];
    const t0=ctx.currentTime+0.05;
    // Metronome setup: 2-measure count-in on play start, beat rate matches ts beat unit
    const capForMet=this.ts.cap;
    const isCompoundMet=(this.ts.v===8&&this.ts.b%3===0&&this.ts.b>3);
    const beatsPerBar=isCompoundMet?(this.ts.b/3):this.ts.b;
    const secPerBeat=(capForMet*spe)/beatsPerBar;
    const countInBeats=2*beatsPerBar;
    const countInDur=countInBeats*secPerBeat;
    // Schedule count-in ticks + staff border pulse
    const wrap0=document.querySelector('.cmp-staff-wrap');
    this._wMetPulseTimers=[];
    // Drum bars during count-in if drumOn (2 bars), else metronome click per beat
    if(this.drumOn){
      for(let bar=0;bar<2;bar++){
        const barT=t0+bar*beatsPerBar*secPerBeat;
        const nodes=this._drumScheduleBar(ctx,barT,secPerBeat,beatsPerBar,isCompoundMet);
        nodes.forEach(n=>{if(n)this._wNodes.push(n);});
      }
    }
    for(let i=0;i<countInBeats;i++){
      const tt=t0+i*secPerBeat;
      const accent=(i%beatsPerBar)===0;
      if(this.metronomeOn){
        const node=this._toneMetClick(ctx,tt,accent);
        if(node)this._wNodes.push(node);
      }
      if(wrap0){
        const delay=Math.max(0,(tt-ctx.currentTime)*1000);
        const timer=setTimeout(()=>{
          wrap0.style.transition='border-color 80ms ease-out';
          wrap0.style.borderColor=accent?'#f5c518':'rgba(245,197,24,.55)';
          setTimeout(()=>{wrap0.style.borderColor='';},accent?180:120);
        },delay);
        this._wMetPulseTimers.push(timer);
      }
    }
    // Audio start point for notes = after count-in
    let t=t0+countInDur;
    this._wStart=t;
    this._wStartWall=performance.now()+countInDur*1000;
    // Playback-follow: scroll to range start, schedule per-measure scrolls during play
    const wrap=document.querySelector('.cmp-staff-wrap');
    const cap=this.ts.cap, pMW=wrap?Math.max(80,(wrap.clientWidth-68)/4):140;
    if(wrap) wrap.scrollLeft=rStart*pMW;
    this._phMeta={mLeft:68,mW:pMW,cap,spe,totalDur:rangeDur};
    // Build playhead schedule for range notes only (t relative to range start)
    this._phSchedule=[];
    const pMs=CmpSheet._getMeasures(this.notes,cap,this.totalMeasures);
    const isCompound=(this.ts.v===8&&this.ts.b%3===0&&this.ts.b>3);
    const beatSize=isCompound?3:Math.max(1,cap/this.ts.b);
    for(let mi=rStart;mi<=rEnd;mi++){
      const mx=68+mi*pMW;const mNotes=pMs[mi]||[];
      const ng=new Array(mNotes.length).fill(-1);let cur=[],grp=0;
      const flush=()=>{if(cur.length>=2){cur.forEach(i=>ng[i]=grp);grp++;}cur=[];};
      for(let i=0;i<mNotes.length;i++){
        const n=mNotes[i];
        const beamable=!n.rest&&(n.d===8||n.d===16);
        if(!beamable){flush();continue;}
        if(cur.length===0){cur=[i];continue;}
        const fb=Math.floor(mNotes[cur[0]].startBeat8/beatSize);
        const tb=Math.floor(n.startBeat8/beatSize);
        const mixTr=!!mNotes[cur[0]].triplet!==!!n.triplet;
        if(fb===tb&&!mixTr){cur.push(i);}else{flush();cur=[i];}
      }
      flush();
      let prevNx=mx;
      mNotes.forEach((n,i)=>{
        const baseNx=mx+(n.startBeat8/cap)*pMW+10;
        const beamed=i>0&&ng[i]>=0&&ng[i]===ng[i-1];
        const floor=beamed?prevNx+11:prevNx+18;
        const nx=i===0?Math.max(mx+15,baseNx):Math.max(floor,baseNx);
        prevNx=nx;
        this._phSchedule.push({t:(mi*cap+n.startBeat8-cumBefore)*spe,x:nx});
      });
    }
    this._phSchedule.push({t:rangeDur,x:68+(rEnd+1)*pMW});
    // During-playback metronome ticks and/or drum beat (if enabled) — only across range
    if(this.metronomeOn){
      const totalBeats=(rEnd-rStart+1)*beatsPerBar;
      for(let i=0;i<totalBeats;i++){
        const tt=t+i*secPerBeat;
        const accent=(i%beatsPerBar)===0;
        const node=this._toneMetClick(ctx,tt,accent);
        if(node)this._wNodes.push(node);
      }
    }
    if(this.drumOn){
      const totalBars=(rEnd-rStart+1);
      for(let b=0;b<totalBars;b++){
        const barT=t+b*beatsPerBar*secPerBeat;
        const nodes=this._drumScheduleBar(ctx,barT,secPerBeat,beatsPerBar,isCompoundMet);
        nodes.forEach(n=>{if(n)this._wNodes.push(n);});
      }
    }
    this._wScrollTimers=[];
    this._bvrSchedule=[];
    const _BVR_POSES=['p-punch','p-kick','p-block','p-chamber'];
    let beat8=0, lastMi=-1, poseIdx=0;

    playNotes.forEach(n=>{
      const dur=n.dur8*spe;
      if(!n.rest&&!n.tied){
        const node=this._playTone(ctx,D4,t,dur);
        if(node)this._wNodes.push(node);
        this._bvrSchedule.push({t:t-this._wStart,pose:_BVR_POSES[poseIdx%4]});
        poseIdx++;
      } else {
        this._bvrSchedule.push({t:t-this._wStart,pose:''});
      }
      // Auto-scroll-to-measure removed so user can scroll freely during play
      beat8+=n.dur8;
      t+=dur;
    });

    // Inline second pass for repeat — exact ctx times so beat is never disturbed
    if(this.repeatOn){
      const phLen=this._phSchedule.length;
      for(let k=0;k<phLen;k++){
        const e=this._phSchedule[k];
        this._phSchedule.push({t:e.t+rangeDur,x:e.x});
      }
      let t2=t, beat82=0, lastMi2=-1;
      // Extend drum or metronome through second pass
      if(this.metronomeOn){
        const totalBeats=(rEnd-rStart+1)*beatsPerBar;
        for(let i=0;i<totalBeats;i++){
          const tt=t2+i*secPerBeat;
          const accent=(i%beatsPerBar)===0;
          const node=this._toneMetClick(ctx,tt,accent);
          if(node)this._wNodes.push(node);
        }
      }
      if(this.drumOn){
        const totalBars=(rEnd-rStart+1);
        for(let b=0;b<totalBars;b++){
          const barT=t2+b*beatsPerBar*secPerBeat;
          const nodes=this._drumScheduleBar(ctx,barT,secPerBeat,beatsPerBar,isCompoundMet);
          nodes.forEach(n=>{if(n)this._wNodes.push(n);});
        }
      }
      playNotes.forEach(n=>{
        const dur=n.dur8*spe;
        if(!n.rest&&!n.tied){
          const node=this._playTone(ctx,D4,t2,dur);
          if(node)this._wNodes.push(node);
          this._bvrSchedule.push({t:t2-this._wStart,pose:_BVR_POSES[poseIdx%4]});
          poseIdx++;
        } else {
          this._bvrSchedule.push({t:t2-this._wStart,pose:''});
        }
        // Auto-scroll-to-measure removed so user can scroll freely during play
        beat82+=n.dur8;
        t2+=dur;
      });
    }

    const passes=this.repeatOn?2:1;
    const totalMs=rangeDur*1000*passes;
    const countInMs=countInDur*1000;
    this.playing=true;this._wPaused=false;
    document.getElementById('cmp-play-btn')?.classList.add('on');
    if(this.loopOn){
      this._wTimer=setTimeout(()=>{if(this.playing)this._loopRestart();},Math.max(0,countInMs+totalMs+2000));
    } else {
      this._wTimer=setTimeout(()=>this._onPlayEnd(),countInMs+totalMs+300);
    }
    this._phTick();
  },

  _repeatRestart(){
    if(!this.playing)return;
    this._repeatPass=2;
    // Reset playhead to start visually, then play full piece again with no count-in
    const ph=document.getElementById('cmp-playhead');
    if(ph)ph.setAttribute('transform','translate(68,0)');
    const ctx=this._getWAC();
    if(ctx.state==='suspended')ctx.resume();
    const spe=this._secPerEighth();
    const D4=293.66;
    const t0=ctx.currentTime+0.05;
    let t=t0,beat8=0;
    const sched=[{t:t-t0+0.05,x:68}];
    this._wNodes=this._wNodes||[];
    this.notes.forEach(n=>{
      const dur=n.dur8*spe;
      if(!n.rest){
        const semis=this._pitchSemis?this._pitchSemis(n.p):0;
        const f=D4*Math.pow(2,semis/12);
        this._playTone(ctx,f,t,Math.max(0.05,dur-0.02));
      }
      beat8+=n.dur8;
      const mi=Math.floor(beat8/this.ts.cap);
      const b8=beat8-mi*this.ts.cap;
      const vp=document.getElementById('cmp-svg').parentElement.clientWidth;
      const mW=Math.max(80,(vp-68)/4);
      const x=68+mi*mW+(b8/this.ts.cap)*mW+10;
      sched.push({t:t-t0+dur,x});
      t+=dur;
    });
    this._wStart=t0;
    this._wStartWall=performance.now();
    this._phSchedule=sched;
    const totalMs=this.notes.reduce((a,n)=>a+n.dur8*spe,0)*1000;
    this._wTimer=setTimeout(()=>this._onPlayEnd(),totalMs+300);
  },

  // Loop restart — schedules 1-measure count-in (click + gold pulse) then replays range. Keeps existing audio ctx.
  _loopRestart(){
    if(!this.playing||!this._wac||this._wac.state==='closed')return;
    const ctx=this._wac;
    if(ctx.state==='suspended') ctx.resume();
    const spe=this._secPerEighth();
    const D4=293.66;
    const cap=this.ts.cap;
    const pMW=this._phMeta.mW;
    const {playNotes,rStart,rEnd,cumBefore,rangeDur}=this._playRange;
    const wrap=document.querySelector('.cmp-staff-wrap');
    if(wrap) wrap.scrollLeft=rStart*pMW;
    const t0=ctx.currentTime+0.05;
    // 1-measure count-in click + gold pulse (same as play startup)
    const isCompoundMet=(this.ts.v===8&&this.ts.b%3===0&&this.ts.b>3);
    const beatsPerBar=isCompoundMet?(this.ts.b/3):this.ts.b;
    const secPerBeat=(cap*spe)/beatsPerBar;
    const countInBeats=beatsPerBar;
    const countInDur=countInBeats*secPerBeat;
    const wrap0=document.querySelector('.cmp-staff-wrap');
    this._wMetPulseTimers?.forEach(id=>clearTimeout(id));this._wMetPulseTimers=[];
    // Drum bar during count-in if drumOn (1 bar), else metronome click per beat
    if(this.drumOn){
      const nodes=this._drumScheduleBar(ctx,t0,secPerBeat,beatsPerBar,isCompoundMet);
      nodes.forEach(n=>{if(n)this._wNodes.push(n);});
    }
    for(let i=0;i<countInBeats;i++){
      const tt=t0+i*secPerBeat;
      const accent=(i%beatsPerBar)===0;
      if(this.metronomeOn){
        const node=this._toneMetClick(ctx,tt,accent);
        if(node)this._wNodes.push(node);
      }
      if(wrap0){
        const delay=Math.max(0,(tt-ctx.currentTime)*1000);
        const timer=setTimeout(()=>{
          wrap0.style.transition='border-color 80ms ease-out';
          wrap0.style.borderColor=accent?'#f5c518':'rgba(245,197,24,.55)';
          setTimeout(()=>{wrap0.style.borderColor='';},accent?180:120);
        },delay);
        this._wMetPulseTimers.push(timer);
      }
    }
    // Audio start point for notes = after count-in
    let t=t0+countInDur;
    this._wStart=t;
    this._wStartWall=performance.now()+countInDur*1000;
    if(this.metronomeOn){
      const totalBeats=(rEnd-rStart+1)*beatsPerBar;
      for(let i=0;i<totalBeats;i++){
        const tt=t+i*secPerBeat;
        const accent=(i%beatsPerBar)===0;
        const node=this._toneMetClick(ctx,tt,accent);
        if(node)this._wNodes.push(node);
      }
    }
    if(this.drumOn){
      const totalBars=(rEnd-rStart+1);
      for(let b=0;b<totalBars;b++){
        const barT=t+b*beatsPerBar*secPerBeat;
        const nodes=this._drumScheduleBar(ctx,barT,secPerBeat,beatsPerBar,isCompoundMet);
        nodes.forEach(n=>{if(n)this._wNodes.push(n);});
      }
    }
    this._wScrollTimers?.forEach(id=>clearTimeout(id));
    this._wScrollTimers=[];
    let beat8=0,lastMi=-1;
    playNotes.forEach(n=>{
      const dur=n.dur8*spe;
      if(!n.rest&&!n.tied){
        const node=this._playTone(ctx,D4,t,dur);
        if(node)this._wNodes.push(node);
      }
      // Auto-scroll-to-measure removed so user can scroll freely during play
      beat8+=n.dur8;
      t+=dur;
    });
    const totalMs=rangeDur*1000;
    const countInMs=countInDur*1000;
    if(this.loopOn){
      // 2s silence after audio ends, then count-in begins before next iteration
      this._wTimer=setTimeout(()=>{if(this.playing)this._loopRestart();},Math.max(0,countInMs+totalMs+2000));
    } else {
      this._wTimer=setTimeout(()=>this._onPlayEnd(),countInMs+totalMs+300);
    }
  },

  _onPlayEnd(){
    this.playing=false;this._wPaused=false;this._repeatPass=0;
    if(this._wRAF){cancelAnimationFrame(this._wRAF);this._wRAF=null;}
    const bvr=document.querySelector('.cmp-input-mid .cmp-beaver');
    if(bvr){bvr.classList.remove('p-punch','p-kick','p-block','p-chamber');this._bvrLastPose='';}
    // Park playhead at end-of-piece position so it doesn't look stuck mid-score
    const sc=this._phSchedule;
    if(sc&&sc.length){
      const last=sc[sc.length-1];
      const ph=document.getElementById('cmp-playhead');
      if(ph) ph.setAttribute('transform',`translate(${last.x},0)`);
    }
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  pause(){
    if(!this.playing||!this._wac)return;
    clearTimeout(this._wTimer);
    this._wScrollTimers?.forEach(id=>clearTimeout(id));this._wScrollTimers=[];
    this._wPauseAt=this._wac.currentTime;
    this._wac.suspend();
    this.playing=false;this._wPaused=true;
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  stop(){
    clearTimeout(this._wTimer);
    this._wScrollTimers?.forEach(id=>clearTimeout(id));this._wScrollTimers=[];
    this._wMetPulseTimers?.forEach(id=>clearTimeout(id));this._wMetPulseTimers=[];
    this._repeatPass=0;
    const bvr=document.querySelector('.cmp-input-mid .cmp-beaver');
    if(bvr){bvr.classList.remove('p-punch','p-kick','p-block','p-chamber');this._bvrLastPose='';}
    const sw=document.querySelector('.cmp-staff-wrap');if(sw){sw.style.borderColor='';sw.classList.remove('locked');sw.scrollTo({left:0,behavior:'smooth'});}
    if(this._wRAF){cancelAnimationFrame(this._wRAF);this._wRAF=null;}
    const ph=document.getElementById('cmp-playhead');if(ph){ph.setAttribute('transform','translate(68,0)');ph.removeAttribute('display');}
    if(this._wac&&this._wac.state!=='closed'){
      try{this._wac.close();}catch(e){}
    }
    this._wac=null;this._wNodes=[];
    this.playing=false;this._wPaused=false;this._wPauseAt=0;this._wStart=0;
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  submit(){
    const title=document.getElementById('c-title')?.value.trim();
    if(!title){Toast.show({ic:'✏️',title:'Add a title',sub:'Give your song a name first.',type:'e'});return;}
    if(this.notes.filter(n=>!n.rest).length<4){Toast.show({ic:'🎵',title:'Too short',sub:'Add at least 4 notes.',type:'e'});return;}
    const u=U.get();
    const songs=S.get('user-songs',[]);
    songs.push({
      id:'u-'+Date.now(),title,
      composer:u.username||'Student',
      diff:2,tempo:this.tempo,
      ts:{b:this.ts.b,v:this.ts.v},ks:0,
      notes:this.notes.map(n=>({p:n.p,d:n.d,dot:!!n.dot})),
      userMade:true,stats:{plays:0,fails:0}
    });
    S.set('user-songs',songs);
    U.badge('composer');
    Toast.show({ic:'📤',title:'Submitted!',sub:`"${title}" is now in the library!`,type:'s'});
    this.notes=[];
    document.getElementById('c-title').value='';
    this.render();
    this._showStep('entry');
  },
};

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────

document.addEventListener('DOMContentLoaded',()=>{
  U.up(u=>{
    if(!u.badges)u.badges=[];
    if(!u.songsCompleted)u.songsCompleted=[];
  });
  Cmp.init();
});
</script>
