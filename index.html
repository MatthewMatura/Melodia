<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06060f">
<title>Practice Buddies 🥋</title>
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}

/* ===== TOKENS ===== */
:root{
color-scheme:dark;
–bg:#06060f;
–surf:#10101e;
–surf2:#181828;
–red:#e8142a;
–red2:rgba(232,20,42,.28);
–gold:#f5c518;
–gold2:rgba(245,197,24,.22);
–jade:#00d97e;
–jade2:rgba(0,217,126,.22);
–ink:#f0e6d0;
–dim:rgba(240,230,208,.55);
–dimmer:rgba(240,230,208,.22);
–gR:0 0 14px rgba(232,20,42,.6);
–gG:0 0 14px rgba(245,197,24,.6);
–gJ:0 0 14px rgba(0,217,126,.6);
}

/* ===== BASE ===== */
body{
font-family:‘Arial Black’,‘Helvetica Neue’,Arial,sans-serif;
background-color:#06060f;background-color:var(–bg);
color:#f0e6d0;color:var(–ink);
-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

/* ===== VIEWS ===== */
.view{
position:fixed;top:0;left:0;right:0;bottom:0;
display:none;flex-direction:column;overflow-y:auto;
-webkit-overflow-scrolling:touch;
}
.view.active{display:flex;}
#view-compose.active{display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ===== COMPOSE ===== */
@font-face{font-family:Bravura;font-style:normal;font-display:block;font-weight:400;src:local(“Bravura”),url(‘https://cdn.jsdelivr.net/npm/@vexflow-fonts/bravura/bravura.woff2’) format(‘woff2’);}
svg text.music,.cmp-nbtn svg text,#cmp-s3 svg text{font-family:‘Bravura’,‘Times New Roman’,serif !important;}
.cinput{background:#10101e;background:var(–surf);border:1px solid rgba(240,230,208,.22);border:1px solid var(–dimmer);border-radius:7px;padding:11px 14px;color:#f0e6d0;color:var(–ink);font-family:inherit;font-size:13px;width:100%;outline:none;-webkit-appearance:none;}
.cinput:focus{border-color:#f5c518;border-color:var(–gold);}
/* Steps are absolutely positioned within the fixed view — always start at top:0 */
.cmp-step{display:none;}
.cmp-step.cmp-active{
display:flex;flex-direction:column;
position:absolute;top:0;right:0;bottom:0;left:0;
overflow-y:auto;-webkit-overflow-scrolling:touch;

z-index:1;
}
/* dragon background behind all compose steps */
.cmp-dragon-bg{
position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.cmp-dragon-bg svg{width:100%;height:100%;opacity:.055;}
/* dragon bg sits behind all steps */
/* — entry — */
.cmp-entry-hero{padding:32px 20px 4px;text-align:center;}
.cmp-entry-title{font-size:22px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(135deg,#e8142a,#f5c518);background:linear-gradient(135deg,var(–red),var(–gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.cmp-entry-sub{font-size:12px;color:rgba(240,230,208,.55);color:var(–dim);margin-top:4px;font-style:italic;font-family:Georgia,serif;}
.cmp-entry-btns{display:flex;flex-direction:row;gap:14px;padding:48px 20px 20px;justify-content:center;}
.cmp-mode-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;border-radius:18px;border:none;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;max-width:280px;aspect-ratio:1/1;}
.cmp-mode-btn:active{transform:scale(.96);}
.cmb-ic{font-size:36px;line-height:1;}
.cmb-label{font-size:20px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;}
.cmb-sub{font-size:11px;opacity:.8;font-family:Georgia,serif;font-style:italic;}
.cmp-rhythm{background:linear-gradient(135deg,#003d8a,#0066dd);color:#fff;box-shadow:0 6px 28px rgba(0,102,221,.45);}
.cmp-pitch{background:linear-gradient(135deg,#005c3a,#00d97e);color:#fff;box-shadow:0 6px 28px rgba(0,217,126,.38);}
.cmp-both{background:linear-gradient(135deg,#6e0000,#e8142a);color:#fff;box-shadow:0 6px 28px rgba(232,20,42,.45);}
/* — time sig screen — */
.cmp-step-hdr{padding:24px 16px 4px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#f5c518;color:var(–gold);}
.cmp-ts-mascots{display:flex;justify-content:space-around;align-items:flex-end;padding:0 20px 2px;pointer-events:none;}
.cmp-ts-mascots svg{opacity:.82;filter:drop-shadow(0 0 14px rgba(245,197,24,.25));width:54px !important;height:64px !important;}
/* FEATURE 1+2: stacked numeral card buttons */
.cmp-ts-grid{display:flex;flex-wrap:wrap;gap:11px;padding:8px 16px 24px;justify-content:center;}
.cmp-ts-btn{
display:flex;flex-direction:column;align-items:center;justify-content:center;
min-width:74px;padding:14px 10px 10px;border-radius:16px;
border:2px solid rgba(245,197,24,.18);
background:linear-gradient(160deg,#181828,#10101e);
background:linear-gradient(160deg,var(–surf2),var(–surf));
color:#f0e6d0;color:var(–ink);font-family:inherit;
cursor:pointer;-webkit-tap-highlight-color:transparent;
box-shadow:0 3px 12px rgba(0,0,0,.4);
position:relative;overflow:hidden;
}
.cmp-ts-btn::before{
content:’’;position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(to right,rgba(245,197,24,.5),transparent);
}
.cmp-ts-btn:active,.cmp-ts-btn.on{
background:linear-gradient(135deg,rgba(245,197,24,.18),rgba(232,20,42,.14));
border-color:#f5c518;border-color:var(–gold);
box-shadow:0 0 20px rgba(245,197,24,.35),0 4px 16px rgba(0,0,0,.5);
transform:scale(.96);
}
/* stacked top/bottom numerals — proper music notation style */
.cmp-tsn-wrap{display:flex;flex-direction:column;align-items:center;line-height:1;gap:0;}
.cmp-tsn-top{font-size:24px;font-weight:900;color:#f5c518;color:var(–gold);line-height:1;}
.cmp-tsn-bot{font-size:24px;font-weight:900;color:#f0e6d0;color:var(–ink);line-height:1;}
.cmp-ts-name{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,230,208,.5);margin-top:6px;}
.cmp-ts-btn-text{font-size:13px;font-weight:900;color:rgba(240,230,208,.55);}/* Make Your Own */
/* — compose step (step 3) — */
.cmp-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#10101e;background:var(–surf);border-bottom:1px solid rgba(245,197,24,.22);border-bottom:1px solid var(–gold2);flex-shrink:0;margin-bottom:16px;position:relative;}
.cmp-back-btn{padding:7px 10px;border-radius:8px;border:none;background:transparent;color:rgba(240,230,208,.55);color:var(–dim);font-family:inherit;font-weight:900;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-submit-btn{padding:9px 16px;border-radius:9px;border:none;background:#f5c518;background:var(–gold);color:#111;font-family:inherit;font-weight:900;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-ts-label{font-size:16px;font-weight:900;color:#f5c518;color:var(–gold);letter-spacing:.1em;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;}
/* LAYOUT FIX 1+2: input area above staff, no overlap */
.cmp-input-area{flex-shrink:0;padding:8px 14px 4px;background:#0d0d1a;border-bottom:1px solid rgba(245,197,24,.1);display:flex;gap:14px;align-items:flex-start;}
.cmp-input-left{flex:1;min-width:0;}
.cmp-input-mid{flex:0 0 100px;display:flex;align-items:center;justify-content:center;padding-top:6px;}
.cmp-input-mid svg{display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
.cmp-beaver g{transition:transform 90ms ease-out;transform-box:fill-box;}
.cmp-beaver .bvr-arm-l{transform-origin:50% 0%;}
.cmp-beaver .bvr-arm-r{transform-origin:50% 0%;}
.cmp-beaver .bvr-leg-f{transform-origin:50% 0%;}
.cmp-beaver .bvr-leg-b{transform-origin:50% 0%;}
.cmp-beaver .bvr-body{transform-origin:50% 100%;}
.cmp-beaver.p-punch .bvr-arm-r{transform:translate(6px,-3px) rotate(15deg);}
.cmp-beaver.p-punch .bvr-arm-l{transform:rotate(25deg) translate(-2px,2px);}
.cmp-beaver.p-punch .bvr-body{transform:rotate(2deg);}
.cmp-beaver.p-kick .bvr-leg-f{transform:translate(8px,-12px) rotate(-35deg);}
.cmp-beaver.p-kick .bvr-arm-l{transform:rotate(-20deg);}
.cmp-beaver.p-kick .bvr-body{transform:rotate(-3deg);}
.cmp-beaver.p-block .bvr-arm-l{transform:rotate(-55deg) translate(0,-4px);}
.cmp-beaver.p-block .bvr-arm-r{transform:rotate(-30deg) translate(-2px,-6px);}
.cmp-beaver.p-chamber .bvr-arm-r{transform:translate(-6px,4px) rotate(-15deg);}
.cmp-beaver.p-chamber .bvr-arm-l{transform:translate(2px,-2px) rotate(10deg);}
.cmp-beaver.p-chamber .bvr-body{transform:translateY(2px);}
.cmp-conductor{display:flex;justify-content:center;align-items:center;padding:24px 16px 32px;}
.cmp-conductor svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
.cmp-conductor .bvr-arm-l{animation:bvrConductL 1.6s ease-in-out infinite;}
.cmp-conductor .bvr-arm-r{animation:bvrConductR 1.6s ease-in-out infinite;}
.cmp-conductor .bvr-body{animation:bvrConductBody 1.6s ease-in-out infinite;}
@keyframes bvrConductL{0%,100%{transform:rotate(-10deg) translate(0,-3px);}25%{transform:rotate(15deg) translate(-3px,2px);}50%{transform:rotate(-30deg) translate(2px,-6px);}75%{transform:rotate(20deg) translate(-2px,3px);}}
@keyframes bvrConductR{0%,100%{transform:rotate(10deg) translate(0,-3px);}25%{transform:rotate(-15deg) translate(3px,-6px);}50%{transform:rotate(30deg) translate(-2px,2px);}75%{transform:rotate(-20deg) translate(2px,-4px);}}
@keyframes bvrConductBody{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
.cmp-input-right{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:240px;padding-top:18px;align-content:center;}
.cmp-stack-btn{width:100%;padding:11px 10px;font-size:11px;flex:none !important;}
.cmp-ts-info{margin:8px 16px 24px;padding:14px 16px;background:#10101e;background:var(–surf);border:1px solid rgba(245,197,24,.22);border:1px solid var(–gold2);border-radius:12px;}
.cmp-ts-info-hdr{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#f5c518;color:var(–gold);margin-bottom:9px;}
.cmp-ts-info-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid rgba(240,230,208,.08);font-size:12px;color:#f0e6d0;color:var(–ink);}
.cmp-ts-info-row:first-of-type{border-top:none;}
.cmp-ts-info-sig{font-weight:900;color:#f5c518;color:var(–gold);min-width:38px;font-family:Georgia,serif;}
.cmp-ts-info-feel{flex:1;font-size:11px;color:rgba(240,230,208,.78);}
.cmp-input-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#f5c518;color:var(–gold);margin-bottom:5px;margin-top:4px;}
.cmp-note-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.cmp-note-row::-webkit-scrollbar{display:none;}
.cmp-nbtn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 5px 5px;border-radius:11px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:42px;}
.cmp-nbtn:active,.cmp-nbtn.sel{border-color:#f5c518;border-color:var(–gold);background:rgba(245,197,24,.1);}
.cmp-nbtn svg{display:block;}
.cmp-nbtn-lbl{font-size:8px;color:#000;text-align:center;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;}
.cmp-edit-row{display:flex;gap:7px;}
.cmp-triplet-btn{padding:10px 12px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.cmp-triplet-btn.on{border-color:#e8142a;border-color:var(–red);background:rgba(232,20,42,.28);background:var(–red2);}
.cmp-edit-btn{flex:1;padding:10px 6px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.cmp-edit-btn:active{background:rgba(232,20,42,.28);background:var(–red2);border-color:#e8142a;border-color:var(–red);}
.cmp-tempo-row{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-shrink:0;}
.cmp-tempo-btn{flex:1;padding:11px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-tempo-btn:active{background:#e8142a;background:var(–red);border-color:#e8142a;border-color:var(–red);}
.cmp-tempo-disp{flex:1.6;text-align:center;font-size:17px;font-weight:900;color:#f5c518;color:var(–gold);letter-spacing:.06em;}
/* LAYOUT FIX 2: staff never overlaps adjacent elements */
.cmp-staff-wrap{flex-shrink:0;margin:4px 14px;border-radius:10px;background:#0b0b18;border:1px solid rgba(245,197,24,.22);border:1px solid var(–gold2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;height:110px;display:flex;align-items:center;}
.cmp-staff-wrap.locked{overflow-x:hidden;touch-action:none;}
.cmp-surprise-btn{padding:10px 14px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.cmp-surprise-btn:active,.cmp-surprise-btn.on{background:rgba(245,197,24,.18);border-color:#f5c518;border-color:var(–gold);}
.cmp-playbar{display:flex;align-items:center;padding:6px 14px 2px;flex-shrink:0;justify-content:space-between;gap:10px;}
.cmp-playbar-left,.cmp-playbar-right{display:flex;align-items:center;gap:10px;}
.cmp-playbar-center{display:flex;gap:10px;align-items:center;}
#cmp-svg{width:100%;display:block;}
.cmp-play-btn{width:50px;height:50px;border-radius:50%;border:2px solid rgba(245,197,24,.22);border:2px solid var(–gold2);background:#10101e;background:var(–surf);color:#f5c518;color:var(–gold);font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;}
.cmp-play-btn:active,.cmp-play-btn.on{background:#f5c518;background:var(–gold);color:#111;border-color:#f5c518;border-color:var(–gold);}
.cmp-tone-sel{height:40px;align-self:center;padding:0 10px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,#f0e6d0 50%),linear-gradient(135deg,#f0e6d0 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;}
.cmp-tone-sel optgroup{background:#10101e;color:#f5c518;font-style:normal;font-weight:900;}
.cmp-tone-sel option{background:#10101e;color:#f0e6d0;font-weight:600;}
.cmp-title-row{padding:6px 14px 14px;flex-shrink:0;}
.cmp-saves-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9000;align-items:center;justify-content:center;padding:20px;}
.cmp-saves-modal.on{display:flex;}
.cmp-saves-content{background:#10101e;background:var(–surf);border:1px solid rgba(245,197,24,.4);border-radius:14px;width:min(520px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
.cmp-saves-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(245,197,24,.2);font-weight:900;color:#f5c518;color:var(–gold);letter-spacing:.1em;font-size:13px;}
.cmp-saves-close{background:transparent;border:none;color:#f0e6d0;color:var(–ink);font-size:20px;cursor:pointer;padding:0 4px;}
.cmp-saves-list{flex:1;overflow-y:auto;padding:8px;}
.cmp-save-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid rgba(240,230,208,.14);margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-save-item:active{background:rgba(245,197,24,.08);border-color:#f5c518;border-color:var(–gold);}
.cmp-save-meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.cmp-save-title{font-weight:900;color:#f0e6d0;color:var(–ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmp-save-sub{font-size:10px;color:rgba(240,230,208,.55);color:var(–dim);}
.cmp-save-del{background:transparent;border:1px solid rgba(232,20,42,.4);color:#e8142a;color:var(–red);border-radius:6px;padding:5px 9px;font-size:10px;cursor:pointer;font-weight:900;-webkit-tap-highlight-color:transparent;flex-shrink:0;margin-left:8px;}
.cmp-saves-empty{padding:30px;text-align:center;color:rgba(240,230,208,.55);color:var(–dim);font-size:12px;}

.cmp-customts-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9000;align-items:center;justify-content:center;padding:20px;}
.cmp-customts-modal.on{display:flex;}
.cmp-customts-content{background:#10101e;background:var(–surf);border:1px solid rgba(245,197,24,.4);border-radius:14px;width:min(380px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.cmp-customts-body{padding:16px 20px;color:#f0e6d0;color:var(–ink);font-size:13px;line-height:1.5;}
.cmp-customts-explain{font-size:12px;color:rgba(240,230,208,.78);margin:4px 0 8px;line-height:1.45;}
.cmp-customts-stack{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 10px;}
.cmp-customts-divider{width:120px;height:3px;background:#f5c518;background:var(–gold);border-radius:2px;margin:6px 0;}
.cmp-customts-lbl{font-size:11px;color:rgba(240,230,208,.78);letter-spacing:.05em;margin-top:4px;margin-bottom:2px;text-align:center;font-weight:600;}
.cmp-customts-stepper{display:flex;flex-direction:row;align-items:center;gap:14px;justify-content:center;}
.cmp-customts-num{font-family:‘Times New Roman’,serif;font-size:48px;font-weight:900;color:#f5c518;color:var(–gold);line-height:1;min-width:72px;text-align:center;}
.cmp-customts-arrows{display:flex;flex-direction:column;gap:4px;}
.cmp-customts-arrow{background:#10101e;background:var(–surf);border:2px solid rgba(245,197,24,.4);color:#f5c518;color:var(–gold);font-size:14px;font-weight:900;width:50px;height:26px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.cmp-customts-arrow:active{background:rgba(245,197,24,.18);}
.cmp-customts-arrow:disabled{opacity:.3;cursor:not-allowed;}
.cmp-customts-actions{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid rgba(245,197,24,.2);}
.cmp-customts-actions button{flex:1;padding:11px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-customts-ok{border-color:#f5c518 !important;color:#f5c518 !important;}
.cmp-customts-ok:active{background:rgba(245,197,24,.18);}

/* ===== TOAST ===== */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:min(360px,90vw);}
.toast{
background:linear-gradient(135deg,#fef3c7,#fde68a);
border:3px solid #f5c518;border-radius:20px;
padding:14px 18px;display:flex;align-items:center;gap:14px;
box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 4px rgba(245,197,24,.2);
color:#1a1a2e;
animation:t-in .42s cubic-bezier(.5,1.7,.4,1);
transform-origin:center bottom;font-family:inherit;
}
.toast.e{background:linear-gradient(135deg,#fecaca,#fca5a5);border-color:#dc2626;}

<script>
'use strict';

// ─────────────────────────────────────────
// DATA
// ─────────────────────────────────────────

const BADGES = [{id:'composer',ic:'✏️',name:'Composer',desc:'Submit a song to the library',xp:100}];

// ─────────────────────────────────────────
// STORE & USER
// ─────────────────────────────────────────

const S = {
  get(k,d=null){try{return JSON.parse(localStorage.getItem('pb_'+k))??d;}catch{return d;}},
  set(k,v){try{localStorage.setItem('pb_'+k,JSON.stringify(v));}catch{}},
};

const U = {
  _c:null,
  blank(){return{mascot:'panda',xp:0,streak:0,lastPractice:null,songsPlayed:0,songsCompleted:[],badges:[],totalPerfect:0,drillSessions:0};},
  get(){return this._c||(this._c=S.get('user',this.blank()));},
  save(){S.set('user',this._c);},
  up(fn){fn(this.get());this.save();return this._c;},
  addXP(n){this.up(u=>u.xp=(u.xp||0)+n);},
  badge(id){
    const u=this.get();
    if(u.badges.includes(id))return false;
    const b=BADGES.find(x=>x.id===id);
    this.up(u=>{u.badges.push(id);u.xp=(u.xp||0)+(b?.xp||0);});
    if(b)Toast.show({ic:b.ic,title:'Badge Unlocked!',sub:b.name});
    return true;
  },
};

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────

const Toast = {
  _anchor: null,
  _active: [],
  show({ic='🎵',title='',sub='',type='',cat=''}){
    // Replacement rule: a new toast removes ALL existing toasts EXCEPT in the
    // special beat↔counting pair, which is allowed to coexist side-by-side.
    this._active=this._active.filter(x=>x.el.isConnected);
    this._active=this._active.filter(x=>{
      const pair=(cat==='beat'&&x.cat==='counting')||(cat==='counting'&&x.cat==='beat');
      if(pair)return true;
      try{x.el.remove();}catch(e){}
      return false;
    });
    const el=document.createElement('div');
    el.className=`toast${type==='e'?' e':type==='s'?' s':''}`;
    el.innerHTML=`<span class="t-ic">${ic}</span><div class="t-body"><div class="t-title">${title}</div><div class="t-sub">${sub}</div></div>`;
    // Prefer placing toast near a visible beaver so it looks like he's saying it.
    let beaver=document.querySelector('.cmp-input-mid .cmp-beaver');
    if(!beaver||beaver.offsetParent===null) beaver=document.querySelector('.cmp-conductor .cmp-beaver');
    if(beaver&&beaver.offsetParent===null) beaver=null;
    const target=beaver||(this._anchor&&this._anchor.isConnected?this._anchor:null);
    if(target){
      el.style.position='fixed';
      el.style.maxWidth='280px';
      el.style.zIndex='9999';
      el.style.pointerEvents='none';
      document.body.appendChild(el);
      const tr=el.getBoundingClientRect();
      const r=target.getBoundingClientRect();
      const cx=r.left+r.width/2;
      // Place beside any other still-visible toasts (other categories)
      const slot=this._active.length;
      let L;
      if(slot===0){
        L=cx-tr.width/2;
      } else if(slot===1){
        const existing=this._active[0];
        if(existing && existing.el.isConnected){
          existing.el.style.left=Math.max(8,cx-existing.el.getBoundingClientRect().width-12)+'px';
        }
        L=cx+12;
      } else {
        L=cx-tr.width/2;
      }
      L=Math.max(8,Math.min(window.innerWidth-tr.width-8,L));
      let T=r.top-10-tr.height;
      if(slot>=2) T-=(slot-1)*(tr.height+6);
      if(T<8) T=8;
      el.style.left=L+'px';
      el.style.top=T+'px';
      this._active.push({el,cat});
    } else {
      document.getElementById('toasts').appendChild(el);
    }
    setTimeout(()=>{el.style.animation='t-out .28s ease-in forwards';setTimeout(()=>el.remove(),280);},3200);
  },
};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,[role="button"]');if(b)Toast._anchor=b;},true);

// ─────────────────────────────────────────
// COMPOSE SHEET RENDERER
// ─────────────────────────────────────────

const CmpSheet = {
  ST:32, SB:64,
  NY:{
    'G5':14,'F5':18,'E5':22,'D5':26,'C5':30,'B4':34,'A4':38,'G4':42,
    'F4':46,'E4':50,'D4':54,'C4':58,'B3':62,'A3':66,'G3':70,
    'C#4':58,'D#4':54,'F#4':46,'G#4':42,'A#4':38,'C#5':30,'D#5':26,
  },

  noteIcon(d,dot,rest){
    let body='';
    if(rest){
      // Rests — proper glyphs, not note-shapes
      if(d===1)      body=`<rect x="10" y="20" width="16" height="5" fill="#000"/>`;
      else if(d===2) body=`<rect x="10" y="25" width="16" height="5" fill="#000"/>`;
      else if(d===4) body=`<path d="M14 12 Q22 18 16 24 Q22 28 15 34 L13 38 Q18 32 13 30 Q10 26 17 22 Q11 18 15 14" fill="#000" stroke="#000" stroke-width="1"/>`;
      else if(d===8) body=`<path d="M11 34 L21 12" stroke="#000" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="13" cy="16" r="3" fill="#000"/><path d="M13 16 Q20 14 21 12" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      else           body=`<path d="M10 38 L22 10" stroke="#000" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="14" cy="14" r="3" fill="#000"/><path d="M14 14 Q21 12 22 10" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="12" cy="24" r="3" fill="#000"/><path d="M12 24 Q18 22 19 20" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    } else {
      const open=d<=2;
      const head=open
        ?`<ellipse cx="14" cy="30" rx="5.5" ry="4" fill="none" stroke="#000" stroke-width="1.8" transform="rotate(-18 14 30)"/>`
        :`<ellipse cx="14" cy="30" rx="5.5" ry="4" fill="#000" transform="rotate(-18 14 30)"/>`;
      const stem=d>1?`<line x1="19" y1="30" x2="19" y2="10" stroke="#000" stroke-width="1.6"/>`:'';
      let flag='';
      if(d>=8)  flag=`<path d="M19 10 Q27 14 25 22" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      if(d>=16) flag+=`<path d="M19 22 Q27 26 25 34" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      body=head+stem+flag;
    }
    let dotEl='';
    if(dot){
      let dcx=24,dcy=30;
      if(rest){
        if(d===1) dcx=28,dcy=18;
        else if(d===2) dcx=28,dcy=24;
        else if(d===4) dcx=26,dcy=22;
        else if(d===8) dcx=27,dcy=22;
      }
      dotEl=`<circle cx="${dcx}" cy="${dcy}" r="1.8" fill="#000"/>`;
    }
    return `<svg viewBox="0 0 32 44" width="30" height="40">${body}${dotEl}</svg>`;
  },

  render(svgEl, state){
    const {notes,ts,totalMeasures,selectedMeasure,selectedMeasureEnd}=state;
    if(!ts){svgEl.innerHTML='';return;}
    const mLeft=68,H=108,ST=this.ST,SB=this.SB;
    const vp=svgEl.parentElement?.clientWidth||600;
    // Pre-compute measures so mW can adapt to the densest one — otherwise dense
    // 16th runs in tight meters (e.g. 20 16ths in 10/8) can't fit at min spacing.
    const measures=this._getMeasures(notes,ts.cap,totalMeasures);
    let maxNotes=0;
    for(let mi=0;mi<totalMeasures;mi++){
      const c=(measures[mi]||[]).length;
      if(c>maxNotes)maxNotes=c;
    }
    // 18px/note is the safe upper-bound (unbeamed worst case); +30 for start/end padding.
    // Beamed runs are tighter so this overshoots slightly but never crowds.
    const minDenseMW=maxNotes*18+30;
    const mW=Math.max(80,(vp-mLeft)/4,minDenseMW);
    const W=mLeft+totalMeasures*mW;
    svgEl.style.width=W+'px';
    svgEl.style.flexShrink='0';
    const lc=['#8B0000','#B8860B','#d4a800','#B8860B','#8B0000'];
    let s=`<rect width="${W}" height="${H}" fill="#0b0b18"/>`;
    // Staff lines
    for(let i=0;i<5;i++){
      const y=ST+i*8;
      s+=`<line x1="4" y1="${y}" x2="${W-4}" y2="${y}" stroke="${lc[i]}" stroke-width="1.3" opacity=".7"/>`;
    }
    // Neutral/rhythm clef — two vertical bars (hand-drawn, font-independent)
    s+=`<rect x="10" y="${ST+3}" width="3.5" height="${SB-ST-6}" fill="#f5c518" opacity=".9"/><rect x="17" y="${ST+3}" width="3.5" height="${SB-ST-6}" fill="#f5c518" opacity=".9"/>`;
    // Time sig
    s+=`<text x="52" y="${ST+14}" font-size="13" font-family="'Times New Roman',serif" fill="#f5c518" text-anchor="middle">${ts.b}</text>`;
    s+=`<text x="52" y="${ST+27}" font-size="13" font-family="'Times New Roman',serif" fill="#f5c518" text-anchor="middle">${ts.v}</text>`;
    // Measures already computed above for mW sizing
    const isCompound=(ts.v===8&&ts.b%3===0&&ts.b>3);
    const beatSize=isCompound?3:Math.max(1,ts.cap/ts.b);
    // Range-highlight bounds (handles single-measure and range selection)
    const selEnd=selectedMeasureEnd==null?selectedMeasure:selectedMeasureEnd;
    const rS=selectedMeasure==null?null:Math.min(selectedMeasure,selEnd);
    const rE=selectedMeasure==null?null:Math.max(selectedMeasure,selEnd);
    for(let mi=0;mi<totalMeasures;mi++){
      const mx=mLeft+mi*mW;
      // Selection overlay behind staff/notes (range-aware)
      if(rS!==null&&mi>=rS&&mi<=rE){
        s+=`<rect x="${mx}" y="${ST-14}" width="${mW}" height="${SB-ST+18}" fill="rgba(245,197,24,.08)"/>`;
      }
      // Measure number (tappable, left-aligned at measure start)
      s+=`<g data-measure-idx="${mi}" style="cursor:pointer"><rect x="${mx}" y="0" width="${mW}" height="${ST-4}" fill="transparent" pointer-events="all"/><text x="${mx+4}" y="${ST-8}" font-size="9" fill="rgba(245,197,24,.55)" text-anchor="start" font-family="'Times New Roman',serif" font-weight="900">${mi+1}</text></g>`;
      s+=`<line x1="${mx}" y1="${ST}" x2="${mx}" y2="${SB}" stroke="rgba(245,197,24,.35)" stroke-width="1"/>`;
      const mNotes=measures[mi]||[];
      const filled=mNotes.reduce((a,n)=>a+n.dur8,0);
      const remaining=ts.cap-filled;
      // Beam groups: runs of ≥2 consecutive 8ths/16ths within one beat (no rests/dots; triplets beam with triplets)
      const ng=new Array(mNotes.length).fill(-1);const groups=[];let cur=[];
      const flush=()=>{if(cur.length>=2){groups.push(cur);cur.forEach(i=>ng[i]=groups.length-1);}cur=[];};
      for(let i=0;i<mNotes.length;i++){
        const n=mNotes[i];
        const beamable=!n.rest&&(n.d===8||n.d===16);
        if(!beamable){flush();continue;}
        if(cur.length===0){cur=[i];continue;}
        const fb=Math.floor(mNotes[cur[0]].startBeat8/beatSize);
        const tb=Math.floor(n.startBeat8/beatSize);
        const mixTr=!!mNotes[cur[0]].triplet!==!!n.triplet;
        if(fb===tb&&!mixTr){cur.push(i);}else{flush();cur=[i];}
      }
      flush();
      // Beam-aware spacing: tighter floor (+11) for consecutive notes within a group, else +18
      let prevNx=mx;const pos=[];
      let globalBase=0;for(let j=0;j<mi;j++)globalBase+=(measures[j]||[]).length;
      // Phase 1: compute natural positions left-to-right
      mNotes.forEach((n,i)=>{
        const baseNx=mx+(n.startBeat8/ts.cap)*mW+10;
        const beamed=i>0&&ng[i]>=0&&ng[i]===ng[i-1];
        const prevDot=i>0&&mNotes[i-1].dot;
        const dotPad=prevDot?5:0;
        const floor=beamed?prevNx+11+dotPad:prevNx+18+dotPad;
        let nx=i===0?Math.max(mx+15,baseNx):Math.max(floor,baseNx);
        if(i===mNotes.length-1){
          const isLastM=mi===totalMeasures-1;
          const barX=isLastM?(mx+mW-4):(mx+mW); // thin final barline vs interior barline
          const beamedL=ng[i]>=0;
          let glyphR;
          if(n.rest) glyphR=8;
          else if(!beamedL&&n.d>=8) glyphR=9; // unbeamed flagged notes (8th/16th flag extends ~+8.6)
          else if(n.dot) glyphR=10;
          else glyphR=7;
          const repeatPad=(typeof Cmp!=='undefined'&&Cmp.repeatOn&&isLastM)?14:0;
          nx=Math.min(nx,barX-glyphR-8-repeatPad);
        }
        prevNx=nx;pos[i]=nx;
      });
      // Phase 2: backward-pass collision resolution. If last-note clamp pushed it
      // behind prev, cascade leftward shifts to maintain min spacing.
      for(let i=pos.length-1;i>0;i--){
        const beamedB=ng[i]>=0&&ng[i]===ng[i-1];
        const dotPadB=mNotes[i-1].dot?5:0;
        const minSp=(beamedB?11:18)+dotPadB;
        if(pos[i]-pos[i-1]<minSp){pos[i-1]=pos[i]-minSp;}
      }
      if(pos.length>0&&pos[0]<mx+15)pos[0]=mx+15;
      // Phase 3: render notes using final positions
      mNotes.forEach((n,i)=>{
        const nx=pos[i];
        const gi=globalBase+i;
        s+=`<g data-note-idx="${gi}" style="cursor:pointer"><rect x="${nx-15}" y="${ST-6}" width="30" height="${SB-ST+18}" fill="transparent" pointer-events="all"/>${this._drawNote(n,nx,ST,SB,ng[i]>=0)}</g>`;
      });
      // Beams: stems-down layout. Primary beam sits at stem tip (no gap).
      // Secondary (for 16ths) sits ABOVE primary, between notehead and primary.
      const beamY=71;
      groups.forEach(g=>{
        const bc=g.some(i=>mNotes[i].current)?'#f5c518':'rgba(240,230,208,.75)';
        const x1=pos[g[0]]-5.4,xN=pos[g[g.length-1]]-5.4;
        s+=`<rect x="${x1}" y="${beamY}" width="${xN-x1}" height="3" fill="${bc}"/>`;
        const is16=g.map(i=>mNotes[i].d===16);const inRun=new Set();
        let rs=-1;
        for(let k=0;k<=g.length;k++){
          if(k<g.length&&is16[k]){if(rs<0)rs=k;}
          else{if(rs>=0){if(k-rs>=2){const xa=pos[g[rs]]-5.4,xb=pos[g[k-1]]-5.4;s+=`<rect x="${xa}" y="${beamY-5}" width="${xb-xa}" height="3" fill="${bc}"/>`;for(let q=rs;q<k;q++)inRun.add(q);}rs=-1;}}
        }
        for(let k=0;k<g.length;k++){
          if(is16[k]&&!inRun.has(k)){
            const cx=pos[g[k]]-5.4,stubW=6;
            let nearest=-1,bestDist=Infinity;
            for(let q=0;q<g.length;q++){if(q!==k&&is16[q]){const dist=Math.abs(q-k);if(dist<bestDist){bestDist=dist;nearest=q;}}}
            const dir=nearest>=0?(nearest>k?1:-1):(k===g.length-1?-1:1);
            s+=`<rect x="${dir>0?cx:cx-stubW}" y="${beamY-5}" width="${stubW}" height="3" fill="${bc}"/>`;
          }
        }
      });
      // Fill remaining with rest
      if(remaining>0.01){
        const rx=mx+(filled/ts.cap)*mW+(remaining/ts.cap)*mW*0.5;
        s+=this._drawRest(remaining,ts.cap,rx,ST,SB);
      }
    }
    // Ties
    s+=this._drawTies(notes,measures,mLeft,mW,ts);
    // Triplet brackets
    s+=this._drawTriplets(notes,measures,mLeft,mW,ts,ST);
    // Final double barline (standard: thin + gap + thick)
    const ex=mLeft+totalMeasures*mW;
    if(Cmp.repeatOn){
      // Repeat sign: two dots before the thin barline
      const dotX=ex-12;
      const midUp=ST+(SB-ST)/3, midLo=ST+(SB-ST)*2/3;
      s+=`<circle cx="${dotX}" cy="${midUp}" r="3" fill="#f5c518"/>`;
      s+=`<circle cx="${dotX}" cy="${midLo}" r="3" fill="#f5c518"/>`;
    }
    s+=`<line x1="${ex-4}" y1="${ST}" x2="${ex-4}" y2="${SB}" stroke="#f5c518" stroke-opacity=".85" stroke-width="1.5"/>`;
    s+=`<line x1="${ex}" y1="${ST}" x2="${ex}" y2="${SB}" stroke="#f5c518" stroke-opacity=".85" stroke-width="4.5"/>`;
    // Playhead (hidden until play)
    s+=`<g id="cmp-playhead" transform="translate(68,0)"><polygon points="-6,22 6,22 0,32" fill="#f5c518" opacity="0.95"/><line x1="0" y1="32" x2="0" y2="70" stroke="#f5c518" stroke-width="2" opacity="0.95"/></g>`;
    svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svgEl.setAttribute('height',H);
    svgEl.innerHTML=s;
    // Entry-follow: smooth-scroll the current note into view if past right edge
    const cur=svgEl.querySelector('ellipse[rx="15"][ry="10"]');
    if(cur){
      const curNx=parseFloat(cur.getAttribute('cx'));
      const par=svgEl.parentElement;
      if(par && curNx>par.scrollLeft+par.clientWidth-40){
        par.scrollTo({left:Math.max(0,curNx-mLeft-20),behavior:'smooth'});
      }
      const ph=svgEl.querySelector('#cmp-playhead');
      if(ph) ph.setAttribute('transform',`translate(${curNx},0)`);
    }
  },

  _getMeasures(notes,cap,total){
    const ms=Array.from({length:total},()=>[]);
    let cum=0;
    notes.forEach(n=>{
      // Snap near-bar cum to exact bar boundary (kills triplet rounding drift)
      const near=Math.round(cum/cap)*cap;
      const cumS=Math.abs(cum-near)<0.01?near:cum;
      const mi=Math.min(Math.floor(cumS/cap),total-1);
      const sb=cumS-mi*cap;
      ms[mi].push({...n,startBeat8:sb});
      cum+=n.dur8;
    });
    return ms;
  },

  _drawNote(n,nx,ST,SB,beamed){
    if(n.rest)return this._drawRest(n.dur8,999,nx,ST,SB,n.dot,n.current);
    const ny=ST+16;
    const isCur=n.current;
    const fill=isCur?'#f5c518':'rgba(240,230,208,.75)';
    const open=n.d<=2;
    let s='';
    if(isCur) s+=`<ellipse cx="${nx}" cy="${ny}" rx="15" ry="10" fill="rgba(245,197,24,.11)"/>`;
    // Ledger lines
    for(let ly=SB+8;ly<=ny;ly+=8) s+=`<line x1="${nx-9}" y1="${ly}" x2="${nx+9}" y2="${ly}" stroke="${fill}" stroke-width="1.2" opacity=".8"/>`;
    for(let ly=ST-8;ly>=ny;ly-=8) s+=`<line x1="${nx-9}" y1="${ly}" x2="${nx+9}" y2="${ly}" stroke="${fill}" stroke-width="1.2" opacity=".8"/>`;
    // Notehead
    if(open) s+=`<ellipse cx="${nx}" cy="${ny}" rx="6" ry="4" fill="none" stroke="${fill}" stroke-width="1.7" transform="rotate(-15 ${nx} ${ny})"/>`;
    else s+=`<ellipse cx="${nx}" cy="${ny}" rx="6" ry="4" fill="${fill}" transform="rotate(-15 ${nx} ${ny})"/>`;
    // Stem — always down (notehead sits on middle line for rhythm notation)
    if(n.d!==1){
      const sx=nx-5.4;
      const sy2=ny+24;
      s+=`<line x1="${sx}" y1="${ny}" x2="${sx}" y2="${sy2}" stroke="${fill}" stroke-width="1.4"/>`;
      if(n.d>=8&&!beamed){
        s+=`<path d="M${sx} ${sy2} C${sx+12} ${sy2-6} ${sx+14} ${sy2-13} ${sx+6} ${sy2-18}" stroke="${fill}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      }
      if(n.d>=16&&!beamed){
        s+=`<path d="M${sx} ${sy2-6} C${sx+12} ${sy2-12} ${sx+14} ${sy2-19} ${sx+6} ${sy2-24}" stroke="${fill}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      }
    }
    if(n.dot) s+=`<circle cx="${nx+8}" cy="${ny-2}" r="2" fill="${fill}"/>`;
    if(n.p&&n.p.includes('#')) s+=`<text x="${nx-8}" y="${ny+4}" font-size="10" fill="${fill}" font-family="'Times New Roman',serif" text-anchor="end">♯</text>`;
    return s;
  },

  _drawRest(dur8,cap,cx,ST,SB,dot,isCur){
    const mid=ST+(SB-ST)/2, col=isCur?'#f5c518':'rgba(240,230,208,.85)';
    let body='',dx=0,dy=0;
    if(dur8>=cap){body=`<rect x="${cx-8}" y="${ST+8}" width="16" height="5" fill="${col}"/>`;dx=cx+11;dy=ST+6;}
    else if(dur8>=4){body=`<rect x="${cx-8}" y="${mid}" width="16" height="5" fill="${col}"/>`;dx=cx+11;dy=mid-3;}
    else if(dur8>=2){body=`<path d="M${cx-2} ${mid-8} Q${cx+5} ${mid-2} ${cx-1} ${mid+2} Q${cx+5} ${mid+6} ${cx-3} ${mid+10}" fill="${col}" stroke="${col}" stroke-width="1"/>`;dx=cx+9;dy=mid;}
    else if(dur8>=1){body=`<path d="M${cx-5} ${mid+8} L${cx+4} ${mid-8}" stroke="${col}" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="${cx-3}" cy="${mid-4}" r="2.2" fill="${col}"/><path d="M${cx-3} ${mid-4} Q${cx+2} ${mid-6} ${cx+4} ${mid-8}" stroke="${col}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;dx=cx+8;dy=mid-4;}
    else{body=`<path d="M${cx-5} ${mid+11} L${cx+5} ${mid-10}" stroke="${col}" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="${cx-2}" cy="${mid-6}" r="2.1" fill="${col}"/><path d="M${cx-2} ${mid-6} Q${cx+3} ${mid-8} ${cx+5} ${mid-10}" stroke="${col}" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="${cx-4}" cy="${mid+1}" r="2.1" fill="${col}"/><path d="M${cx-4} ${mid+1} Q${cx+1} ${mid-1} ${cx+3} ${mid-3}" stroke="${col}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;dx=cx+9;dy=mid-6;}
    if(dot) body+=`<circle cx="${dx}" cy="${dy}" r="1.7" fill="${col}"/>`;
    return (isCur?`<ellipse cx="${cx}" cy="${mid}" rx="15" ry="10" fill="rgba(245,197,24,.11)"/>`:'')+body;
  },

  _drawTies(notes,measures,mLeft,mW,ts){
    let s='';
    for(let i=1;i<notes.length;i++){
      if(!notes[i].tied)continue;
      const p1=this._noteX(i-1,notes,mLeft,mW,ts);
      const p2=this._noteX(i,notes,mLeft,mW,ts);
      if(p1===null||p2===null)continue;
      const ny=(this.NY[notes[i-1].p]||50)+8;
      const mx=(p1+p2)/2;
      s+=`<path d="M${p1} ${ny} Q${mx} ${ny+10} ${p2} ${ny}" stroke="rgba(240,230,208,.45)" stroke-width="1.5" fill="none"/>`;
    }
    return s;
  },

  _drawTriplets(notes,measures,mLeft,mW,ts,ST){
    let s='';
    for(let i=0;i<notes.length;i++){
      if(notes[i].triplet&&notes[i].tripletPos===0){
        // Walk forward to find group end (consecutive triplet notes with pos>0)
        let j=i;
        while(j+1<notes.length&&notes[j+1].triplet&&notes[j+1].tripletPos>0) j++;
        const x1=this._noteX(i,notes,mLeft,mW,ts);
        const x3=this._noteX(j,notes,mLeft,mW,ts);
        if(x1===null||x3===null)continue;
        const mx=(x1+x3)/2;
        // Suppress bracket (keep "3") when entire group is fully beamed (all 8ths/16ths, no dots, no rests)
        let allBeamed=true;
        for(let k=i;k<=j;k++){
          const nk=notes[k];
          if(!nk||nk.rest||nk.dot||!(nk.d===8||nk.d===16)){allBeamed=false;break;}
        }
        const col='rgba(240,230,208,.75)',y=ST-8;
        s+=`<text x="${mx}" y="${y-2}" font-size="11" fill="${col}" text-anchor="middle" font-style="italic" font-family="'Times New Roman',serif">3</text>`;
        if(!allBeamed){
          s+=`<line x1="${x1-4}" y1="${y+2}" x2="${x1-4}" y2="${y+7}" stroke="${col}" stroke-width="1.2"/>`;
          s+=`<line x1="${x1-4}" y1="${y+2}" x2="${mx-8}" y2="${y+2}" stroke="${col}" stroke-width="1.2"/>`;
          s+=`<line x1="${mx+8}" y1="${y+2}" x2="${x3+4}" y2="${y+2}" stroke="${col}" stroke-width="1.2"/>`;
          s+=`<line x1="${x3+4}" y1="${y+2}" x2="${x3+4}" y2="${y+7}" stroke="${col}" stroke-width="1.2"/>`;
        }
      }
    }
    return s;
  },

  _noteX(idx,notes,mLeft,mW,ts){
    let cum=0;for(let i=0;i<idx;i++)cum+=notes[i].dur8;
    const mi=Math.floor(cum/ts.cap);
    const b8=cum-mi*ts.cap;
    return mLeft+mi*mW+(b8/ts.cap)*mW+10;
  },
};

// ─────────────────────────────────────────
// COMPOSE ENGINE
// ─────────────────────────────────────────

const Cmp = {
  step:'entry', mode:null,
  ts:null, tempo:100,
  notes:[], durSel:4, dotSel:false, tripletMode:false,
  playing:false, playTimer:null,
  totalMeasures:4, tone:'piano', selectedMeasure:null, selectedMeasureEnd:null, loopOn:false, repeatOn:false, metronomeOn:false, drumOn:false, countingOn:false,

  TIME_SIGS:[
    {label:'Cut Time', sub:'2/2',  b:2,  v:2, cap:8,  beatUnit:2, bul:'𝅗𝅥'},
    {label:'Common',   sub:'4/4',  b:4,  v:4, cap:8,  beatUnit:4, bul:'♩'},
    {label:'2/4',      sub:'',     b:2,  v:4, cap:4,  beatUnit:4, bul:'♩'},
    {label:'3/4',      sub:'',     b:3,  v:4, cap:6,  beatUnit:4, bul:'♩'},
    {label:'5/4',      sub:'',     b:5,  v:4, cap:10, beatUnit:4, bul:'♩'},
    {label:'6/4',      sub:'',     b:6,  v:4, cap:12, beatUnit:4, bul:'♩'},
    {label:'6/8',      sub:'',     b:6,  v:8, cap:6,  beatUnit:4, bul:'♩.'},
    {label:'9/8',      sub:'',     b:9,  v:8, cap:9,  beatUnit:4, bul:'♩.'},
    {label:'3/8',      sub:'',     b:3,  v:8, cap:3,  beatUnit:8, bul:'♪'},
    {label:'12/8',     sub:'',     b:12, v:8, cap:12, beatUnit:4, bul:'♩.'},
    {label:'7/8',      sub:'',     b:7,  v:8, cap:7,  beatUnit:8, bul:'♪'},
    {label:'Make Your Own', sub:'',b:4,  v:4, cap:8,  beatUnit:4, bul:'♩', placeholder:true},
  ],

  NOTE_DURS:[
    {d:1, dot:false, label:'Whole'},
    {d:2, dot:false, label:'Half'},
    {d:2, dot:true,  label:'Dot. Half'},
    {d:4, dot:false, label:'Quarter'},
    {d:4, dot:true,  label:'Dot. Qtr'},
    {d:8, dot:false, label:'Eighth'},
    {d:8, dot:true,  label:'Dot. 8th'},
    {d:16,dot:false, label:'16th'},
  ],

  init(){
    this._buildTimeSigs();
    this._buildNoteButtons();
    this._buildCircle();
    // iOS Safari doesn't re-layout SVG text on font-swap — rebuild buttons once Bravura loads
    if(document.fonts?.ready) document.fonts.ready.then(()=>this._buildNoteButtons());

    // FIX 4: wire time sig buttons via addEventListener (both click + touchend)
    // Bypasses any onclick attribute issues on iOS Safari with dynamic content
    document.querySelectorAll('#cmp-ts-grid button[data-idx]').forEach(btn=>{
      const i=parseInt(btn.dataset.idx,10);
      const handler=(e)=>{
        e.preventDefault();
        this.pickTs(i);
      };
      btn.addEventListener('click',handler);
      btn.addEventListener('touchend',handler);
    });

    if(!this.ts) this._showStep('entry');
    else this._showStep(this.step);
    if(this.step==='compose') this.render();
  },

  _showStep(s){
    const map={entry:'cmp-s1',timesig:'cmp-s2',compose:'cmp-s3',clef:'cmp-s4',key:'cmp-s5',melody:'cmp-s6'};
    // Remove all active states first
    ['cmp-s1','cmp-s2','cmp-s3','cmp-s4','cmp-s5','cmp-s6'].forEach(id=>{
      document.getElementById(id)?.classList.remove('cmp-active');
    });
    // Add active state in next animation frame — iOS Safari requires this
    // gap between display:none removal and display:flex+animation start
    const target=document.getElementById(map[s]);
    if(target){
        target.classList.add('cmp-active');
    }
    this.step=s;
  },

  _buildTimeSigs(){
    const grid=document.getElementById('cmp-ts-grid');if(!grid)return;
    // FIX 4: use data-idx, no onclick attribute — addEventListener wired in init()
    grid.innerHTML=this.TIME_SIGS.map((ts,i)=>{
      if(ts.placeholder){
        return `<button class="cmp-ts-btn" data-idx="${i}">
          <span class="cmp-ts-btn-text">Make Your Own</span>
        </button>`;
      }
      return `<button class="cmp-ts-btn" data-idx="${i}">
        <div class="cmp-tsn-wrap">
          <span class="cmp-tsn-top">${ts.b}</span>
          <span class="cmp-tsn-bot">${ts.v}</span>
        </div>
      </button>`;
    }).join('');
  },

  _buildNoteButtons(){
    const nr=document.getElementById('cmp-note-row');
    const rr=document.getElementById('cmp-rest-row');
    if(!nr||!rr)return;
    nr.innerHTML=this.NOTE_DURS.map((n,i)=>`
      <button class="cmp-nbtn" id="cnb-n-${i}" onclick="Cmp.addEntry('C4',${n.d},${n.dot},false)">
        ${CmpSheet.noteIcon(n.d,n.dot,false)}
        <span class="cmp-nbtn-lbl">${n.label}</span>
      </button>`).join('');
    rr.innerHTML=this.NOTE_DURS.map((n,i)=>`
      <button class="cmp-nbtn" id="cnb-r-${i}" onclick="Cmp.addEntry('REST',${n.d},${n.dot},true)">
        ${CmpSheet.noteIcon(n.d,n.dot,true)}
        <span class="cmp-nbtn-lbl">${n.label}</span>
      </button>`).join('');
  },

  pickMode(mode){
    this.mode=mode;
    if(mode==='rhythm'){
      this._melodyFlow=false;
      this._showStep('timesig');
    } else if(mode==='pitch'){
      this._melodyFlow=true;
      this._showStep('clef');
    }
  },

  KEYS:[
    {name:'C',     rel:'Am',     acc:0, type:'#'},
    {name:'G',     rel:'Em',     acc:1, type:'#'},
    {name:'D',     rel:'Bm',     acc:2, type:'#'},
    {name:'A',     rel:'F♯m',    acc:3, type:'#'},
    {name:'E',     rel:'C♯m',    acc:4, type:'#'},
    {name:'B',     rel:'G♯m',    acc:5, type:'#'},
    {name:'F♯/G♭', rel:'D♯m/E♭m',acc:6, type:'#'},
    {name:'D♭',    rel:'B♭m',    acc:5, type:'b'},
    {name:'A♭',    rel:'Fm',     acc:4, type:'b'},
    {name:'E♭',    rel:'Cm',     acc:3, type:'b'},
    {name:'B♭',    rel:'Gm',     acc:2, type:'b'},
    {name:'F',     rel:'Dm',     acc:1, type:'b'},
  ],

  _buildCircle(){
    const wrap=document.getElementById('cmp-cof-wrap');if(!wrap)return;
    const cx=160,cy=160,rOut=150,rMid=95,rIn=50;
    const D2R=Math.PI/180;
    const pt=(a,r)=>{const ar=a*D2R;return [cx+r*Math.sin(ar),cy-r*Math.cos(ar)];};
    const wedge=(i,r1,r2,inner)=>{
      const aS=i*30-15,aE=i*30+15;
      const [x1,y1]=pt(aS,r2);
      const [x2,y2]=pt(aE,r2);
      const [x3,y3]=pt(aE,r1);
      const [x4,y4]=pt(aS,r1);
      return `<path class="cof-wedge${inner?' inner':''}" data-key="${i}" data-ring="${inner?'minor':'major'}" d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r2} ${r2} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)} A ${r1} ${r1} 0 0 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z"/>`;
    };
    let svg=`<svg class="cmp-cof" viewBox="0 0 320 320" width="300" height="300">`;
    for(let i=0;i<12;i++) svg+=wedge(i,rMid,rOut,false);
    for(let i=0;i<12;i++) svg+=wedge(i,rIn,rMid,true);
    const labelROut=(rMid+rOut)/2,labelRIn=(rIn+rMid)/2;
    for(let i=0;i<12;i++){
      const a=i*30;
      const [lx,ly]=pt(a,labelROut);
      const [lxi,lyi]=pt(a,labelRIn);
      const k=this.KEYS[i];
      const fM=k.name.length>3?9:14;
      const fm=k.rel.length>4?8:11;
      svg+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fM}">${k.name}</text>`;
      svg+=`<text x="${lxi.toFixed(1)}" y="${lyi.toFixed(1)}" font-size="${fm}">${k.rel}</text>`;
      if(k.acc>0){
        const [ax,ay]=pt(a,rOut-9);
        const sym=k.type==='#'?'♯':'♭';
        svg+=`<text class="cof-acc" x="${ax.toFixed(1)}" y="${ay.toFixed(1)}">${k.acc}${sym}</text>`;
      }
    }
    svg+=`<circle cx="${cx}" cy="${cy}" r="${rIn}" fill="#10101e" stroke="rgba(245,197,24,.4)" stroke-width="1.5"/>`;
    svg+=`<text x="${cx}" y="${cy-7}" font-size="10" fill="#f5c518">CIRCLE</text>`;
    svg+=`<text x="${cx}" y="${cy+7}" font-size="10" fill="#f5c518">OF 5THS</text>`;
    svg+=`</svg>`;
    wrap.innerHTML=svg;
    wrap.querySelectorAll('.cof-wedge').forEach(el=>{
      el.addEventListener('click',()=>{
        const i=parseInt(el.dataset.key);
        const ring=el.dataset.ring;
        Cmp.pickKey(i,ring);
      });
    });
  },

  pickClef(c){
    this._clef=c;
    const lbl=c.charAt(0).toUpperCase()+c.slice(1);
    Toast.show({ic:'🎼',title:`${lbl} Clef`,sub:'Now pick a key signature.'});
    this._showStep('key');
  },

  pickKey(i,ring){
    const k=this.KEYS[i];
    const name=ring==='minor'?k.rel:k.name;
    this._keysig={idx:i,name:name,major:ring==='major',acc:k.acc,type:k.type};
    Toast.show({ic:'🎼',title:`Key: ${name}`,sub:`${this._clef} clef · ${k.acc} ${k.type==='#'?'sharp':'flat'}${k.acc===1?'':'s'}`});
    const hdr=document.getElementById('cmp-mel-hdr');
    if(hdr) hdr.textContent=`${this._clef} • ${name}`;
    const info=document.getElementById('cmp-mel-info');
    if(info) info.textContent=`${this._clef.toUpperCase()} CLEF · ${name}`;
    if(this._melodyFlow){
      this._showStep('timesig');
    } else {
      this._showStep('melody');
    }
  },

  pickTs(i){
    const ts=this.TIME_SIGS[i];
    console.log('time sig selected:',ts);
    if(ts.placeholder){this.openCustomTs();return;}
    this.ts=ts;this.tempo=100;this.notes=[];
    document.getElementById('cmp-ts-label').textContent=ts.sub||ts.label;
    this._updTempoDisp();
    this._showStep('compose');
    this.render();
  },

  // CUSTOM TIME SIGNATURE MODAL
  _customTs:{top:4,bot:4},
  _CTS_BOTS:[1,2,4,8,16,32],
  openCustomTs(){
    this._customTs={top:4,bot:4};
    this._updCustomTsUI();
    document.getElementById('cmp-customts-modal')?.classList.add('on');
  },
  closeCustomTs(){
    document.getElementById('cmp-customts-modal')?.classList.remove('on');
  },
  customTsStep(which,dir){
    if(which==='top'){
      this._customTs.top=Math.max(1,Math.min(32,this._customTs.top+dir));
    } else {
      const arr=this._CTS_BOTS;
      let idx=arr.indexOf(this._customTs.bot);
      idx=Math.max(0,Math.min(arr.length-1,idx+dir));
      this._customTs.bot=arr[idx];
    }
    this._updCustomTsUI();
  },
  _updCustomTsUI(){
    const {top,bot}=this._customTs;
    const tEl=document.getElementById('cmp-cts-top'); if(tEl)tEl.textContent=top;
    const bEl=document.getElementById('cmp-cts-bot'); if(bEl)bEl.textContent=bot;
    const ok=document.getElementById('cmp-cts-ok'); if(ok)ok.textContent=`✓ Use ${top}/${bot}`;
    const tu=document.getElementById('cmp-cts-top-up'); if(tu)tu.disabled=top>=32;
    const td=document.getElementById('cmp-cts-top-dn'); if(td)td.disabled=top<=1;
    const arr=this._CTS_BOTS, bIdx=arr.indexOf(bot);
    const bu=document.getElementById('cmp-cts-bot-up'); if(bu)bu.disabled=bIdx>=arr.length-1;
    const bd=document.getElementById('cmp-cts-bot-dn'); if(bd)bd.disabled=bIdx<=0;
  },
  customTsConfirm(){
    const {top,bot}=this._customTs;
    const cap=top*8/bot;
    const ts={label:'Custom',sub:`${top}/${bot}`,b:top,v:bot,cap,beatUnit:bot,bul:'♩'};
    this.closeCustomTs();
    this.ts=ts;this.tempo=100;this.notes=[];
    document.getElementById('cmp-ts-label').textContent=ts.sub;
    this._updTempoDisp();
    this._showStep('compose');
    this.render();
  },

  goBack(){
    this.stop();
    if(this.step==='compose') this._showStep('timesig');
    else if(this.step==='timesig') this._showStep(this._melodyFlow?'key':'entry');
    else if(this.step==='clef') this._showStep('entry');
    else if(this.step==='key') this._showStep('clef');
    else if(this.step==='melody') this._showStep('compose');
  },

  // FEATURE 1 — hold-to-accelerate tempo
  _holdDir:0, _holdTimer:null, _holdInterval:null, _holdMs:0,
  startHold(dir){
    if(this._holdTimer)return;
    this._holdMs=0;
    this._stepTempo(dir); // immediate single tap
    this._holdTimer=setTimeout(()=>{
      this._holdInterval=setInterval(()=>{
        this._holdMs+=60;
        const rate=this._holdMs<800?1:this._holdMs<2000?2:5;
        this._stepTempo(dir*rate);
      },60);
    },400);
  },
  endHold(){
    clearTimeout(this._holdTimer);clearInterval(this._holdInterval);
    this._holdTimer=null;this._holdInterval=null;this._holdMs=0;
  },
  _stepTempo(delta){
    this.tempo=Math.min(280,Math.max(40,this.tempo+delta));
    this._updTempoDisp();
  },
  slower(){this._stepTempo(-1);},
  faster(){this._stepTempo(1);},
  _updTempoDisp(){
    const el=document.getElementById('cmp-tempo-disp');
    if(el) el.textContent=`♩ = ${this.tempo}`;
  },

  _dur8(d,dot){const base={1:8,2:4,4:2,8:1,16:0.5}[d]||2;return dot?base*1.5:base;},
  _totalCap(){return this.totalMeasures*(this.ts?.cap||8);},
  _filled(){return this.notes.reduce((a,n)=>a+n.dur8,0);},

  // BUG 3 — explicit triplet group tracking
  _tg:{base:0,count:0,accum:0}, // triplet group state

  addEntry(pitch,d,dot,isRest){
    if(!this.ts)return;
    if(this._selectedIdx!==null){return this.replaceSelected(pitch,d,dot,isRest);}
    let totalCap=this._totalCap();
    const filled=this._filled();

    // Only grow staff when incoming note actually overflows total cap
    if(filled+this._dur8(d,dot)>totalCap+0.001){
      this.totalMeasures++;
      totalCap=this._totalCap();
    }

    const baseDur8=this._dur8(d,dot);
    let dur8;
    let isTriplet=false, tripletPos=null;

    if(this.tripletMode){
      // BUG 3 — group-aware triplet math (mixed-duration support)
      if(this._tg.count===0){this._tg.base=baseDur8;this._tg.accum=0;}
      const targetGroup=this._tg.base*2; // "next value up" total duration
      const candidate=parseFloat((baseDur8*2/3).toFixed(6));
      const newAccum=parseFloat((this._tg.accum+candidate).toFixed(6));
      if(newAccum>targetGroup+0.001){
        Toast.show({ic:'⚠',title:'Too long for triplet',sub:'That note would overflow the group. Pick a shorter value.',type:'e'});
        return;
      }
      isTriplet=true;
      tripletPos=this._tg.count; // 0,1,2,3… — captured BEFORE increment
      dur8=candidate;
      this._tg.accum=newAccum;
      this._tg.count++;
      if(Math.abs(targetGroup-this._tg.accum)<0.001){
        this._tg={base:0,count:0,accum:0};
        this.tripletMode=false;
        document.getElementById('cmp-triplet-btn')?.classList.remove('on');
      }
    } else {
      dur8=baseDur8;
    }

    const curMi=Math.floor(filled/this.ts.cap);
    // Snap near-bar filled to exact bar boundary (kills triplet rounding drift)
    const nearBar=Math.round(filled/this.ts.cap)*this.ts.cap;
    const filledS=Math.abs(filled-nearBar)<0.01?nearBar:filled;
    const beatInMeasure=parseFloat((filledS-Math.floor(filledS/this.ts.cap)*this.ts.cap).toFixed(6));
    const remaining=parseFloat((this.ts.cap-beatInMeasure).toFixed(6));

    if(this.notes.length) this.notes[this.notes.length-1].current=false;

    if(dur8<=remaining+0.001){
      const actualDur8=Math.min(dur8,remaining); // BUG 2 — never exceed remaining
      this.notes.push({p:isRest?'REST':pitch,d,dot,dur8:actualDur8,rest:isRest,triplet:isTriplet,tripletPos:tripletPos,tied:false,current:true});
    } else {
      // Split with tie — first half fills measure, second goes to next
      const d1=this._closestDur(remaining);
      const part2=parseFloat((dur8-remaining).toFixed(6));
      const d2=this._closestDur(part2);
      this.notes.push({p:isRest?'REST':pitch,d:d1.d,dot:d1.dot,dur8:remaining,rest:isRest,triplet:false,tripletPos:null,tied:false,current:false});
      const newFilled=parseFloat((filled+remaining).toFixed(6));
      // BUG 2 — only add tie-continuation if still within cap
      if(newFilled<totalCap-0.001){
        const maxPart2=Math.min(part2,parseFloat((totalCap-newFilled).toFixed(6)));
        const d2b=this._closestDur(maxPart2);
        this.notes.push({p:isRest?'REST':pitch,d:d2b.d,dot:d2b.dot,dur8:maxPart2,rest:isRest,triplet:false,tripletPos:null,tied:true,current:true});
      }
    }

    this.render();
  },

  _curTripletPos(){let c=0;for(let i=this.notes.length-1;i>=0;i--){if(this.notes[i].triplet)c++;else break;}return c%3;},

  _closestDur(dur8){
    const opts=[
      {d:1,dot:false,dur8:8},{d:2,dot:true,dur8:6},{d:2,dot:false,dur8:4},
      {d:4,dot:true,dur8:3},{d:4,dot:false,dur8:2},{d:8,dot:true,dur8:1.5},{d:8,dot:false,dur8:1},{d:16,dot:false,dur8:0.5}
    ];
    return opts.reduce((best,o)=>Math.abs(o.dur8-dur8)<Math.abs(best.dur8-dur8)?o:best);
  },

  undo(){
    if(!this.notes.length){Toast.show({ic:'↩',title:'Nothing to undo',sub:'Staff is already empty.',type:'e'});return;}
    this._selectedIdx=null;
    this.notes.pop();
    if(this.notes.length) this.notes[this.notes.length-1].current=true;
    // Reset triplet group if undoing into one
    this._tg={base:0,count:0,accum:0};
    this.render();
  },

  trash(){
    if(!this.notes.length)return;
    const n=this.notes[this.notes.length-1];
    n.p='REST';n.rest=true;this.render();
  },

  _selectedIdx:null,

  selectNote(idx){
    if(idx==null||idx<0||idx>=this.notes.length)return;
    this.notes.forEach(n=>n.current=false);
    this.notes[idx].current=true;
    this._selectedIdx=idx;
    this.render();
    // Move playhead to selected symbol's logical x (only when not actively playing)
    if(!this.playing&&this.ts){
      const svgEl=document.getElementById('cmp-svg');
      if(svgEl&&svgEl.parentElement){
        const vp=svgEl.parentElement.clientWidth;
        const mW=Math.max(80,(vp-68)/4);
        let cum=0;for(let i=0;i<idx;i++)cum+=this.notes[i].dur8;
        const mi=Math.floor(cum/this.ts.cap);
        const b8=cum-mi*this.ts.cap;
        const px=68+mi*mW+(b8/this.ts.cap)*mW+10;
        const ph=document.getElementById('cmp-playhead');
        if(ph)ph.setAttribute('transform',`translate(${px},0)`);
      }
    }
  },

  deselectNote(){
    if(this._selectedIdx===null)return;
    this._selectedIdx=null;
    this.notes.forEach(n=>n.current=false);
    if(this.notes.length) this.notes[this.notes.length-1].current=true;
    this.render();
  },

  replaceSelected(pitch,d,dot,isRest){
    const idx=this._selectedIdx;
    if(idx===null||idx>=this.notes.length)return;
    const orig=this.notes[idx];
    const newDur8=this._dur8(d,dot);
    const diff=parseFloat((newDur8-orig.dur8).toFixed(6));
    if(diff>0.001){
      // Upsize: walk forward absorbing rests until deficit met; blocked by any non-rest note
      let need=diff;
      for(let j=idx+1;j<this.notes.length&&need>0.001;j++){
        const nj=this.notes[j];
        if(!nj.rest){
          Toast.show({ic:'⚠',title:'Too long',sub:'Following note blocks upsize. Pick a shorter value.',type:'e'});
          return;
        }
        if(nj.dur8<=need+0.001){need=parseFloat((need-nj.dur8).toFixed(6));}
        else{need=0;break;}
      }
      if(need>0.001){
        // Insufficient rests — grow staff only if at tail
        if(idx+1+this.notes.slice(idx+1).findIndex(n=>!n.rest)===idx+1&&this.notes.slice(idx+1).some(n=>!n.rest)){
          Toast.show({ic:'⚠',title:'Too long',sub:'Replacement won\u2019t fit. Pick a shorter value or deselect.',type:'e'});
          return;
        }
        while(this._filled()+diff>this._totalCap()+0.001){this.totalMeasures++;}
      }
      // Apply: mutate orig, then consume rests
      orig.p=isRest?'REST':pitch;orig.d=d;orig.dot=dot;orig.rest=isRest;orig.tied=false;orig.dur8=newDur8;
      let remaining=diff;
      while(remaining>0.001&&idx+1<this.notes.length){
        const nj=this.notes[idx+1];
        if(!nj.rest)break;
        if(nj.dur8<=remaining+0.001){remaining=parseFloat((remaining-nj.dur8).toFixed(6));this.notes.splice(idx+1,1);}
        else{nj.dur8=parseFloat((nj.dur8-remaining).toFixed(6));const r=this._closestDur(nj.dur8);nj.d=r.d;nj.dot=r.dot;remaining=0;break;}
      }
      this._advanceSelection(idx);
      this.render();
      return;
    }
    orig.p=isRest?'REST':pitch;orig.d=d;orig.dot=dot;orig.rest=isRest;orig.tied=false;
    const gap=parseFloat((orig.dur8-newDur8).toFixed(6));
    orig.dur8=newDur8;
    if(gap>0.001){
      const r=this._closestDur(gap);
      this.notes.splice(idx+1,0,{p:'REST',d:r.d,dot:r.dot,dur8:gap,rest:true,triplet:false,tripletPos:null,tied:false,current:false});
    }
    this._advanceSelection(idx);
    this.render();
  },

  _advanceSelection(fromIdx){
    const nextIdx=fromIdx+1;
    if(nextIdx<this.notes.length){
      this.selectNote(nextIdx);
    } else {
      // At tail — deselect so next addEntry appends rather than replaces
      this.notes.forEach(n=>n.current=false);
      this._selectedIdx=null;
    }
  },

  // FEATURE 2 — nuke entire composition
  nuke(){
    this.stop();this.notes=[];this.totalMeasures=4;this._tg={base:0,count:0,accum:0};
    this._selectedIdx=null;this.selectedMeasure=null;this.selectedMeasureEnd=null;
    this.tripletMode=false;
    this.tempo=100;this._updTempoDisp();
    document.getElementById('cmp-triplet-btn')?.classList.remove('on');
    Toast.show({ic:'💣',title:'Nuked.',sub:'Staff cleared. Start over, champion.'});
    this.render();
    document.getElementById('cmp-svg').parentElement.scrollLeft=0;
  },

  addMelody(){
    this._melodyFlow=false;
    if(!this._clef){
      this._showStep('clef');
    } else if(!this._keysig){
      this._showStep('key');
    } else {
      this._showStep('melody');
    }
  },

  tapTempo(){
    const now=performance.now();
    if(!this._tapTimes||now-this._tapTimes[this._tapTimes.length-1]>2000){this._tapTimes=[];}
    this._tapTimes.push(now);
    // Keep only last 6 taps for rolling average
    if(this._tapTimes.length>6)this._tapTimes.shift();
    if(this._tapTimes.length<2){
      Toast.show({ic:'👆',title:'Keep tapping',sub:'Need at least 2 taps for a tempo.'});
      return;
    }
    const intervals=[];
    for(let i=1;i<this._tapTimes.length;i++)intervals.push(this._tapTimes[i]-this._tapTimes[i-1]);
    const avgMs=intervals.reduce((a,b)=>a+b,0)/intervals.length;
    const bpm=Math.round(60000/avgMs);
    const clamped=Math.min(280,Math.max(40,bpm));
    this.tempo=clamped;
    this._updTempoDisp();
    Toast.show({ic:'⏱',title:`♩ = ${clamped}`,sub:`From ${this._tapTimes.length} taps.`});
  },

  toggleRepeat(){
    this.repeatOn=!this.repeatOn;
    document.getElementById('cmp-repeat-btn')?.classList.toggle('on',this.repeatOn);
    let loopWasOn=false;
    if(this.repeatOn){
      // Mutually exclusive with Loop (different semantics: repeat=play twice once, loop=infinite)
      if(this.loopOn){
        this.loopOn=false;
        loopWasOn=true;
        document.getElementById('cmp-loop-btn')?.classList.remove('on');
        this.selectedMeasure=null;this.selectedMeasureEnd=null;
      }
    }
    if(this.repeatOn){
      Toast.show({ic:'𝄇',title:loopWasOn?'Repeat On<br>Loop Off':'Repeat On',sub:''});

    }

  save(){
    if(!this.notes.length){Toast.show({ic:'⚠',title:'Nothing to save',sub:'Compose something first.',type:'e'});return;}
    const titleEl=document.getElementById('c-title');
    let title=(titleEl?.value||'').trim();
    if(!title){title=`Untitled ${new Date().toLocaleDateString()}`;}
    let saves={};
    try{saves=JSON.parse(localStorage.getItem('melodia:saves')||'{}');}catch(e){saves={};}
    const id=Date.now().toString(36);
    saves[id]={title,ts:this.ts,totalMeasures:this.totalMeasures,tempo:this.tempo,tone:this.tone,notes:this.notes.map(n=>({...n,current:false})),savedAt:Date.now()};
    try{localStorage.setItem('melodia:saves',JSON.stringify(saves));}
    catch(e){Toast.show({ic:'⚠',title:'Save failed',sub:'Browser storage may be full.',type:'e'});return;}
    Toast.show({ic:'💾',title:'Saved',sub:`"${title}" stored on this device.`});

  openLoadModal(){
    this._renderSaves();

  closeLoadModal(){
    document.getElementById('cmp-saves-modal')?.classList.remove('on');

  _renderSaves(){
    const listEl=document.getElementById('cmp-saves-list');
    if(!listEl)return;
    let saves={};
    try{saves=JSON.parse(localStorage.getItem('melodia:saves')||'{}');}catch(e){saves={};}
    const ids=Object.keys(saves).sort((a,b)=>(saves[b].savedAt||0)-(saves[a].savedAt||0));
    if(!ids.length){listEl.innerHTML='<div class="cmp-saves-empty">No saved compositions yet. Save one to see it here.</div>';return;}
    const esc=s=>String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
    listEl.innerHTML=ids.map(id=>{
      const s=saves[id];
      const date=s.savedAt?new Date(s.savedAt).toLocaleString():'';
      const ts=s.ts?`${s.ts.b}/${s.ts.v}`:'';
      return `<div class="cmp-save-item" onclick="Cmp._loadSavedComp('${id}')"><div class="cmp-save-meta"><div class="cmp-save-title">${esc(s.title||'Untitled')}</div><div class="cmp-save-sub">${ts} · ♩=${s.tempo||100} · ${esc(date)}</div></div><button class="cmp-save-del" onclick="event.stopPropagation();Cmp._deleteSave('${id}')">Delete</button></div>`;
    }).join('');
  },

  _loadSavedComp(id){
    let saves={};
    try{saves=JSON.parse(localStorage.getItem('melodia:saves')||'{}');}catch(e){return;}
    const s=saves[id];if(!s)return;
    this.stop();

    this.notes=(s.notes||[]).map(n=>({...n,current:false}));
    if(this.notes.length)this.notes[this.notes.length-1].current=true;
    this._selectedIdx=null;this.selectedMeasure=null;this.selectedMeasureEnd=null;
    this._tg={base:0,count:0,accum:0};this.tripletMode=false;
    document.getElementById('cmp-triplet-btn')?.classList.remove('on');
    const titleEl=document.getElementById('c-title');if(titleEl)titleEl.value=s.title||'';
    if(typeof this._updTempoDisp==='function')this._updTempoDisp();

  },

  _deleteSave(id){

    if(!saves[id])return;
    delete saves[id];
    try{localStorage.setItem('melodia:saves',JSON.stringify(saves));}catch(e){}

  surprise(){
    if(!this.ts)return;
    this.stop();
    this._tg={base:0,count:0,accum:0};this._selectedIdx=null;this.selectedMeasure=null;this.selectedMeasureEnd=null;
    this.tripletMode=false;
    document.getElementById('cmp-triplet-btn')?.classList.remove('on');
    const cap=this.ts.cap;
    // Duration pool: [d, dot, dur8]
    const poolFull=[
      [1,false,8],[2,true,6],[2,false,4],[4,true,3],[4,false,2],[8,true,1.5],[8,false,1],[16,false,0.5]
    ];
    const pool=cap<4?poolFull.filter(p=>p[2]>=1):poolFull;
    const notes=[];
    for(let m=0;m<4;m++){
      let remaining=cap;
      let guard=0;
      while(remaining>0.001&&guard++<40){
        let fit=pool.filter(p=>p[2]<=remaining+0.001);
        if(fit.length===0)break;
        const pick=fit[Math.floor(Math.random()*fit.length)];
        const isRest=Math.random()<0.18;
        notes.push({p:isRest?'REST':'D4',d:pick[0],dot:pick[1],dur8:pick[2],rest:isRest,triplet:false,tripletPos:null,tied:false,current:false});
        remaining=parseFloat((remaining-pick[2]).toFixed(6));
      }
      // Safety: if guard tripped with leftover, fill with smallest rest
      if(remaining>0.001){
        notes.push({p:'REST',d:16,dot:false,dur8:remaining,rest:true,triplet:false,tripletPos:null,tied:false,current:false});
      }
    }
    if(notes.length) notes[notes.length-1].current=true;
    this.notes=notes;
    this.totalMeasures=4;
    Toast.show({ic:'🎲',title:'Surprise!',sub:'Random rhythm generated.'});
    this.render();
    document.getElementById('cmp-svg').parentElement.scrollLeft=0;
  },

  toggleTriplet(){
    this.tripletMode=!this.tripletMode;

    if(this.tripletMode) Toast.show({ic:'³',title:'Triplet Mode',sub:'Tap 3 notes or rests.'});
  },

  toggleLoop(){

    }
    if(this.loopOn){
      Toast.show({ic:'🔁',title:repeatWasOn?'Loop On<br>Repeat Off':'Loop On',sub:''});
    } else {
      this.selectedMeasure=null;this.selectedMeasureEnd=null;

  },

  toggleMetronome(){

      Toast.show({ic:'⏱',title:drumWasOn?'Metronome On<br>Drums Off':'Metronome On',sub:'',cat:'beat'});
    } else {
      Toast.show({ic:'⏱',title:'Metronome Off',sub:'',cat:'beat'});
    }
  },

  toggleDrum(){

    } else {

  },

  toggleCounting(){
    // 3-state cycle: off → counting → out-loud → off
    this._countState=(this._countState||0);
    this._countState=(this._countState+1)%3;
    const btn=document.getElementById('cmp-counting-btn');
    if(this._countState===1){
      this.countingOn=true;

    } else if(this._countState===2){

    } else {
