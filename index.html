<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06060f">
<title>Practice Buddies 🥋</title>
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}

/* ===== TOKENS ===== */
:root{
color-scheme:dark;
–bg:#06060f;
–surf:#10101e;
–surf2:#181828;
–red:#e8142a;
–red2:rgba(232,20,42,.28);
–gold:#f5c518;
–gold2:rgba(245,197,24,.22);
–jade:#00d97e;
–jade2:rgba(0,217,126,.22);
–ink:#f0e6d0;
–dim:rgba(240,230,208,.55);
–dimmer:rgba(240,230,208,.22);
–gR:0 0 14px rgba(232,20,42,.6);
–gG:0 0 14px rgba(245,197,24,.6);
–gJ:0 0 14px rgba(0,217,126,.6);
}

/* ===== BASE ===== */
body{
font-family:‘Arial Black’,‘Helvetica Neue’,Arial,sans-serif;
background-color:#06060f;background-color:var(–bg);
color:#f0e6d0;color:var(–ink);
-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

/* ===== VIEWS ===== */
.view{
position:fixed;top:60px;left:0;right:0;bottom:0;
display:none;flex-direction:column;overflow-y:auto;
-webkit-overflow-scrolling:touch;padding-top:60px;
}
.view.active{display:flex;}
#view-compose.active{display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ===== COMPOSE ===== */
@font-face{font-family:Bravura;font-style:normal;font-display:block;font-weight:400;src:local(“Bravura”),url(‘https://cdn.jsdelivr.net/npm/@vexflow-fonts/bravura/bravura.woff2’) format(‘woff2’);}
svg text.music,.cmp-nbtn svg text,#cmp-s3 svg text{font-family:‘Bravura’,‘Times New Roman’,serif !important;}
.cmp-ts-grid{padding-top:60px !important;}
.cinput{background:#10101e;background:var(–surf);border:1px solid rgba(240,230,208,.22);border:1px solid var(–dimmer);border-radius:7px;padding:11px 14px;color:#f0e6d0;color:var(–ink);font-family:inherit;font-size:13px;width:100%;outline:none;-webkit-appearance:none;}
.cinput:focus{border-color:#f5c518;border-color:var(–gold);}
/* Steps are absolutely positioned within the fixed view — always start at top:0 */
.cmp-step{display:none;}
.cmp-step.cmp-active{
display:flex;flex-direction:column;
position:absolute;top:0;right:0;bottom:0;left:0;
overflow-y:auto;-webkit-overflow-scrolling:touch;

z-index:1;
}
/* dragon background behind all compose steps */
.cmp-dragon-bg{
position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.cmp-dragon-bg svg{width:100%;height:100%;opacity:.055;}
/* dragon bg sits behind all steps */
/* — entry — */
.cmp-entry-hero{padding:10px 20px 4px;text-align:center;}
.cmp-entry-title{font-size:22px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(135deg,#e8142a,#f5c518);background:linear-gradient(135deg,var(–red),var(–gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.cmp-entry-sub{font-size:12px;color:rgba(240,230,208,.55);color:var(–dim);margin-top:4px;font-style:italic;font-family:Georgia,serif;}
.cmp-entry-btns{display:flex;flex-direction:column;gap:12px;padding:10px 20px 20px;}
.cmp-mode-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;border-radius:18px;border:none;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;width:100%;}
.cmp-mode-btn:active{transform:scale(.96);}
.cmb-ic{font-size:36px;line-height:1;}
.cmb-label{font-size:20px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;}
.cmb-sub{font-size:11px;opacity:.8;font-family:Georgia,serif;font-style:italic;}
.cmp-rhythm{background:linear-gradient(135deg,#003d8a,#0066dd);color:#fff;box-shadow:0 6px 28px rgba(0,102,221,.45);}
.cmp-pitch{background:linear-gradient(135deg,#005c3a,#00d97e);color:#fff;box-shadow:0 6px 28px rgba(0,217,126,.38);}
.cmp-both{background:linear-gradient(135deg,#6e0000,#e8142a);color:#fff;box-shadow:0 6px 28px rgba(232,20,42,.45);}
/* — time sig screen — */
.cmp-step-hdr{padding:8px 16px 4px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#f5c518;color:var(–gold);}
.cmp-ts-mascots{display:flex;justify-content:space-around;align-items:flex-end;padding:0 20px 2px;pointer-events:none;}
.cmp-ts-mascots svg{opacity:.82;filter:drop-shadow(0 0 14px rgba(245,197,24,.25));width:54px !important;height:64px !important;}
/* FEATURE 1+2: stacked numeral card buttons */
.cmp-ts-grid{display:flex;flex-wrap:wrap;gap:11px;padding:8px 16px 24px;justify-content:center;}
.cmp-ts-btn{
display:flex;flex-direction:column;align-items:center;justify-content:center;
min-width:74px;padding:14px 10px 10px;border-radius:16px;
border:2px solid rgba(245,197,24,.18);
background:linear-gradient(160deg,#181828,#10101e);
background:linear-gradient(160deg,var(–surf2),var(–surf));
color:#f0e6d0;color:var(–ink);font-family:inherit;
cursor:pointer;-webkit-tap-highlight-color:transparent;
box-shadow:0 3px 12px rgba(0,0,0,.4);
position:relative;overflow:hidden;
}
.cmp-ts-btn::before{
content:’’;position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(to right,rgba(245,197,24,.5),transparent);
}
.cmp-ts-btn:active,.cmp-ts-btn.on{
background:linear-gradient(135deg,rgba(245,197,24,.18),rgba(232,20,42,.14));
border-color:#f5c518;border-color:var(–gold);
box-shadow:0 0 20px rgba(245,197,24,.35),0 4px 16px rgba(0,0,0,.5);
transform:scale(.96);
}
/* stacked top/bottom numerals — proper music notation style */
.cmp-tsn-wrap{display:flex;flex-direction:column;align-items:center;line-height:1;gap:0;}
.cmp-tsn-top{font-size:24px;font-weight:900;color:#f5c518;color:var(–gold);line-height:1;}
.cmp-tsn-bot{font-size:24px;font-weight:900;color:#f0e6d0;color:var(–ink);line-height:1;}
.cmp-ts-name{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,230,208,.5);margin-top:6px;}
.cmp-ts-btn-text{font-size:13px;font-weight:900;color:rgba(240,230,208,.55);}/* Make Your Own */
/* — compose step (step 3) — */
.cmp-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#10101e;background:var(–surf);border-bottom:1px solid rgba(245,197,24,.22);border-bottom:1px solid var(–gold2);flex-shrink:0;}
.cmp-back-btn{padding:7px 10px;border-radius:8px;border:none;background:transparent;color:rgba(240,230,208,.55);color:var(–dim);font-family:inherit;font-weight:900;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-submit-btn{padding:9px 16px;border-radius:9px;border:none;background:#f5c518;background:var(–gold);color:#111;font-family:inherit;font-weight:900;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-ts-label{font-size:16px;font-weight:900;color:#f5c518;color:var(–gold);letter-spacing:.1em;}
/* LAYOUT FIX 1+2: input area above staff, no overlap */
.cmp-input-area{flex-shrink:0;padding:8px 14px 4px;background:#0d0d1a;border-bottom:1px solid rgba(245,197,24,.1);}
.cmp-input-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#f5c518;color:var(–gold);margin-bottom:5px;margin-top:4px;}
.cmp-note-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.cmp-note-row::-webkit-scrollbar{display:none;}
.cmp-nbtn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 7px 6px;border-radius:11px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:52px;}
.cmp-nbtn:active,.cmp-nbtn.sel{border-color:#f5c518;border-color:var(–gold);background:rgba(245,197,24,.1);}
.cmp-nbtn svg{display:block;}
.cmp-nbtn-lbl{font-size:8px;color:#000;text-align:center;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;}
.cmp-edit-row{display:flex;gap:7px;padding:7px 0 4px;}
.cmp-triplet-btn{padding:10px 12px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.cmp-triplet-btn.on{border-color:#e8142a;border-color:var(–red);background:rgba(232,20,42,.28);background:var(–red2);}
.cmp-edit-btn{flex:1;padding:10px 6px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.cmp-edit-btn:active{background:rgba(232,20,42,.28);background:var(–red2);border-color:#e8142a;border-color:var(–red);}
.cmp-tempo-row{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-shrink:0;}
.cmp-tempo-btn{flex:1;padding:11px;border-radius:10px;border:2px solid rgba(240,230,208,.22);border:2px solid var(–dimmer);background:#10101e;background:var(–surf);color:#f0e6d0;color:var(–ink);font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cmp-tempo-btn:active{background:#e8142a;background:var(–red);border-color:#e8142a;border-color:var(–red);}
.cmp-tempo-disp{flex:1.6;text-align:center;font-size:17px;font-weight:900;color:#f5c518;color:var(–gold);letter-spacing:.06em;}
/* LAYOUT FIX 2: staff never overlaps adjacent elements */
.cmp-staff-wrap{flex-shrink:0;margin:4px 14px;border-radius:10px;background:#0b0b18;border:1px solid rgba(245,197,24,.22);border:1px solid var(–gold2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;height:88px;display:flex;align-items:center;}
#cmp-svg{width:100%;display:block;}
.cmp-playbar{display:flex;gap:10px;padding:6px 14px 2px;flex-shrink:0;justify-content:center;}
.cmp-play-btn{width:50px;height:50px;border-radius:50%;border:2px solid rgba(245,197,24,.22);border:2px solid var(–gold2);background:#10101e;background:var(–surf);color:#f5c518;color:var(–gold);font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;}
.cmp-play-btn:active,.cmp-play-btn.on{background:#f5c518;background:var(–gold);color:#111;border-color:#f5c518;border-color:var(–gold);}
.cmp-title-row{padding:6px 14px 14px;flex-shrink:0;}

/* ===== TOAST ===== */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:min(360px,90vw);}
.toast{
background:var(–surf);border:1px solid var(–gold);border-radius:10px;
padding:11px 15px;display:flex;align-items:center;gap:10px;
box-shadow:0 4px 30px rgba(0,0,0,.5),var(–gG);

}
.toast.e{border-color:var(–red);}
.toast.s{border-color:var(–jade);}
.t-ic{font-size:26px;} .t-body{flex:1;} .t-title{font-size:13px;font-weight:900;} .t-sub{font-size:11px;color:var(–dim);}
/* score floats */
.sf{position:fixed;font-size:22px;font-weight:900;color:var(–jade);pointer-events:none;z-index:500;}
.sf.w{color:var(–red);}
</style>

</head>
<body>

<!-- ======= TOAST CONTAINER ======= -->

<div id="toasts"></div>

<!-- ======= COMPOSE ======= -->

<div id="view-compose" class="view active">

  <!-- STEP 1: Mode Entry -->

  <div id="cmp-s1" class="cmp-step cmp-active">
    <div class="cmp-entry-hero">
      <div class="cmp-entry-title">✏️ Compose</div>
      <div class="cmp-entry-sub">Choose your path, young warrior.</div>
    </div>
    <div class="cmp-entry-btns">
      <button class="cmp-mode-btn cmp-rhythm" onclick="Cmp.pickMode('rhythm')">
        <span class="cmb-ic">🥁</span>
        <span class="cmb-label">Rhythm</span>
        <span class="cmb-sub">Pattern &amp; time — no wrong notes</span>
      </button>
      <button class="cmp-mode-btn cmp-pitch" onclick="Cmp.pickMode('pitch')">
        <span class="cmb-ic">🎵</span>
        <span class="cmb-label">Pitch</span>
        <span class="cmb-sub">Notes &amp; melody only</span>
      </button>
      <button class="cmp-mode-btn cmp-both" onclick="Cmp.pickMode('both')">
        <span class="cmb-ic">🔥</span>
        <span class="cmb-label">Both (If You Dare!)</span>
        <span class="cmb-sub">Rhythm + pitch. The full challenge.</span>
      </button>
    </div>
  </div>

  <!-- STEP 2: Time Signature -->

  <div id="cmp-s2" class="cmp-step">
    <button class="cmp-edit-btn" onclick="Cmp.goBack()" style="position:absolute;top:10px;left:14px;flex:unset;padding:8px 14px;z-index:2">‹ Back</button>
    <div class="cmp-step-hdr">⏱ Pick Your Time Signature</div>
    <div class="cmp-ts-grid" id="cmp-ts-grid"></div>
  </div>

  <!-- STEP 3: Composition -->

  <div id="cmp-s3" class="cmp-step">
    <div class="cmp-topbar">
      <button class="cmp-edit-btn" onclick="Cmp.goBack()" style="flex:unset;padding:8px 14px">‹ Back</button>
      <span class="cmp-ts-label" id="cmp-ts-label">4/4</span>
      <button class="cmp-submit-btn" onclick="Cmp.submit()">Submit 📤</button>
    </div>

<!-- LAYOUT FIX 1: note/rest buttons moved to header area, above staff -->

<div class="cmp-input-area">
  <div class="cmp-input-label">Notes</div>
  <div class="cmp-note-row" id="cmp-note-row"></div>
  <div class="cmp-input-label" style="margin-top:7px">Rests</div>
  <div class="cmp-note-row" id="cmp-rest-row"></div>
  <div class="cmp-edit-row">
    <button class="cmp-triplet-btn" id="cmp-triplet-btn" onclick="Cmp.toggleTriplet()">³ Triplet</button>
    <button class="cmp-edit-btn" onclick="Cmp.undo()">↩ Undo</button>
    <button class="cmp-edit-btn" onclick="Cmp.trash()">🗑 Rest</button>
    <button class="cmp-edit-btn" style="color:#e8142a;border-color:rgba(232,20,42,.4)" onclick="Cmp.nuke()">💣 Nuke</button>
  </div>
</div>

<!-- Tempo controls below input, above staff -->

<div class="cmp-tempo-row">
  <button class="cmp-tempo-btn" id="cmp-slower-btn"
    ontouchstart="Cmp.startHold(-1)" ontouchend="Cmp.endHold()" ontouchcancel="Cmp.endHold()">🐢 Slower</button>
  <div class="cmp-tempo-disp" id="cmp-tempo-disp">♩ = 60</div>
  <button class="cmp-tempo-btn" id="cmp-faster-btn"
    ontouchstart="Cmp.startHold(1)" ontouchend="Cmp.endHold()" ontouchcancel="Cmp.endHold()">⚡ Faster</button>
</div>

<!-- Staff — nothing overlaps it -->

<div class="cmp-staff-wrap">
  <svg id="cmp-svg" preserveAspectRatio="none"></svg>
</div>

<!-- Playback controls below staff -->

<div class="cmp-playbar">
  <button class="cmp-play-btn" id="cmp-play-btn" onclick="Cmp.play()" title="Play">▶</button>
  <button class="cmp-play-btn" onclick="Cmp.pause()" title="Pause">⏸</button>
  <button class="cmp-play-btn" onclick="Cmp.stop()" title="Stop">⏹</button>
</div>

<div class="cmp-title-row">
  <input class="cinput" id="c-title" type="text" placeholder="Song title...">
</div>

  </div>

</div>

<script>
'use strict';

// ─────────────────────────────────────────
// DATA
// ─────────────────────────────────────────

const BADGES = [{id:'composer',ic:'✏️',name:'Composer',desc:'Submit a song to the library',xp:100}];

// ─────────────────────────────────────────
// STORE & USER
// ─────────────────────────────────────────

const S = {
  get(k,d=null){try{return JSON.parse(localStorage.getItem('pb_'+k))??d;}catch{return d;}},
  set(k,v){try{localStorage.setItem('pb_'+k,JSON.stringify(v));}catch{}},
};

const U = {
  _c:null,
  blank(){return{mascot:'panda',xp:0,streak:0,lastPractice:null,songsPlayed:0,songsCompleted:[],badges:[],totalPerfect:0,drillSessions:0};},
  get(){return this._c||(this._c=S.get('user',this.blank()));},
  save(){S.set('user',this._c);},
  up(fn){fn(this.get());this.save();return this._c;},
  addXP(n){this.up(u=>u.xp=(u.xp||0)+n);},
  badge(id){
    const u=this.get();
    if(u.badges.includes(id))return false;
    const b=BADGES.find(x=>x.id===id);
    this.up(u=>{u.badges.push(id);u.xp=(u.xp||0)+(b?.xp||0);});
    if(b)Toast.show({ic:b.ic,title:'Badge Unlocked!',sub:b.name});
    return true;
  },
};

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────

const Toast = {
  show({ic='🎵',title='',sub='',type=''}){
    const el=document.createElement('div');
    el.className=`toast${type==='e'?' e':type==='s'?' s':''}`;
    el.innerHTML=`<span class="t-ic">${ic}</span><div class="t-body"><div class="t-title">${title}</div><div class="t-sub">${sub}</div></div>`;
    document.getElementById('toasts').appendChild(el);
    setTimeout(()=>{el.style.animation='t-out .28s ease-in forwards';setTimeout(()=>el.remove(),280);},3200);
  },
};

// ─────────────────────────────────────────
// COMPOSE SHEET RENDERER
// ─────────────────────────────────────────

const CmpSheet = {
  ST:22, SB:54,
  NY:{
    'G5':14,'F5':18,'E5':22,'D5':26,'C5':30,'B4':34,'A4':38,'G4':42,
    'F4':46,'E4':50,'D4':54,'C4':58,'B3':62,'A3':66,'G3':70,
    'C#4':58,'D#4':54,'F#4':46,'G#4':42,'A#4':38,'C#5':30,'D#5':26,
  },

  noteIcon(d,dot,rest){
    let body='';
    if(rest){
      // Rests — proper glyphs, not note-shapes
      if(d===1)      body=`<rect x="10" y="20" width="16" height="5" fill="#000"/>`;
      else if(d===2) body=`<rect x="10" y="25" width="16" height="5" fill="#000"/>`;
      else if(d===4) body=`<path d="M14 12 Q22 18 16 24 Q22 28 15 34 L13 38 Q18 32 13 30 Q10 26 17 22 Q11 18 15 14" fill="#000" stroke="#000" stroke-width="1"/>`;
      else if(d===8) body=`<circle cx="13" cy="26" r="2.5" fill="#000"/><line x1="15" y1="26" x2="18" y2="14" stroke="#000" stroke-width="1.6"/>`;
      else           body=`<circle cx="11" cy="30" r="2" fill="#000"/><circle cx="15" cy="22" r="2" fill="#000"/><line x1="17" y1="22" x2="21" y2="8" stroke="#000" stroke-width="1.6"/>`;
    } else {
      const open=d<=2;
      const head=open
        ?`<ellipse cx="14" cy="30" rx="5.5" ry="4" fill="none" stroke="#000" stroke-width="1.8" transform="rotate(-18 14 30)"/>`
        :`<ellipse cx="14" cy="30" rx="5.5" ry="4" fill="#000" transform="rotate(-18 14 30)"/>`;
      const stem=d>1?`<line x1="19" y1="30" x2="19" y2="10" stroke="#000" stroke-width="1.6"/>`:'';
      let flag='';
      if(d>=8)  flag=`<path d="M19 10 Q27 14 25 22" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      if(d>=16) flag+=`<path d="M19 22 Q27 26 25 34" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      body=head+stem+flag;
    }
    const dotEl=dot?`<circle cx="24" cy="30" r="1.8" fill="#000"/>`:'';
    return `<svg viewBox="0 0 32 44" width="30" height="40">${body}${dotEl}</svg>`;
  },

  _restSVG(d){
    let sh='';
    if(d===1)sh=`<rect x="6" y="22" width="20" height="7" rx="1" fill="var(--ink)"/><line x1="4" y1="22" x2="28" y2="22" stroke="var(--ink)" stroke-width="1.4"/>`;
    else if(d===2)sh=`<rect x="6" y="29" width="20" height="7" rx="1" fill="var(--ink)"/><line x1="4" y1="36" x2="28" y2="36" stroke="var(--ink)" stroke-width="1.4"/>`;
    else if(d===4)sh=`<path d="M18 12 C24 16 21 21 17 23 C22 25 22 30 17 33 L15 38 M15 38 C17 32 12 31 13 26 C13 21 18 20 19 17 C18 14 15 13 17 11" stroke="var(--ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    else if(d===8)sh=`<circle cx="14" cy="26" r="4" fill="var(--ink)"/><line x1="18" y1="26" x2="26" y2="12" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/><path d="M26 12 C31 16 29 23 22 25" stroke="var(--ink)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    else sh=`<circle cx="11" cy="24" r="3.5" fill="var(--ink)"/><line x1="14" y1="24" x2="22" y2="10" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/><path d="M22 10 C27 14 25 21 18 23" stroke="var(--ink)" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="18" cy="32" r="3.5" fill="var(--ink)"/><line x1="21" y1="32" x2="29" y2="18" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/><path d="M29 18 C34 22 32 29 25 31" stroke="var(--ink)" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 36 46" width="30" height="40">${sh}</svg>`.replace(/var\(--ink\)/g,'#000');
  },

  render(svgEl, state){
    const {notes,ts,totalMeasures}=state;
    if(!ts){svgEl.innerHTML='';return;}
    const mLeft=68,H=90,ST=this.ST,SB=this.SB;
    const vp=svgEl.parentElement?.clientWidth||600;
    const mW=Math.max(80,(vp-mLeft)/4);
    const W=mLeft+totalMeasures*mW;
    svgEl.style.width=W+'px';
    svgEl.style.flexShrink='0';
    const lc=['#8B0000','#B8860B','#d4a800','#B8860B','#8B0000'];
    let s=`<rect width="${W}" height="${H}" fill="#0b0b18"/>`;
    // Staff lines
    for(let i=0;i<5;i++){
      const y=ST+i*8;
      s+=`<line x1="4" y1="${y}" x2="${W-4}" y2="${y}" stroke="${lc[i]}" stroke-width="1.3" opacity=".7"/>`;
    }
    // Neutral/rhythm clef — two vertical bars (hand-drawn, font-independent)
    s+=`<rect x="10" y="${ST+3}" width="3.5" height="${SB-ST-6}" fill="#f5c518" opacity=".9"/><rect x="17" y="${ST+3}" width="3.5" height="${SB-ST-6}" fill="#f5c518" opacity=".9"/>`;
    // Time sig
    s+=`<text x="52" y="${ST+14}" font-size="13" font-family="'Times New Roman',serif" fill="#f5c518" text-anchor="middle">${ts.b}</text>`;
    s+=`<text x="52" y="${ST+27}" font-size="13" font-family="'Times New Roman',serif" fill="#f5c518" text-anchor="middle">${ts.v}</text>`;
    // Measures
    const measures=this._getMeasures(notes,ts.cap,totalMeasures);
    for(let mi=0;mi<totalMeasures;mi++){
      const mx=mLeft+mi*mW;
      s+=`<line x1="${mx}" y1="${ST}" x2="${mx}" y2="${SB}" stroke="rgba(245,197,24,.35)" stroke-width="1"/>`;
      const mNotes=measures[mi]||[];
      const filled=mNotes.reduce((a,n)=>a+n.dur8,0);
      const remaining=ts.cap-filled;
      // Draw actual notes (neighbor-aware spacing: floor at prevNx+18 so consecutive short notes don't stack)
      let prevNx=mx;
      mNotes.forEach((n,i)=>{
        const baseNx=mx+((n.startBeat8+n.dur8/2)/ts.cap)*mW;
        const nx=i===0?Math.max(mx+15,baseNx):Math.max(prevNx+18,baseNx);
        prevNx=nx;
        s+=this._drawNote(n,nx,ST,SB);
      });
      // Fill remaining with rest
      if(remaining>0.01){
        const rx=mx+(filled/ts.cap)*mW+(remaining/ts.cap)*mW*0.5;
        s+=this._drawRest(remaining,ts.cap,rx,ST,SB);
      }
    }
    // Ties
    s+=this._drawTies(notes,measures,mLeft,mW,ts);
    // Triplet brackets
    s+=this._drawTriplets(notes,measures,mLeft,mW,ts,ST);
    // Final double barline
    const ex=mLeft+totalMeasures*mW;
    s+=`<line x1="${ex}" y1="${ST}" x2="${ex}" y2="${SB}" stroke="rgba(245,197,24,.7)" stroke-width="2.5"/>`;
    s+=`<line x1="${ex+5}" y1="${ST}" x2="${ex+5}" y2="${SB}" stroke="rgba(245,197,24,.7)" stroke-width="6"/>`;
    // Playhead (hidden until play)
    s+=`<g id="cmp-playhead" transform="translate(68,0)"><polygon points="-5,12 5,12 0,22" fill="#f5c518" opacity="0.9"/><line x1="0" y1="22" x2="0" y2="58" stroke="#f5c518" stroke-width="1.5" opacity="0.9"/></g>`;
    svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svgEl.setAttribute('height',H);
    svgEl.innerHTML=s;
    // Entry-follow: smooth-scroll the current note into view if past right edge
    const cur=svgEl.querySelector('ellipse[rx="15"][ry="10"]');
    if(cur){
      const curNx=parseFloat(cur.getAttribute('cx'));
      const par=svgEl.parentElement;
      if(par && curNx>par.scrollLeft+par.clientWidth-40){
        par.scrollTo({left:Math.max(0,curNx-mLeft-20),behavior:'smooth'});
      }
    }
  },

  _getMeasures(notes,cap,total){
    const ms=Array.from({length:total},()=>[]);
    let cum=0;
    notes.forEach(n=>{
      const mi=Math.min(Math.floor(cum/cap),total-1);
      const sb=cum-mi*cap;
      ms[mi].push({...n,startBeat8:sb});
      cum+=n.dur8;
    });
    return ms;
  },

  _drawNote(n,nx,ST,SB){
    if(n.rest)return this._drawRest(n.dur8,999,nx,ST,SB);
    const ny=this.NY[n.p]||ST+28;
    const isCur=n.current;
    const fill=isCur?'#f5c518':'rgba(240,230,208,.75)';
    const open=n.d<=2;
    let s='';
    if(isCur) s+=`<ellipse cx="${nx}" cy="${ny}" rx="15" ry="10" fill="rgba(245,197,24,.11)"/>`;
    // Ledger lines
    for(let ly=SB+8;ly<=ny;ly+=8) s+=`<line x1="${nx-9}" y1="${ly}" x2="${nx+9}" y2="${ly}" stroke="${fill}" stroke-width="1.2" opacity=".8"/>`;
    for(let ly=ST-8;ly>=ny;ly-=8) s+=`<line x1="${nx-9}" y1="${ly}" x2="${nx+9}" y2="${ly}" stroke="${fill}" stroke-width="1.2" opacity=".8"/>`;
    // Notehead
    if(open) s+=`<ellipse cx="${nx}" cy="${ny}" rx="6" ry="4" fill="none" stroke="${fill}" stroke-width="1.7" transform="rotate(-15 ${nx} ${ny})"/>`;
    else s+=`<ellipse cx="${nx}" cy="${ny}" rx="6" ry="4" fill="${fill}" transform="rotate(-15 ${nx} ${ny})"/>`;
    // Stem
    if(n.d!==1){
      const up=ny>ST+16;
      const sx=up?nx+5.4:nx-5.4;
      const sy2=ny+(up?-24:24);
      s+=`<line x1="${sx}" y1="${ny}" x2="${sx}" y2="${sy2}" stroke="${fill}" stroke-width="1.4"/>`;
      if(n.d>=8){
        const fdir=up?1:-1;
        s+=`<path d="M${sx} ${sy2} C${sx+12*fdir} ${sy2+6*fdir} ${sx+14*fdir} ${sy2+13*fdir} ${sx+6*fdir} ${sy2+18*fdir}" stroke="${fill}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      }
      if(n.d>=16){
        const fdir=up?1:-1;
        s+=`<path d="M${sx} ${sy2+6*fdir} C${sx+12*fdir} ${sy2+12*fdir} ${sx+14*fdir} ${sy2+19*fdir} ${sx+6*fdir} ${sy2+24*fdir}" stroke="${fill}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      }
    }
    if(n.dot) s+=`<circle cx="${nx+8}" cy="${ny-2}" r="2" fill="${fill}"/>`;
    if(n.p&&n.p.includes('#')) s+=`<text x="${nx-8}" y="${ny+4}" font-size="10" fill="${fill}" font-family="'Times New Roman',serif" text-anchor="end">♯</text>`;
    return s;
  },

  _drawRest(dur8,cap,cx,ST,SB){
    const mid=ST+(SB-ST)/2, col='rgba(240,230,208,.7)';
    if(dur8>=cap)    return `<rect x="${cx-8}" y="${mid-5}" width="16" height="5" fill="${col}"/>`;
    if(dur8>=4)      return `<rect x="${cx-8}" y="${mid}" width="16" height="5" fill="${col}"/>`;
    if(dur8>=2)      return `<path d="M${cx-2} ${mid-8} Q${cx+5} ${mid-2} ${cx-1} ${mid+2} Q${cx+5} ${mid+6} ${cx-3} ${mid+10}" fill="${col}" stroke="${col}" stroke-width="1"/>`;
    if(dur8>=1)      return `<circle cx="${cx-2}" cy="${mid}" r="2.2" fill="${col}"/><line x1="${cx}" y1="${mid}" x2="${cx+4}" y2="${mid-10}" stroke="${col}" stroke-width="1.4"/>`;
    return `<circle cx="${cx-4}" cy="${mid+3}" r="2" fill="${col}"/><circle cx="${cx}" cy="${mid-3}" r="2" fill="${col}"/><line x1="${cx+2}" y1="${mid-3}" x2="${cx+6}" y2="${mid-12}" stroke="${col}" stroke-width="1.4"/>`;
  },

  _drawTies(notes,measures,mLeft,mW,ts){
    let s='';
    for(let i=1;i<notes.length;i++){
      if(!notes[i].tied)continue;
      const p1=this._noteX(i-1,notes,mLeft,mW,ts);
      const p2=this._noteX(i,notes,mLeft,mW,ts);
      if(p1===null||p2===null)continue;
      const ny=(this.NY[notes[i-1].p]||50)+8;
      const mx=(p1+p2)/2;
      s+=`<path d="M${p1} ${ny} Q${mx} ${ny+10} ${p2} ${ny}" stroke="rgba(240,230,208,.45)" stroke-width="1.5" fill="none"/>`;
    }
    return s;
  },

  _drawTriplets(notes,measures,mLeft,mW,ts,ST){
    let s='';
    for(let i=0;i<notes.length;i++){
      if(notes[i].triplet&&notes[i].tripletPos===0){
        const x1=this._noteX(i,notes,mLeft,mW,ts);
        const x3=this._noteX(Math.min(i+2,notes.length-1),notes,mLeft,mW,ts);
        if(x1===null||x3===null)continue;
        const mx=(x1+x3)/2;
        s+=`<text x="${mx}" y="${ST-3}" font-size="10" fill="rgba(240,230,208,.6)" text-anchor="middle" font-style="italic">3</text>`;
        s+=`<line x1="${x1+2}" y1="${ST-2}" x2="${mx-6}" y2="${ST-2}" stroke="rgba(240,230,208,.3)" stroke-width="1"/>`;
        s+=`<line x1="${mx+6}" y1="${ST-2}" x2="${x3-2}" y2="${ST-2}" stroke="rgba(240,230,208,.3)" stroke-width="1"/>`;
      }
    }
    return s;
  },

  _noteX(idx,notes,mLeft,mW,ts){
    let cum=0;for(let i=0;i<idx;i++)cum+=notes[i].dur8;
    const mi=Math.floor(cum/ts.cap);
    const b8=cum-mi*ts.cap;
    if(mi>=(mLeft+mW*4)/mW)return null;
    return mLeft+mi*mW+(b8/ts.cap)*mW+Math.max(6,(notes[idx].dur8/ts.cap)*mW*0.45);
  },
};

// ─────────────────────────────────────────
// COMPOSE ENGINE
// ─────────────────────────────────────────

const Cmp = {
  step:'entry', mode:null,
  ts:null, tempo:60,
  notes:[], durSel:4, dotSel:false, tripletMode:false,
  playing:false, playTimer:null,
  totalMeasures:4,

  TIME_SIGS:[
    {label:'Cut Time', sub:'2/2',  b:2,  v:2, cap:8,  beatUnit:2, bul:'𝅗𝅥'},
    {label:'Common',   sub:'4/4',  b:4,  v:4, cap:8,  beatUnit:4, bul:'♩'},
    {label:'2/4',      sub:'',     b:2,  v:4, cap:4,  beatUnit:4, bul:'♩'},
    {label:'3/4',      sub:'',     b:3,  v:4, cap:6,  beatUnit:4, bul:'♩'},
    {label:'5/4',      sub:'',     b:5,  v:4, cap:10, beatUnit:4, bul:'♩'},
    {label:'6/4',      sub:'',     b:6,  v:4, cap:12, beatUnit:4, bul:'♩'},
    {label:'6/8',      sub:'',     b:6,  v:8, cap:6,  beatUnit:4, bul:'♩.'},
    {label:'9/8',      sub:'',     b:9,  v:8, cap:9,  beatUnit:4, bul:'♩.'},
    {label:'3/8',      sub:'',     b:3,  v:8, cap:3,  beatUnit:8, bul:'♪'},
    {label:'12/8',     sub:'',     b:12, v:8, cap:12, beatUnit:4, bul:'♩.'},
    {label:'7/8',      sub:'',     b:7,  v:8, cap:7,  beatUnit:8, bul:'♪'},
    {label:'Make Your Own', sub:'',b:4,  v:4, cap:8,  beatUnit:4, bul:'♩', placeholder:true},
  ],

  NOTE_DURS:[
    {d:1, dot:false, label:'Whole'},
    {d:2, dot:false, label:'Half'},
    {d:2, dot:true,  label:'Dot. Half'},
    {d:4, dot:false, label:'Quarter'},
    {d:8, dot:false, label:'Eighth'},
    {d:16,dot:false, label:'16th'},
  ],

  init(){
    this._buildTimeSigs();
    this._buildNoteButtons();
    // iOS Safari doesn't re-layout SVG text on font-swap — rebuild buttons once Bravura loads
    if(document.fonts?.ready) document.fonts.ready.then(()=>this._buildNoteButtons());

    // FIX 4: wire time sig buttons via addEventListener (both click + touchend)
    // Bypasses any onclick attribute issues on iOS Safari with dynamic content
    document.querySelectorAll('#cmp-ts-grid button[data-idx]').forEach(btn=>{
      const i=parseInt(btn.dataset.idx,10);
      const handler=(e)=>{
        e.preventDefault();
        this.pickTs(i);
      };
      btn.addEventListener('click',handler);
      btn.addEventListener('touchend',handler);
    });

    if(!this.ts) this._showStep('entry');
    else this._showStep(this.step);
    if(this.step==='compose') this.render();
  },

  _showStep(s){
    const map={entry:'cmp-s1',timesig:'cmp-s2',compose:'cmp-s3'};
    // Remove all active states first
    ['cmp-s1','cmp-s2','cmp-s3'].forEach(id=>{
      document.getElementById(id)?.classList.remove('cmp-active');
    });
    // Add active state in next animation frame — iOS Safari requires this
    // gap between display:none removal and display:flex+animation start
    const target=document.getElementById(map[s]);
    if(target){
        target.classList.add('cmp-active');
    }
    this.step=s;
  },

  _buildTimeSigs(){
    const grid=document.getElementById('cmp-ts-grid');if(!grid)return;
    // FIX 4: use data-idx, no onclick attribute — addEventListener wired in init()
    grid.innerHTML=this.TIME_SIGS.map((ts,i)=>{
      const dim=ts.placeholder?'style="opacity:.42"':'';
      if(ts.placeholder){
        return `<button class="cmp-ts-btn" data-idx="${i}" ${dim}>
          <span class="cmp-ts-btn-text">Make Your Own</span>
        </button>`;
      }
      return `<button class="cmp-ts-btn" data-idx="${i}" ${dim}>
        <div class="cmp-tsn-wrap">
          <span class="cmp-tsn-top">${ts.b}</span>
          <span class="cmp-tsn-bot">${ts.v}</span>
        </div>
      </button>`;
    }).join('');
  },

  _buildNoteButtons(){
    const nr=document.getElementById('cmp-note-row');
    const rr=document.getElementById('cmp-rest-row');
    if(!nr||!rr)return;
    nr.innerHTML=this.NOTE_DURS.map((n,i)=>`
      <button class="cmp-nbtn" id="cnb-n-${i}" onclick="Cmp.addEntry('C4',${n.d},${n.dot},false)">
        ${CmpSheet.noteIcon(n.d,n.dot,false)}
        <span class="cmp-nbtn-lbl">${n.label}</span>
      </button>`).join('');
    rr.innerHTML=this.NOTE_DURS.map((n,i)=>`
      <button class="cmp-nbtn" id="cnb-r-${i}" onclick="Cmp.addEntry('REST',${n.d},${n.dot},true)">
        ${CmpSheet.noteIcon(n.d,n.dot,true)}
        <span class="cmp-nbtn-lbl">${n.label}</span>
      </button>`).join('');
  },

  pickMode(mode){
    this.mode=mode;
    if(mode!=='rhythm'){
      Toast.show({ic:'🔨',title:'Coming Soon!',sub:'Pitch & Both modes are under construction. Proceeding with Rhythm.',type:'e'});
    }
    this._showStep('timesig');
  },

  pickTs(i){
    const ts=this.TIME_SIGS[i];
    console.log('time sig selected:',ts);
    if(ts.placeholder){Toast.show({ic:'🔨',title:'Coming Soon!',sub:'Custom time sigs are in the works!',type:'e'});return;}
    this.ts=ts;this.tempo=60;this.notes=[];
    document.getElementById('cmp-ts-label').textContent=ts.sub||ts.label;
    this._updTempoDisp();
    this._showStep('compose');
    this.render();
  },

  goBack(){
    this.stop();
    if(this.step==='compose') this._showStep('timesig');
    else if(this.step==='timesig') this._showStep('entry');
  },

  // FEATURE 1 — hold-to-accelerate tempo
  _holdDir:0, _holdTimer:null, _holdInterval:null, _holdMs:0,
  startHold(dir){
    if(this._holdTimer)return;
    this._holdMs=0;
    this._stepTempo(dir); // immediate single tap
    this._holdTimer=setTimeout(()=>{
      this._holdInterval=setInterval(()=>{
        this._holdMs+=60;
        const rate=this._holdMs<800?1:this._holdMs<2000?2:5;
        this._stepTempo(dir*rate);
      },60);
    },400);
  },
  endHold(){
    clearTimeout(this._holdTimer);clearInterval(this._holdInterval);
    this._holdTimer=null;this._holdInterval=null;this._holdMs=0;
  },
  _stepTempo(delta){
    this.tempo=Math.min(280,Math.max(40,this.tempo+delta));
    this._updTempoDisp();
  },
  slower(){this._stepTempo(-1);},
  faster(){this._stepTempo(1);},
  _updTempoDisp(){
    const el=document.getElementById('cmp-tempo-disp');
    if(el) el.textContent=`♩ = ${this.tempo}`;
  },

  _dur8(d,dot){const base={1:8,2:4,4:2,8:1,16:0.5}[d]||2;return dot?base*1.5:base;},
  _totalCap(){return this.totalMeasures*(this.ts?.cap||8);},
  _filled(){return this.notes.reduce((a,n)=>a+n.dur8,0);},

  // BUG 3 — explicit triplet group tracking
  _tg:{base:0,count:0,accum:0}, // triplet group state

  addEntry(pitch,d,dot,isRest){
    if(!this.ts)return;
    let totalCap=this._totalCap();
    const filled=this._filled();

    // Only grow staff when incoming note actually overflows total cap
    if(filled+this._dur8(d,dot)>totalCap+0.001){
      this.totalMeasures++;
      totalCap=this._totalCap();
    }

    const baseDur8=this._dur8(d,dot);
    let dur8;

    if(this.tripletMode){
      // BUG 3 — group-aware triplet math
      if(this._tg.count===0){this._tg.base=baseDur8;this._tg.accum=0;}
      const targetGroup=this._tg.base*2; // "next value up" total duration
      if(this._tg.count<2){
        dur8=parseFloat((targetGroup/3).toFixed(6));
      } else {
        dur8=parseFloat((targetGroup-this._tg.accum).toFixed(6)); // exact remainder
      }
      this._tg.accum=parseFloat((this._tg.accum+dur8).toFixed(6));
      this._tg.count++;
      if(this._tg.count>=3){
        this._tg={base:0,count:0,accum:0};
        this.tripletMode=false;
        document.getElementById('cmp-triplet-btn')?.classList.remove('on');
      }
    } else {
      dur8=baseDur8;
    }

    const curMi=Math.floor(filled/this.ts.cap);
    const beatInMeasure=parseFloat((filled-curMi*this.ts.cap).toFixed(6));
    const remaining=parseFloat((this.ts.cap-beatInMeasure).toFixed(6));

    if(this.notes.length) this.notes[this.notes.length-1].current=false;

    const isTriplet=this.tripletMode||this._tg.count>0; // still in group?
    const tripletPos=(this._tg.count===0&&isTriplet)?2:this._tg.count===1?0:this._tg.count===2?1:null;

    if(dur8<=remaining+0.001){
      const actualDur8=Math.min(dur8,remaining); // BUG 2 — never exceed remaining
      this.notes.push({p:isRest?'REST':pitch,d,dot,dur8:actualDur8,rest:isRest,triplet:false,tripletPos:null,tied:false,current:true});
    } else {
      // Split with tie — first half fills measure, second goes to next
      const d1=this._closestDur(remaining);
      const part2=parseFloat((dur8-remaining).toFixed(6));
      const d2=this._closestDur(part2);
      this.notes.push({p:isRest?'REST':pitch,d:d1.d,dot:d1.dot,dur8:remaining,rest:isRest,triplet:false,tripletPos:null,tied:false,current:false});
      const newFilled=parseFloat((filled+remaining).toFixed(6));
      // BUG 2 — only add tie-continuation if still within cap
      if(newFilled<totalCap-0.001){
        const maxPart2=Math.min(part2,parseFloat((totalCap-newFilled).toFixed(6)));
        const d2b=this._closestDur(maxPart2);
        this.notes.push({p:isRest?'REST':pitch,d:d2b.d,dot:d2b.dot,dur8:maxPart2,rest:isRest,triplet:false,tripletPos:null,tied:true,current:true});
      }
    }

    this.render();
  },

  _curTripletPos(){let c=0;for(let i=this.notes.length-1;i>=0;i--){if(this.notes[i].triplet)c++;else break;}return c%3;},

  _closestDur(dur8){
    const opts=[
      {d:1,dot:false,dur8:8},{d:2,dot:true,dur8:6},{d:2,dot:false,dur8:4},
      {d:4,dot:true,dur8:3},{d:4,dot:false,dur8:2},{d:8,dot:false,dur8:1},{d:16,dot:false,dur8:0.5}
    ];
    return opts.reduce((best,o)=>Math.abs(o.dur8-dur8)<Math.abs(best.dur8-dur8)?o:best);
  },

  undo(){
    if(!this.notes.length){Toast.show({ic:'↩',title:'Nothing to undo',sub:'Staff is already empty.',type:'e'});return;}
    this.notes.pop();
    if(this.notes.length) this.notes[this.notes.length-1].current=true;
    // Reset triplet group if undoing into one
    this._tg={base:0,count:0,accum:0};
    this.render();
  },

  trash(){
    if(!this.notes.length)return;
    const n=this.notes[this.notes.length-1];
    n.p='REST';n.rest=true;this.render();
  },

  // FEATURE 2 — nuke entire composition
  nuke(){
    this.stop();this.notes=[];this.totalMeasures=4;this._tg={base:0,count:0,accum:0};
    this.tripletMode=false;
    document.getElementById('cmp-triplet-btn')?.classList.remove('on');
    Toast.show({ic:'💣',title:'Nuked.',sub:'Staff cleared. Start over, champion.'});
    this.render();
    document.getElementById('cmp-svg').parentElement.scrollLeft=0;
  },

  toggleTriplet(){
    this.tripletMode=!this.tripletMode;
    if(!this.tripletMode) this._tg={base:0,count:0,accum:0};
    document.getElementById('cmp-triplet-btn')?.classList.toggle('on',this.tripletMode);
    if(this.tripletMode) Toast.show({ic:'³',title:'Triplet Mode',sub:'Tap a note or rest — auto-exits after 3.'});
  },

  render(){
    const svg=document.getElementById('cmp-svg');if(!svg)return;
    CmpSheet.render(svg,{notes:this.notes,ts:this.ts,totalMeasures:this.totalMeasures});
  },

  // FEATURE 3 — WebAudio violin D4 synthesis with proper pause/stop
  _wac:null,   // WebAudioContext
  _wStart:0,   // audioCtx time when playback started
  _wPauseAt:0, // audioCtx time when paused
  _wPaused:false,
  _wNodes:[],  // all oscillator nodes (to cancel on stop)
  _wTimer:null,

  _secPerEighth(){
    if(!this.ts)return 0.25;
    // beatUnit tells us the BPM denominator: 4=quarter, 2=half, 8=eighth
    // For compound (♩.) the beat = dotted quarter = 3 eighths
    const bu=this.ts.beatUnit;
    const eighthsPerBeat=bu===2?4:bu===8?1:2; // half=4, quarter=2, eighth=1
    // compound time sigs (6/8, 9/8, 12/8) group in dotted quarters = 3 eighths per beat
    const isCompound=(this.ts.v===8&&this.ts.b%3===0&&this.ts.b>3);
    const ePB=isCompound?3:eighthsPerBeat;
    return (60/this.tempo)/ePB;
  },

  _getWAC(){
    if(!this._wac||this._wac.state==='closed'){
      this._wac=new(window.AudioContext||window.webkitAudioContext)();
    }
    return this._wac;
  },

  _playViolin(ctx,freq,startTime,durSec){
    // Clap sound — white-noise burst with sharp envelope (freq/durSec ignored; uniform clap per note)
    const bufLen=Math.floor(ctx.sampleRate*0.05);
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();
    filt.type='bandpass';filt.frequency.value=1500;filt.Q.value=1.2;
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0,startTime);
    gain.gain.linearRampToValueAtTime(0.6,startTime+0.003);
    gain.gain.exponentialRampToValueAtTime(0.001,startTime+0.045);
    src.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
    src.start(startTime);src.stop(startTime+0.05);
    return src;
  },

  play(){
    if(!this.ts)return;
    if(this._wac&&this._wac.state==='running'&&this.playing)return;

    // Playhead RAF tick — reads audio clock, positions #cmp-playhead
    this._phTick=()=>{
      const ph=document.getElementById('cmp-playhead');
      if(!ph||!this.playing||!this._wac)return;
      const sc=this._phSchedule;
      if(sc&&sc.length&&this._wac.state==='running'){
        const last=sc[sc.length-1];
        const t=Math.max(0,Math.min(this._wac.currentTime-this._wStart,last.t));
        let i=0;while(i<sc.length-1&&sc[i+1].t<=t)i++;
        const a=sc[i],b=sc[i+1]||a;
        const frac=b.t>a.t?(t-a.t)/(b.t-a.t):0;
        const x=a.x+(b.x-a.x)*frac;
        ph.setAttribute('transform',`translate(${x},0)`);
      }
      this._wRAF=requestAnimationFrame(this._phTick);
    };

    if(this._wPaused&&this._wac&&this._wac.state==='suspended'){
      // Resume from pause
      this._wac.resume();
      this.playing=true;
      document.getElementById('cmp-play-btn')?.classList.add('on');
      // Restart completion timer for remaining duration
      const elapsed=this._wPauseAt-this._wStart;
      const spe=this._secPerEighth();
      const total=this.notes.reduce((a,n)=>a+n.dur8*spe,0);
      const left=Math.max(0,total-elapsed)*1000;
      this._wTimer=setTimeout(()=>this._onPlayEnd(),left+200);
      this._wPaused=false;
      this._phTick();
      return;
    }

    if(this.notes.length===0){Toast.show({ic:'🎵',title:'Nothing to play',sub:'Add some notes first.',type:'e'});return;}

    this.stop();
    const ctx=this._getWAC();
    if(ctx.state==='suspended') ctx.resume();
    const spe=this._secPerEighth();
    const D4=293.66;
    let t=ctx.currentTime+0.05;
    this._wStart=t;
    this._wNodes=[];
    // Playback-follow: reset staff scroll to beginning, schedule per-measure scrolls
    const wrap=document.querySelector('.cmp-staff-wrap');
    if(wrap) wrap.scrollLeft=0;
    const cap=this.ts.cap, pMW=wrap?Math.max(80,(wrap.clientWidth-68)/4):140;
    this._phMeta={mLeft:68,mW:pMW,cap,spe,totalDur:this.notes.reduce((a,n)=>a+n.dur8*spe,0)};
    // Build playhead schedule: (time, drawn_x) per note, mirroring CmpSheet.render layout
    this._phSchedule=[];
    const pMs=CmpSheet._getMeasures(this.notes,cap,this.totalMeasures);
    for(let mi=0;mi<this.totalMeasures;mi++){
      const mx=68+mi*pMW;let prevNx=mx;
      (pMs[mi]||[]).forEach((n,i)=>{
        const baseNx=mx+((n.startBeat8+n.dur8/2)/cap)*pMW;
        const nx=i===0?Math.max(mx+15,baseNx):Math.max(prevNx+18,baseNx);
        prevNx=nx;
        this._phSchedule.push({t:(mi*cap+n.startBeat8)*spe,x:nx});
      });
    }
    this._phSchedule.push({t:this._phMeta.totalDur,x:68+this.totalMeasures*pMW});
    this._wScrollTimers=[];
    let beat8=0, lastMi=-1;

    this.notes.forEach(n=>{
      const dur=n.dur8*spe;
      if(!n.rest){
        const node=this._playViolin(ctx,D4,t,dur);
        if(node)this._wNodes.push(node);
      }
      if(wrap){
        const mi=Math.floor(beat8/cap);
        if(mi!==lastMi){
          lastMi=mi;
          const tid=setTimeout(()=>wrap.scrollTo({left:mi*pMW,behavior:'smooth'}),Math.max(0,(t-ctx.currentTime)*1000));
          this._wScrollTimers.push(tid);
        }
      }
      beat8+=n.dur8;
      t+=dur;
    });

    const totalMs=this.notes.reduce((a,n)=>a+n.dur8*spe,0)*1000;
    this.playing=true;this._wPaused=false;
    document.getElementById('cmp-play-btn')?.classList.add('on');
    this._wTimer=setTimeout(()=>this._onPlayEnd(),totalMs+300);
    this._phTick();
  },

  _onPlayEnd(){
    this.playing=false;this._wPaused=false;
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  pause(){
    if(!this.playing||!this._wac)return;
    clearTimeout(this._wTimer);
    this._wScrollTimers?.forEach(id=>clearTimeout(id));this._wScrollTimers=[];
    this._wPauseAt=this._wac.currentTime;
    this._wac.suspend();
    this.playing=false;this._wPaused=true;
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  stop(){
    clearTimeout(this._wTimer);
    this._wScrollTimers?.forEach(id=>clearTimeout(id));this._wScrollTimers=[];
    if(this._wRAF){cancelAnimationFrame(this._wRAF);this._wRAF=null;}
    const ph=document.getElementById('cmp-playhead');if(ph){ph.setAttribute('transform','translate(68,0)');ph.removeAttribute('display');}
    if(this._wac&&this._wac.state!=='closed'){
      try{this._wac.close();}catch(e){}
    }
    this._wac=null;this._wNodes=[];
    this.playing=false;this._wPaused=false;this._wPauseAt=0;this._wStart=0;
    document.getElementById('cmp-play-btn')?.classList.remove('on');
  },

  submit(){
    const title=document.getElementById('c-title')?.value.trim();
    if(!title){Toast.show({ic:'✏️',title:'Add a title',sub:'Give your song a name first.',type:'e'});return;}
    if(this.notes.filter(n=>!n.rest).length<4){Toast.show({ic:'🎵',title:'Too short',sub:'Add at least 4 notes.',type:'e'});return;}
    const u=U.get();
    const songs=S.get('user-songs',[]);
    songs.push({
      id:'u-'+Date.now(),title,
      composer:u.username||'Student',
      diff:2,tempo:this.tempo,
      ts:{b:this.ts.b,v:this.ts.v},ks:0,
      notes:this.notes.map(n=>({p:n.p,d:n.d,dot:!!n.dot})),
      userMade:true,stats:{plays:0,fails:0}
    });
    S.set('user-songs',songs);
    U.badge('composer');
    Toast.show({ic:'📤',title:'Submitted!',sub:`"${title}" is now in the library!`,type:'s'});
    this.notes=[];
    document.getElementById('c-title').value='';
    this.render();
    this._showStep('entry');
  },
};

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────

document.addEventListener('DOMContentLoaded',()=>{
  U.up(u=>{
    if(!u.badges)u.badges=[];
    if(!u.songsCompleted)u.songsCompleted=[];
  });
  Cmp.init();
});
</script>
