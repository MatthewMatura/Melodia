window.addEventListener('load', function(){
  var abc = 'X:1\nT:Test\nM:4/4\nL:1/4\nQ:1/4=120\nK:C\nC D E F | G A B c |]';
  var vo = ABCJS.renderAbc('notation', abc, {staffwidth:600, scale:2});

var lines = [];
lines.push(’abcjs loaded: ’ + (typeof ABCJS !== ‘undefined’));
lines.push(’renderAbc returned: ’ + (vo ? JSON.stringify(vo).slice(0,80) : ‘null’));

if(svg){
var ells = svg.querySelectorAll(‘ellipse’);
