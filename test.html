<!DOCTYPE html>

<html>
<head><title>TAP TEST</title>

</head>
<body style="background:#111;color:#fff;padding:20px;font-family:sans-serif;">
<h2 id="h">TAP TEST v4</h2>

document.getElementById('h').addEventListener('touchstart', function(){

});
</script>
</body>
</html>
