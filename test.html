<!DOCTYPE html>

<html>
<head><title>TAP TEST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="background:#111;color:#fff;padding:20px;font-family:sans-serif;">
<h2>TAP TEST v3</h2>
<div id="out" style="color:lime;font-size:1rem;margin:10px 0;line-height:1.8;">Loading...</div>
<div id="notation" style="background:white;padding:10px;border-radius:8px;min-height:50px;"></div>
<script>
document.getElementById('out').textContent = 'Script started';

// Load abcjs dynamically and report
var s = document.createElement(‘script’);
s.src = ‘https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js’;
s.onload = function(){
document.getElementById(‘out’).innerHTML = ‘abcjs loaded OK<br>’;
var abc = ‘X:1\nT:Test\nM:4/4\nL:1/4\nQ:1/4=120\nK:C\nC D E F | G A B c |]’;
var vo = ABCJS.renderAbc(‘notation’, abc, {staffwidth:600, scale:2});
var svg = document.querySelector(’#notation svg’);
var info = ‘SVG: ‘+(svg?‘YES w=’+svg.getAttribute(‘width’):‘NO’);
if(svg){
var ells = svg.querySelectorAll(‘ellipse’);
info += ’ ellipses:’+ells.length;
if(ells[0]) info += ’ cx=’+ells[0].getAttribute(‘cx’);
svg.addEventListener(‘touchstart’,function(e){
e.preventDefault();
document.getElementById(‘out’).innerHTML += ‘<br>TOUCH x=’+Math.round(e.touches[0].clientX);
},{passive:false});
}
document.getElementById(‘out’).innerHTML += info;
};
s.onerror = function(){
document.getElementById(‘out’).textContent = ‘FAILED to load abcjs from cdnjs’;
// Try unpkg as fallback
var s2 = document.createElement(‘script’);
s2.src = ‘https://unpkg.com/abcjs@6.4.0/dist/abcjs-basic-min.js’;
s2.onload = function(){ document.getElementById(‘out’).textContent += ’ | unpkg OK’; };
s2.onerror = function(){ document.getElementById(‘out’).textContent += ’ | unpkg ALSO FAILED’; };
document.head.appendChild(s2);
};
document.head.appendChild(s);
</script>

</body>
</html>
